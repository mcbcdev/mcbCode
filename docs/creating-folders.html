<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>mcbCode Docs | Introduction</title>

  <link rel="icon" href="https://mcbcode.com/theme/favicon.png">
  <link rel="stylesheet" href="https://mcbcode.com/theme/site.css">

    <!-- markdown styling -->
  <link rel="stylesheet" href="https://mcbcode.com/docs/elements/md-style.css">

  <!-- markdown parser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js" defer></script>

  <style>
    :root {
      --accent-color: #05ee93;
      --accent-dark: #00a459;
      --accent-glow: rgba(5, 238, 147, 0.25);
      --bg-color: #0c0c0c;
      --card-bg: rgba(18, 18, 18, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
      --text-muted: #bebebe;
      --code-bg: #111111;
    }

    *, *::before, *::after {
      font-weight: normal !important;
      border-radius: 0px !important;
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      margin: 0;
      font-family: 'mcfont', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-muted);
    }

    h1, h2, h3, h4 {
      color: var(--text-main);
      margin: 0;
      font-family: 'mcfontb', 'mcfont', sans-serif;
    }

    a {
      text-decoration: none;
      color: var(--accent-color);
      transition: all 0.2s ease;
      font-family: 'mcfont', sans-serif;
    }

    a:hover {
      color: var(--text-main);
      text-shadow: 0 0 8px var(--accent-glow);
    }

    /* --- Layout: sidebar + content --- */
    .docs-layout {
      display: flex;
      align-items: stretch;
      min-height: 100vh;
    }

    /* --- Sidebar: full-height side panel on desktop --- */
    #docs-sidebar {
      width: 280px;
      flex-shrink: 0;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      overflow-y: auto;
      background: rgba(14, 14, 14, 0.9);
      border-right: 1px solid var(--card-border);
      padding: 90px 20px 30px 20px;
    }

    #docs-content-outer {
      flex: 1;
      min-width: 0;
      max-width: 1100px;
      margin: 0 auto;
      margin-left: 280px;
      padding: 40px 5%;
    }

    /* --- Mobile hamburger toggle --- */
    #sidebar-toggle {
      display: none;
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
      width: 48px;
      height: 48px;
      background: rgba(18, 18, 18, 0.9);
      border: 1px solid var(--card-border);
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
      backdrop-filter: blur(8px);
    }

    #sidebar-toggle span {
      display: block;
      width: 20px;
      height: 2px;
      background: var(--text-main);
    }

    #sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 90;
    }

    .sidebar-section {
      margin-bottom: 28px;
    }

    .sidebar-section:last-child {
      margin-bottom: 0;
    }

    .sidebar-title {
      font-size: 0.85rem;
      color: var(--accent-color);
      font-family: 'mcfontwide', sans-serif;
      margin-bottom: 12px;
    }

    .sidebar-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .sidebar-list li {
      margin-bottom: 8px;
    }

    .sidebar-link {
      display: block;
      color: var(--text-muted);
      font-size: 0.95rem;
      padding: 6px 10px;
      border-left: 2px solid transparent;
    }

    .sidebar-link:hover {
      color: var(--text-main);
      border-left: 2px solid var(--accent-color);
      background: rgba(255,255,255,0.03);
    }

    .sidebar-link.active {
      color: var(--accent-color);
      border-left: 2px solid var(--accent-color);
      background: rgba(5, 238, 147, 0.08);
    }

    /* --- Main content --- */
    #docs-content-wrapper {
      flex: 1;
      min-width: 0;
    }

    .docs-toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .docs-toolbar button {
      background-color: transparent;
      border: none;
      font-size: 0.8rem;
      padding: 4px 10px;
      color: var(--text-muted);
      font-family: 'mcfont', sans-serif;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .docs-toolbar button:hover {
      color: var(--accent-color);
      background-color: rgba(255, 255, 255, 0.05);
      transform: none;
    }

    #docs-content {
      background: transparent;
      padding: 40px 0 0 0;
      text-align: left;
      line-height: 1.75;
    }

    #docs-content h1 {
      font-size: 2.2rem;
      margin-bottom: 20px;
    }

    #docs-content h2 {
      font-size: 1.6rem;
      margin: 32px 0 14px 0;
      color: var(--accent-color);
    }

    #docs-content h3 {
      font-size: 1.25rem;
      margin: 24px 0 10px 0;
    }

    #docs-content p, #docs-content li {
      color: var(--text-muted);
      font-family: 'mcfont', sans-serif;
    }

    #docs-content code {
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      padding: 2px 6px;
      font-family: 'Consolas', 'Courier New', monospace;
      color: #00ffcc;
    }

    #docs-content pre {
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      padding: 20px;
      overflow-x: auto;
    }

    #docs-content pre code {
      border: none;
      padding: 0;
      background: none;
    }

    #docs-content a {
      color: var(--accent-color);
    }

    /* --- Footer --- */
    .docs-footer {
      border-top: 1px solid var(--card-border);
      padding: 24px 5% 30px 5%;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: right;
    }

    .docs-footer a {
      color: #bebebe;
      text-decoration: none;
    }

    .docs-footer .creator {
      color: #454545;
      font-family: 'mcfontb', sans-serif;
    }

    @media (max-width: 900px) {
      #sidebar-toggle {
        display: flex;
      }

      #docs-sidebar {
        top: 0;
        left: 0;
        height: 100vh;
        z-index: 95;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
      }

      #docs-sidebar.open {
        transform: translateX(0);
      }

      #docs-content-outer {
        max-width: 100%;
        margin-left: 0;
        padding: 40px 6%;
      }
    }
  </style>
</head>
<body>
  <button id="sidebar-toggle" aria-label="Toggle navigation">
    <span></span><span></span><span></span>
  </button>
  <div id="sidebar-overlay"></div>

  <div class="docs-layout">
    <aside id="docs-sidebar">
    </aside>

    <div id="docs-content-outer">
      <div id="docs-content-wrapper">
        <div class="docs-toolbar">
          <button id="btn-copy">Copy Markdown</button>
          <button id="btn-download">Download Markdown</button>
          <button id="btn-view">View as Markdown</button>
        </div>

        <div id="docs-content">Loading...</div>
      </div>

      <div class="docs-footer">
        <a href="https://admin.mcbcode.com">©</a> Copyright 2026 mcbCode<br>
        <span class="creator">Created by: <a href="https://hello.mcbcode.com" class="creator">idktoast</a></span>
      </div>
    </div>
  </div>

  <script>
    // mobile sidebar toggle
    const sidebarEl = document.getElementById("docs-sidebar");
    const toggleBtn = document.getElementById("sidebar-toggle");
    const overlayEl = document.getElementById("sidebar-overlay");

    function openSidebar() {
      sidebarEl.classList.add("open");
      overlayEl.style.display = "block";
    }

    function closeSidebar() {
      sidebarEl.classList.remove("open");
      overlayEl.style.display = "none";
    }

    toggleBtn.onclick = () => {
      sidebarEl.classList.contains("open") ? closeSidebar() : openSidebar();
    };

    overlayEl.onclick = closeSidebar;
  </script>

  <script>
    // ---- THE ONLY LINE YOU CHANGE WHEN COPYING THIS TEMPLATE ----
    const mdFile = "https://mcbcode.com/docs/md/creating-folders.md";
    // ---------------------------------------------------------------

    let rawMarkdown = "";

    fetch(mdFile)
      .then(res => res.text())
      .then(text => {
        rawMarkdown = text;
        document.getElementById("docs-content").innerHTML = marked.parse(text);
      })
      .catch(err => {
        document.getElementById("docs-content").innerHTML = "Failed to load documentation.";
        console.log("failed to load markdown:", err);
      });

    document.getElementById("btn-copy").onclick = () => {
      navigator.clipboard.writeText(rawMarkdown)
        .then(() => console.log("markdown copied"))
        .catch(err => console.log("copy failed:", err));
    };

    document.getElementById("btn-download").onclick = () => {
      const blob = new Blob([rawMarkdown], { type: "text/markdown" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = mdFile.split("/").pop();
      a.click();
      URL.revokeObjectURL(url);
    };

    document.getElementById("btn-view").onclick = () => {
      window.open(mdFile, "_blank");
    };
  </script>

  <!-- marked needs to be loaded before this runs, so wait for it -->
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      if (typeof marked === "undefined") {
        console.log("marked not loaded yet, retrying render shortly");
      }
    });
  </script>

  <script src="/docs/elements/sidebar.js"></script>
  <script src="/docs/elements/navi.js"></script>
</body>
</html>
