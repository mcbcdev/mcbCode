<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>mcbCode Docs | Introduction</title>

  <link rel="icon" href="https://mcbcode.com/theme/favicon.png">
  <link rel="stylesheet" href="https://mcbcode.com/theme/site.css">

  <!-- markdown parser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js" defer></script>

  <style>
    :root {
      --accent-color: #05ee93;
      --accent-dark: #00a459;
      --accent-glow: rgba(5, 238, 147, 0.25);
      --bg-color: #0c0c0c;
      --card-bg: rgba(18, 18, 18, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
      --text-muted: #bebebe;
      --code-bg: #111111;
    }

    *, *::before, *::after {
      font-weight: normal !important;
      border-radius: 0px !important;
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      margin: 0;
      font-family: 'mcfont', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-muted);
    }

    h1, h2, h3, h4 {
      color: var(--text-main);
      margin: 0;
      font-family: 'mcfontb', 'mcfont', sans-serif;
    }

    a {
      text-decoration: none;
      color: var(--accent-color);
      transition: all 0.2s ease;
      font-family: 'mcfont', sans-serif;
    }

    a:hover {
      color: var(--text-main);
      text-shadow: 0 0 8px var(--accent-glow);
    }

    /* --- Layout: sidebar + content --- */
    .docs-layout {
      display: flex;
      align-items: flex-start;
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 5%;
      gap: 40px;
    }

    /* --- Sidebar --- */
    #docs-sidebar {
      width: 260px;
      flex-shrink: 0;
      position: sticky;
      top: 40px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 20px;
      backdrop-filter: blur(12px);
    }

    .sidebar-section {
      margin-bottom: 28px;
    }

    .sidebar-section:last-child {
      margin-bottom: 0;
    }

    .sidebar-title {
      font-size: 0.85rem;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: 'mcfontwide', 'mcfont', sans-serif;
      margin-bottom: 12px;
    }

    .sidebar-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .sidebar-list li {
      margin-bottom: 8px;
    }

    .sidebar-link {
      display: block;
      color: var(--text-muted);
      font-size: 0.95rem;
      padding: 6px 10px;
      border-left: 2px solid transparent;
    }

    .sidebar-link:hover {
      color: var(--text-main);
      border-left: 2px solid var(--accent-color);
      background: rgba(255,255,255,0.03);
    }

    .sidebar-link.active {
      color: var(--accent-color);
      border-left: 2px solid var(--accent-color);
      background: rgba(5, 238, 147, 0.08);
    }

    /* --- Main content --- */
    #docs-content-wrapper {
      flex: 1;
      min-width: 0;
    }

    .docs-toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .docs-toolbar button {
      background-color: transparent;
      border: none;
      font-size: 0.8rem;
      padding: 4px 10px;
      color: var(--text-muted);
      font-family: 'mcfont', sans-serif;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .docs-toolbar button:hover {
      color: var(--accent-color);
      background-color: rgba(255, 255, 255, 0.05);
      transform: none;
    }

    #docs-content {
      background: transparent;
      padding: 40px 0 0 0;
      text-align: left;
      line-height: 1.75;
    }

    #docs-content h1 {
      font-size: 2.2rem;
      margin-bottom: 20px;
    }

    #docs-content h2 {
      font-size: 1.6rem;
      margin: 32px 0 14px 0;
      color: var(--accent-color);
    }

    #docs-content h3 {
      font-size: 1.25rem;
      margin: 24px 0 10px 0;
    }

    #docs-content p, #docs-content li {
      color: var(--text-muted);
      font-family: 'mcfont', sans-serif;
    }

    #docs-content code {
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      padding: 2px 6px;
      font-family: 'Consolas', 'Courier New', monospace;
      color: #00ffcc;
    }

    #docs-content pre {
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      padding: 20px;
      overflow-x: auto;
    }

    #docs-content pre code {
      border: none;
      padding: 0;
      background: none;
    }

    #docs-content a {
      color: var(--accent-color);
    }

    @media (max-width: 900px) {
      .docs-layout {
        flex-direction: column;
      }
      #docs-sidebar {
        width: 100%;
        position: static;
      }
    }
  </style>
</head>
<body>

  <div class="docs-layout">
    <aside id="docs-sidebar">
      <!-- filled in automatically by /docs/elements/sidebar.js -->
    </aside>

    <div id="docs-content-wrapper">
      <div class="docs-toolbar">
        <button id="btn-copy">Copy Markdown</button>
        <button id="btn-download">Download Markdown</button>
        <button id="btn-view">View as Markdown</button>
      </div>

      <div id="docs-content">Loading...</div>
    </div>
  </div>

  <script>
    const mdFile = "https://mcbcode.com/docs/md/getting-started.md";

    let rawMarkdown = "";

    fetch(mdFile)
      .then(res => res.text())
      .then(text => {
        rawMarkdown = text;
        document.getElementById("docs-content").innerHTML = marked.parse(text);
      })
      .catch(err => {
        document.getElementById("docs-content").innerHTML = "Failed to load documentation.";
        console.log("failed to load markdown:", err);
      });

    document.getElementById("btn-copy").onclick = () => {
      navigator.clipboard.writeText(rawMarkdown)
        .then(() => console.log("markdown copied"))
        .catch(err => console.log("copy failed:", err));
    };

    document.getElementById("btn-download").onclick = () => {
      const blob = new Blob([rawMarkdown], { type: "text/markdown" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = mdFile.split("/").pop();
      a.click();
      URL.revokeObjectURL(url);
    };

    document.getElementById("btn-view").onclick = () => {
      window.open(mdFile, "_blank");
    };
  </script>

  <!-- marked needs to be loaded before this runs, so wait for it -->
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      if (typeof marked === "undefined") {
        console.log("marked not loaded yet, retrying render shortly");
      }
    });
  </script>

  <script src="https://mcbcode.com/docs/elements/sidebar.js"></script>
  <script src="https://mcbcode.com/docs/elements/navi.js"></script>
</body>
</html>
