<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>mcbCode Docs</title>
  <link rel="icon" href="https://mcbcode.com/theme/favicon.png">
  <link rel="stylesheet" href="https://mcbcode.com/theme/site.css">
  <style>
    body {
      background-color: #0c0c0c;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    a { color: #05ee93; }
  </style>
</head>
<body>
  <div id="msg">checking page...</div>

  <script>
    function getPageFromPath() {
      // github pages 404 keeps the original path in location.pathname
      const parts = window.location.pathname.split("/docs/");
      if (parts.length > 1) {
        const seg = parts[1].split("/").filter(Boolean).pop();
        if (seg) return seg.replace(/\.html$/, "");
      }
      return null;
    }

    const page = getPageFromPath();
    const msgEl = document.getElementById("msg");

    if (!page) {
      msgEl.innerHTML = `<h1>404</h1><p>page not found. <a href="/docs/index.html">go to docs home</a></p>`;
    } else {
      fetch(`https://mcbcode.com/docs/md/${page}.md`, { method: "HEAD" })
        .then(res => {
          if (res.ok) {
            window.location.replace(`/docs/index.html?page=${page}`);
          } else {
            throw new Error("not found");
          }
        })
        .catch(() => {
          msgEl.innerHTML = `<h1>404</h1><p>"${page}" doesnt exist. <a href="/docs/index.html">go to docs home</a></p>`;
        });
    }
  </script>
</body>
</html>
