<!doctype html>
<html>
<head>
  <link rel="stylesheet" href="https://mcbcode.com/theme/site.css">
  <link rel="icon" href="https://mcbcode.com/theme/favicon.png">
  <title>mcbCode | Mobile Sync</title>
  <style>
    h2 {
        color: #ffffff;
        font-size: 50px;
    }

    p {
        color: #bebebe;
    }
    #code {
        border: 3px solid #565656;
        background-color: #343434;
        color: #ffffff;
        font-size: 50px;
        max-width: 50%;
        font-family: 'mcfont' !important;
        outline: none;
        letter-spacing: 5px;
        transition: all 0.2s ease-in-out;
    }

    #code:focus {
        border-radius: 16px;
        border-color: #05ee93;
    }

    button {
        padding: 8px;
        font-size: 40px;
        background-color: #05ee93;
        border: 3px solid #00a459;
        outline: none;
        font-family: 'mcfont';
        transition: all 0.2s ease-in-out;
    }

    button:hover {
        color: #ffffff;
        background-color: #00a459;
        border-color: #05ee93;
        border-radius: 16px;
    }
    </style>
</head>
<body style="text-align: center; margin-top: 80px;">

  <h2>mcb<span style="color: #05ee93">Code</span> Sync</h2>
  <p>Sync the mcbCode app with your account.<p>

<br><br><br>
  <input id="code" maxlength="4" spellcheck="false" style="text-align:center;" placeholder="1234"/>
  <br><br><br><br>
  <button onclick="approve()">Confirm</button>
  <p id="msg"></p>
  <script>
    async function approve() {
      const code = document.getElementById("code").value.trim();
      const res = await fetch("https://auth.mcbcode.com/auth/device/approve", {
        method: "POST", credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code })
      });
      const data = await res.json();
      document.getElementById("msg").textContent = res.ok ? "Device connected! You can close this." : (data.error || "Something went wrong.");
    }
  </script>
</body>
</html>
