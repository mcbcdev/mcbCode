<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>explore | mcbcode</title>

  <link rel="icon" href="https://mcbcode.com/img/icons/default.png">
  <link rel="stylesheet" href="https://mcbcode.com/theme/site.css">

  <style>
    :root {
      --accent-color: #05ee93;
      --accent-dark: #00a459;
      --accent-glow: rgba(5, 238, 147, 0.25);
      --danger-color: #f72f2f;
      --bg-color: #0c0c0c;
      --card-bg: rgba(18, 18, 18, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
      --text-muted: #bebebe;
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 18px;
    }

    *, *::before, *::after {
      font-weight: normal !important;
      border-radius: var(--radius-sm);
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      margin: 0;
      font-family: 'mcfont', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-muted);
    }

    a { text-decoration: none; color: inherit; }

    h1, h2, h3 { color: var(--text-main); margin: 0; font-family: 'mcfontb', 'mcfont', sans-serif; }

    #page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 36px 24px 168px;
    }

    #page-header {
      margin-bottom: 24px;
    }

    #page-header h1 {
      font-size: 1.8rem;
    }

    #page-header p {
      margin-top: 6px;
      font-size: 0.95rem;
    }

    [hidden] { display: none !important; }

    #explore-tabs {
      display: flex;
      gap: 8px;
      margin: 22px 0 24px;
      border-bottom: 1px solid var(--card-border);
    }

    .explore-tab {
      min-height: 46px;
      background: transparent;
      border: 0;
      border-bottom: 2px solid transparent;
      color: #888;
      cursor: pointer;
      font-family: 'mcfontb', 'mcfont', sans-serif;
      font-size: 0.95rem;
      padding: 10px 16px 12px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .explore-tab:hover { color: var(--text-main); }
    .explore-tab.active, .explore-tab[aria-selected="true"] {
      color: var(--accent-color);
      border-bottom-color: var(--accent-color);
    }

    #discover-panel { min-height: 260px; }

    #discover-search-form { margin-bottom: 20px; }

    #discover-search-form label {
      display: block;
      color: var(--text-main);
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .discover-search-row {
      display: flex;
      gap: 8px;
    }

    #discover-search {
      flex: 1;
      min-width: 0;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-family: 'mcfont', sans-serif;
      font-size: 0.9rem;
      padding: 11px 12px;
    }

    #discover-search:focus-visible { outline: 2px solid var(--accent-color); outline-offset: 2px; }

    #discover-search-submit {
      min-height: 44px;
      background: var(--accent-dark);
      border: 1px solid var(--accent-color);
      color: #fff;
      cursor: pointer;
      font-family: 'mcfontb', sans-serif;
      padding: 0 18px;
      transition: background 0.15s ease, color 0.15s ease;
    }

    #discover-search-submit:hover { background: var(--accent-color); color: var(--bg-color); }

    .discover-quick-searches {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .discover-quick-searches span { color: #777; font-size: 0.78rem; }

    .discover-chip {
      min-height: 34px;
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      cursor: pointer;
      font-family: 'mcfont', sans-serif;
      font-size: 0.78rem;
      padding: 5px 10px;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .discover-chip:hover { border-color: var(--accent-color); color: var(--accent-color); }

    #discover-summary {
      color: #888;
      font-size: 0.82rem;
      margin: 0 0 12px;
    }

    #discover-results {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .discover-card {
      min-width: 0;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .discover-card:hover { border-color: rgba(5,238,147,0.55); background: rgba(20,24,22,0.9); }

    .discover-card-title {
      color: var(--text-main);
      font-family: 'mcfontb', sans-serif;
      font-size: 1rem;
      overflow-wrap: anywhere;
    }

    .discover-card-title:hover { color: var(--accent-color); }

    .discover-card-type {
      color: var(--accent-color);
      font-family: monospace;
      font-size: 0.72rem;
    }

    .discover-card-description {
      color: #aaa;
      font-size: 0.86rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .discover-card-tags { display: flex; flex-wrap: wrap; gap: 5px; }

    .discover-card-tag {
      color: #aaa;
      border: 1px solid var(--card-border);
      font-size: 0.7rem;
      padding: 3px 6px;
    }

    .discover-card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-top: 1px solid rgba(255,255,255,0.06);
      margin-top: auto;
      padding-top: 9px;
      color: #777;
      font-size: 0.75rem;
    }

    .discover-card-meta a { color: var(--text-muted); }
    .discover-card-meta a:hover { color: var(--accent-color); }

    .discover-open-link {
      align-self: flex-start;
      color: var(--accent-color);
      font-size: 0.82rem;
    }

    .discover-open-link:hover { color: var(--text-main); }

    .discover-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 52px 16px;
      color: #777;
      border: 1px dashed var(--card-border);
    }

    /* sort bar */
    #sort-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
    }

    .sort-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 14px;
      font-size: 0.85rem;
      font-family: 'mcfont', sans-serif;
      cursor: pointer;
    }

    .sort-btn:hover {
      color: var(--text-main);
      border-color: rgba(255,255,255,0.3);
    }

    .sort-btn:focus-visible, .explore-tab:focus-visible, .discover-chip:focus-visible,
    #discover-search-submit:focus-visible, .react-btn:focus-visible,
    .post-actions button:focus-visible, .post-link-btn:focus-visible {
      outline: 2px solid var(--accent-color);
      outline-offset: 3px;
    }

    .sort-btn.active {
      color: var(--bg-color);
      background-color: var(--accent-color);
      border-color: var(--accent-color);
    }

    /* feed */
    #feed {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .post-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 18px;
    }

    .post-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .post-pfp {
      width: 34px;
      height: 34px;
      object-fit: cover;
      background: #222;
      image-rendering: pixelated;
    }

    .post-head-text {
      display: flex;
      flex-direction: column;
      line-height: 1.3;
    }

    .post-username {
      color: var(--text-main);
      font-family: 'mcfontb', sans-serif;
      font-size: 0.95rem;
    }

    .post-time {
      font-size: 0.75rem;
      color: #777;
    }

    .post-project-chip {
      margin-left: auto;
      font-size: 0.75rem;
      background: rgba(5,238,147,0.08);
      border: 1px solid rgba(5,238,147,0.3);
      color: var(--accent-color);
      padding: 4px 10px;
      font-family: monospace;
      white-space: nowrap;
    }

    .post-content {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #e5e5e5;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 12px;
    }

    .post-content .mention {
      color: var(--accent-color);
    }

    .post-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.85rem;
    }

    .react-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .react-btn {
      min-width: 62px;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: rgba(255,255,255,0.025);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 7px 10px;
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .react-btn:hover { border-color: rgba(255,255,255,0.28); color: var(--text-main); }
    .react-btn.like.active { color: var(--accent-color); border-color: var(--accent-color); background: rgba(5,238,147,0.08); }
    .react-btn.dislike.active { color: var(--danger-color); border-color: var(--danger-color); background: rgba(247,47,47,0.08); }

    .reaction-icon {
      display: block;
      width: 16px;
      height: 16px;
      object-fit: contain;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .reaction-icon.like { transform: rotate(180deg); }
    .reaction-icon.dislike { transform: rotate(0deg); }

    .fight-bar {
      height: 4px;
      width: 100%;
      background: #222;
      display: flex;
      margin-top: 8px;
      overflow: hidden;
    }

    .fight-bar .side-like { background: var(--accent-color); height: 100%; }
    .fight-bar .side-dislike { background: var(--danger-color); height: 100%; }

    .post-link-btn, .post-edit-btn, .post-delete-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      font-family: 'mcfont', sans-serif;
      padding: 0;
    }

    .post-link-btn:hover { color: var(--text-main); }
    .post-edit-btn:hover { color: var(--accent-color); }
    .post-delete-btn:hover { color: var(--danger-color); }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }

    /* floating compose bar */
    #compose-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: min(680px, 92vw);
      background: rgba(18,18,18,0.96);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.6);
    }

    #compose-plus {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      background: var(--accent-dark);
      border: 1px solid var(--accent-color);
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #compose-plus:hover { background: var(--accent-color); color: var(--bg-color); }

    #compose-input-wrap {
      flex: 1;
      position: relative;
    }

    #compose-input {
      width: 100%;
      resize: none;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-family: 'mcfont', sans-serif;
      font-size: 0.9rem;
      padding: 10px 12px;
      height: 42px;
      max-height: 160px;
      transition: height 0.15s ease;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--accent-color) transparent;
    }

    #compose-input::-webkit-scrollbar { width: 6px; }
    #compose-input::-webkit-scrollbar-track { background: transparent; }
    #compose-input::-webkit-scrollbar-thumb { background: var(--accent-color); }

    .post-content strong, .reply-content strong { font-weight: bold !important; }
    .post-content em, .reply-content em { font-style: italic; }
    .post-content code, .reply-content code {
      background: #1c1c1c;
      padding: 1px 5px;
      font-family: monospace;
    }

    .md-h1, .md-h2, .md-h3 {
      display: inline-block;
      color: var(--text-main);
      font-family: 'mcfontb', sans-serif;
      font-weight: bold !important;
    }
    .md-h1 { font-size: 1.35em; }
    .md-h2 { font-size: 1.18em; }
    .md-h3 { font-size: 1.05em; }

    #compose-project-chip {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--accent-color);
      margin-bottom: 6px;
    }

    #compose-project-chip button {
      background: transparent;
      border: none;
      color: #777;
      cursor: pointer;
      font-size: 0.8rem;
    }

    #compose-send {
      flex-shrink: 0;
      background-color: var(--accent-dark);
      border: 1px solid var(--accent-color);
      color: #fff;
      font-family: 'mcfontb', sans-serif;
      padding: 10px 18px;
      cursor: pointer;
    }

    #compose-send:hover { background-color: var(--accent-color); color: var(--bg-color); }
    #compose-send:disabled { opacity: 0.4; cursor: default; }

    #compose-signin-note {
      display: none;
      text-align: center;
      color: #777;
      font-size: 0.8rem;
    }

    /* mention popup */
    .mention-popup {
      position: absolute;
      bottom: 100%;
      left: 0;
      margin-bottom: 4px;
      background: #161616;
      border: 1px solid var(--card-border);
      width: 220px;
      max-height: 180px;
      overflow-y: auto;
      display: none;
      z-index: 50;
    }

    .mention-popup .mention-option {
      padding: 8px 12px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .mention-popup .mention-option:hover,
    .mention-popup .mention-option.highlighted {
      background: rgba(5,238,147,0.1);
      color: var(--accent-color);
    }

    /* project picker modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-box {
      background: #141414;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      width: min(480px, 90vw);
      max-height: 70vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .modal-box h3 { margin-bottom: 14px; }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      color: #888;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .modal-box { position: relative; }

    .modal-msg {
      margin: 10px 0 18px 0;
      font-size: 0.9rem;
      line-height: 1.5;
      color: var(--text-muted);
    }

    #generic-modal-textarea {
      display: none;
      width: 100%;
      min-height: 100px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-family: 'mcfont', sans-serif;
      font-size: 0.9rem;
      padding: 10px;
      margin-bottom: 16px;
      resize: vertical;
    }

    .modal-btn-row {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .modal-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 9px 18px;
      cursor: pointer;
      font-family: 'mcfont', sans-serif;
      font-size: 0.85rem;
    }

    .modal-btn:hover { color: var(--text-main); border-color: rgba(255,255,255,0.3); }

    .modal-btn.primary {
      background-color: var(--accent-dark);
      border-color: var(--accent-color);
      color: #fff;
    }
    .modal-btn.primary:hover { background-color: var(--accent-color); color: var(--bg-color); }

    .modal-btn.danger { border-color: var(--danger-color); color: var(--danger-color); }
    .modal-btn.danger:hover { background-color: var(--danger-color); color: #fff; }

    /* profile links on avatars/usernames */
    .profile-link {
      display: flex;
      align-items: center;
      gap: 10px;
      color: inherit;
    }
    .profile-link:hover .post-username { color: var(--accent-color); }

    .mention { color: var(--accent-color); }
    .mention:hover { text-decoration: underline; }
    .mention-everyone { color: var(--accent-color); font-style: italic; }

    /* fight bar only as wide as the like/dislike buttons combined */
    .react-block {
      display: inline-flex;
      flex-direction: column;
      align-items: stretch;
    }

    #project-picker-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .project-pick-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--card-border);
      padding: 10px 12px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .project-pick-item:hover {
      border-color: var(--accent-color);
      color: var(--text-main);
    }

    .project-pick-item .p-name { color: var(--text-main); font-family: 'mcfontb', sans-serif; }
    .project-pick-item .p-desc { font-size: 0.8rem; color: #777; margin-top: 2px; }

    @media (max-width: 680px) {
      #page { padding: 26px 16px 180px; }
      #page-header { margin-bottom: 18px; }
      #explore-tabs { margin: 16px 0 20px; }
      #discover-results { grid-template-columns: 1fr; }
      .discover-search-row { flex-direction: column; }
      #discover-search-submit { width: 100%; }
      .post-card { padding: 15px; }
      .post-head { align-items: flex-start; }
      .post-project-chip { max-width: 42%; overflow: hidden; text-overflow: ellipsis; }
      #compose-bar { width: calc(100vw - 24px); bottom: 12px; padding: 8px; border-radius: var(--radius-md); }
      #compose-send { padding: 10px 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

  <div id="page">
    <div id="page-header">
      <h1>explore</h1>
      <p>find public projects or catch up with what creators are sharing.</p>
    </div>

    <div id="explore-tabs" role="tablist" aria-label="explore sections">
      <button class="explore-tab active" id="tab-discover" type="button" role="tab" tabindex="0" aria-selected="true" aria-controls="discover-panel">discover</button>
      <button class="explore-tab" id="tab-feed" type="button" role="tab" tabindex="-1" aria-selected="false" aria-controls="feed-panel">feed</button>
    </div>

    <section id="discover-panel" role="tabpanel" aria-labelledby="tab-discover">
      <form id="discover-search-form">
        <label for="discover-search">search public projects</label>
        <div class="discover-search-row">
          <input id="discover-search" type="search" maxlength="64" placeholder="project name, description, or tag" autocomplete="off">
          <button id="discover-search-submit" type="submit">search</button>
        </div>
        <div class="discover-quick-searches" aria-label="quick project searches">
          <span>try:</span>
          <button class="discover-chip" type="button" data-query="entity">entity</button>
          <button class="discover-chip" type="button" data-query="texture">texture</button>
          <button class="discover-chip" type="button" data-query="script">script</button>
          <button class="discover-chip" type="button" data-query="weapon">weapon</button>
        </div>
      </form>
      <p id="discover-summary" aria-live="polite">latest public projects</p>
      <div id="discover-results" aria-live="polite">
        <div class="discover-empty">loading public projects...</div>
      </div>
    </section>

    <section id="feed-panel" role="tabpanel" aria-labelledby="tab-feed" hidden>
    <div id="sort-bar">
      <button class="sort-btn active" data-sort="trending">trending</button>
      <button class="sort-btn" data-sort="relevant">relevant</button>
      <button class="sort-btn" data-sort="newest">newest</button>
      <button class="sort-btn" data-sort="oldest">oldest</button>
      <button class="sort-btn" data-sort="most_liked">most likes</button>
      <button class="sort-btn" data-sort="most_disliked">most dislikes</button>
    </div>

    <div id="feed">
      <div class="empty-state">loading posts...</div>
    </div>
    </section>
  </div>

  <div id="compose-bar" hidden>
    <button id="compose-plus" title="attach a project">+</button>
    <div id="compose-input-wrap">
      <div id="compose-project-chip">
        <span id="compose-project-name"></span>
        <button id="compose-project-remove">x</button>
      </div>
      <textarea id="compose-input" rows="1" placeholder="share something you're working on... (@ to mention)" maxlength="2000"></textarea>
      <div class="mention-popup" id="mention-popup"></div>
    </div>
    <button id="compose-send">post</button>
  </div>

  <div class="modal-overlay" id="generic-modal-overlay">
    <div class="modal-box">
      <button class="modal-close" id="generic-modal-close">x</button>
      <h3 id="generic-modal-title"></h3>
      <p class="modal-msg" id="generic-modal-message" style="display:none;"></p>
      <textarea id="generic-modal-textarea" maxlength="2000"></textarea>
      <div class="modal-btn-row">
        <button class="modal-btn" id="generic-modal-cancel">cancel</button>
        <button class="modal-btn primary" id="generic-modal-confirm">confirm</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="project-picker-overlay">
    <div class="modal-box">
      <button class="modal-close" id="project-picker-close">x</button>
      <h3>pick a project</h3>
      <div id="project-picker-list"><div class="empty-state">loading your projects...</div></div>
    </div>
  </div>

  <script>
    const API = "https://auth.mcbcode.com";
    let ME = null;
    let currentSort = "trending";
    let myProjects = [];
    let discoverRequestId = 0;
    let discoverTimer = null;

    function projectPageUrl(code) {
      return "https://mcbcode.com/project/" + encodeURIComponent(code || "") + "/";
    }

    function readableProjectType(type) {
      const names = {
        addon: "addon",
        texture_pack: "texture pack",
        skinpack: "skin pack",
        script: "script project",
      };
      return names[type] || "bedrock project";
    }

    function readableProjectDate(value) {
      if (!value) return "";
      const normalized = String(value).replace(" ", "T");
      const date = new Date(/[zZ]|[+-]\d{2}:?\d{2}$/.test(normalized) ? normalized : normalized + "Z");
      return Number.isNaN(date.getTime()) ? "" : "updated " + date.toLocaleDateString();
    }

    function projectCardHtml(project) {
      const code = encodeURIComponent(project.share_code || "");
      const title = escapeHtml(project.name || "untitled project");
      const description = escapeHtml(project.description || "no description yet");
      const tags = Array.isArray(project.tags) ? project.tags.slice(0, 4) : [];
      const tagHtml = tags.length
        ? `<div class="discover-card-tags">${tags.map(tag => `<span class="discover-card-tag">${escapeHtml(String(tag))}</span>`).join("")}</div>`
        : "";
      const owner = project.owner_username
        ? `<a href="${profileUrl(project.owner_username)}">@${escapeHtml(project.owner_username)}</a>`
        : "<span>mcbCode creator</span>";
      const date = readableProjectDate(project.updated_at);
      return `
        <article class="discover-card">
          <div class="discover-card-type">${escapeHtml(readableProjectType(project.project_type))}</div>
          <a class="discover-card-title" href="${projectPageUrl(project.share_code)}">${title}</a>
          <div class="discover-card-description">${description}</div>
          ${tagHtml}
          <div class="discover-card-meta"><span>${owner}</span><span>${escapeHtml(date)}</span></div>
          <a class="discover-open-link" href="${projectPageUrl(project.share_code)}">open project &rarr;</a>
        </article>`;
    }

    async function loadDiscover(query = "") {
      const requestId = ++discoverRequestId;
      const resultsEl = document.getElementById("discover-results");
      const summaryEl = document.getElementById("discover-summary");
      const cleanQuery = query.trim().slice(0, 64);
      resultsEl.innerHTML = '<div class="discover-empty">loading public projects...</div>';
      summaryEl.textContent = cleanQuery ? `searching for “${cleanQuery}”...` : "latest public projects";

      try {
        const endpoint = cleanQuery
          ? `${API}/search?q=${encodeURIComponent(cleanQuery)}`
          : `${API}/projects/recent`;
        const response = await fetch(endpoint);
        if (!response.ok) throw new Error("request failed");
        const data = await response.json();
        if (requestId !== discoverRequestId) return;
        if (!data.ok) throw new Error("project search failed");

        const projects = Array.isArray(data.projects) ? data.projects : [];
        summaryEl.textContent = cleanQuery
          ? `${projects.length} matching public ${projects.length === 1 ? "project" : "projects"} (up to 30)`
          : "latest public projects · 8 shown";

        if (!projects.length) {
          resultsEl.innerHTML = `<div class="discover-empty">${cleanQuery ? "no matching public projects. try another search." : "no public projects to show yet."}</div>`;
          return;
        }
        resultsEl.innerHTML = projects.map(projectCardHtml).join("");
      } catch {
        if (requestId !== discoverRequestId) return;
        summaryEl.textContent = "public projects";
        resultsEl.innerHTML = '<div class="discover-empty">couldn’t load projects. try again in a moment.</div>';
      }
    }

    function setExploreTab(tab) {
      const showDiscover = tab === "discover";
      const discoverTab = document.getElementById("tab-discover");
      const feedTab = document.getElementById("tab-feed");
      discoverTab.classList.toggle("active", showDiscover);
      feedTab.classList.toggle("active", !showDiscover);
      discoverTab.setAttribute("aria-selected", String(showDiscover));
      feedTab.setAttribute("aria-selected", String(!showDiscover));
      discoverTab.tabIndex = showDiscover ? 0 : -1;
      feedTab.tabIndex = showDiscover ? -1 : 0;
      document.getElementById("discover-panel").hidden = !showDiscover;
      document.getElementById("feed-panel").hidden = showDiscover;
      document.getElementById("compose-bar").hidden = showDiscover;
      if (showDiscover) loadDiscover(document.getElementById("discover-search").value);
      else loadFeed();
    }

    // ---- custom modal (replaces browser confirm()/prompt()) ----
    function showModal({ title, message = "", showTextarea = false, textValue = "", confirmLabel = "confirm", danger = false }) {
      return new Promise(resolve => {
        const overlay = document.getElementById("generic-modal-overlay");
        const titleEl = document.getElementById("generic-modal-title");
        const messageEl = document.getElementById("generic-modal-message");
        const textarea = document.getElementById("generic-modal-textarea");
        const confirmBtn = document.getElementById("generic-modal-confirm");
        const cancelBtn = document.getElementById("generic-modal-cancel");
        const closeBtn = document.getElementById("generic-modal-close");

        titleEl.textContent = title;
        messageEl.textContent = message;
        messageEl.style.display = message ? "block" : "none";
        textarea.style.display = showTextarea ? "block" : "none";
        textarea.value = textValue;
        confirmBtn.textContent = confirmLabel;
        confirmBtn.classList.toggle("danger", danger);
        overlay.style.display = "flex";
        if (showTextarea) setTimeout(() => textarea.focus(), 50);

        function cleanup(result) {
          overlay.style.display = "none";
          confirmBtn.removeEventListener("click", onConfirm);
          cancelBtn.removeEventListener("click", onCancel);
          closeBtn.removeEventListener("click", onCancel);
          overlay.removeEventListener("click", onOverlayClick);
          resolve(result);
        }
        function onConfirm() { cleanup(showTextarea ? textarea.value : true); }
        function onCancel() { cleanup(showTextarea ? null : false); }
        function onOverlayClick(e) { if (e.target === overlay) onCancel(); }

        confirmBtn.addEventListener("click", onConfirm);
        cancelBtn.addEventListener("click", onCancel);
        closeBtn.addEventListener("click", onCancel);
        overlay.addEventListener("click", onOverlayClick);
      });
    }

    function customConfirm(message, { danger = false, confirmLabel = "delete" } = {}) {
      return showModal({ title: "are you sure?", message, showTextarea: false, confirmLabel, danger });
    }

    function customPrompt(title, defaultValue) {
      return showModal({ title, showTextarea: true, textValue: defaultValue, confirmLabel: "save" });
    }

    function profileUrl(username) {
      return "https://mcbcode.com/profile/" + encodeURIComponent(username || "");
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }

    // escapes the raw text first (so nothing typed can inject real html), then
    // layers on a small safe subset of markdown, then styles @mentions last.
    function renderContent(raw) {
      let s = escapeHtml(raw);
      s = s.replace(/^### (.+)$/gm, '<span class="md-h3">$1</span>');
      s = s.replace(/^## (.+)$/gm, '<span class="md-h2">$1</span>');
      s = s.replace(/^# (.+)$/gm, '<span class="md-h1">$1</span>');
      s = s.replace(/\[([^\]\n]{1,100})\]\((https?:\/\/[^\s)]{1,300})\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" style="color:var(--accent-color);text-decoration:underline;">$1</a>');
      s = s.replace(/\*\*([^\*\n]{1,300})\*\*/g, '<strong>$1</strong>');
      s = s.replace(/(^|[^*])\*([^*\n]{1,300})\*(?!\*)/g, '$1<em>$2</em>');
      s = s.replace(/(^|[^_])_([^_\n]{1,300})_(?!_)/g, '$1<em>$2</em>');
      s = s.replace(/`([^`\n]{1,300})`/g, '<code>$1</code>');
      s = s.replace(/@([a-zA-Z0-9_.]{1,32})/g, (m, name) => {
        if (name.toLowerCase() === "everyone") return `<span class="mention mention-everyone">@${name}</span>`;
        return `<a class="mention" href="${profileUrl(name)}">@${name}</a>`;
      });
      return s;
    }

    function timeAgo(dateStr) {
      const then = new Date(dateStr + "Z").getTime();
      const diff = Math.max(0, Date.now() - then);
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return "just now";
      if (mins < 60) return mins + "m ago";
      const hours = Math.floor(mins / 60);
      if (hours < 24) return hours + "h ago";
      const days = Math.floor(hours / 24);
      if (days < 30) return days + "d ago";
      return new Date(dateStr + "Z").toLocaleDateString();
    }

    function pfpUrl(post) {
      return post.author_pfp || "https://mcbcode.com/img/icons/default.png";
    }

    async function loadMe() {
      try {
        const res = await fetch(API + "/me", { credentials: "include" });
        if (res.ok) {
          const data = await res.json();
          if (data.ok) ME = data;
        }
      } catch {}
      updateComposeState();
    }

    function updateComposeState() {
      const input = document.getElementById("compose-input");
      const send = document.getElementById("compose-send");
      if (!ME) {
        input.placeholder = "sign in to post something...";
        input.disabled = true;
        send.disabled = true;
      }
    }

    function renderFightBar(likes, dislikes) {
      const total = likes + dislikes;
      const likePct = total === 0 ? 50 : (likes / total) * 100;
      const dislikePct = 100 - likePct;
      return `<div class="fight-bar"><div class="side-like" style="width:${likePct}%"></div><div class="side-dislike" style="width:${dislikePct}%"></div></div>`;
    }

    function reactionIconUrl(active) {
      return active
        ? "https://mcbcode.com/img/icons/dropdown-selected.png"
        : "https://mcbcode.com/img/icons/dropdown.png";
    }

    function reactionButtonHtml(type, count, active) {
      const action = type === "like" ? "upvote" : "downvote";
      const countLabel = count === 1 ? "1 reaction" : `${count} reactions`;
      return `<button class="react-btn ${type} ${active ? "active" : ""}" data-type="${type}" aria-label="${action}, ${countLabel}" aria-pressed="${active}"><img class="reaction-icon ${type}" src="${reactionIconUrl(active)}" alt=""><span class="reaction-count">${count}</span></button>`;
    }

    function updateReactionButton(button, type, count, active) {
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
      const action = type === "like" ? "upvote" : "downvote";
      button.setAttribute("aria-label", `${action}, ${count} ${count === 1 ? "reaction" : "reactions"}`);
      const icon = button.querySelector(".reaction-icon");
      if (icon) icon.src = reactionIconUrl(active);
      const countEl = button.querySelector(".reaction-count");
      if (countEl) countEl.textContent = count;
    }

    function postCardHtml(post) {
      const isOwner = ME && ME.id === post.author_id;
      const projectChip = post.project_share_code
        ? `<a class="post-project-chip" href="https://mcbcode.com/project?code=${encodeURIComponent(post.project_share_code)}">${escapeHtml(post.project_name || "project")}</a>`
        : "";

      return `
        <div class="post-card" data-post-id="${post.id}">
          <div class="post-head">
            <a class="profile-link" href="${profileUrl(post.author_username)}">
              <img class="post-pfp" src="${pfpUrl(post)}" alt="">
              <div class="post-head-text">
                <span class="post-username">${escapeHtml(post.author_username || "unknown")}</span>
                <span class="post-time">${timeAgo(post.created_at)}${post.updated_at !== post.created_at ? " (edited)" : ""}</span>
              </div>
            </a>
            ${projectChip}
          </div>
          <div class="post-content" data-raw="${encodeURIComponent(post.content)}">${renderContent(post.content)}</div>
          <div class="post-actions">
            <div class="react-block">
              <div class="react-group">
                ${reactionButtonHtml("like", post.likes, post.my_reaction === "like")}
                ${reactionButtonHtml("dislike", post.dislikes, post.my_reaction === "dislike")}
              </div>
              ${renderFightBar(post.likes, post.dislikes)}
            </div>
            <a class="post-link-btn" href="https://mcbcode.com/post?id=${post.id}">${post.reply_count} ${post.reply_count === 1 ? "reply" : "replies"}</a>
            ${isOwner ? `<button class="post-edit-btn">edit</button><button class="post-delete-btn">delete</button>` : ""}
          </div>
        </div>
      `;
    }

    async function loadFeed() {
      const feed = document.getElementById("feed");
      feed.innerHTML = '<div class="empty-state">loading posts...</div>';
      try {
        const res = await fetch(API + "/posts?sort=" + currentSort, { credentials: "include" });
        const data = await res.json();
        if (!data.ok) {
          if (res.status === 401) {
            feed.innerHTML = '<div class="empty-state">sign in to see posts from people you follow and projects you watch.</div>';
          } else {
            feed.innerHTML = '<div class="empty-state">couldn\'t load posts.</div>';
          }
          return;
        }
        if (!data.posts.length) {
          const msg = currentSort === "relevant"
            ? "nothing here yet — follow some people or watch some projects to see their posts."
            : "nothing here yet. be the first to post something!";
          feed.innerHTML = `<div class="empty-state">${msg}</div>`;
          return;
        }
        feed.innerHTML = data.posts.map(postCardHtml).join("");
        attachFeedListeners();
      } catch {
        feed.innerHTML = '<div class="empty-state">couldn\'t load posts. try refreshing.</div>';
      }
    }

    function attachFeedListeners() {
      document.querySelectorAll(".post-card").forEach(attachCardListeners);
    }

    function attachCardListeners(card) {
        const postId = card.dataset.postId;

        card.querySelectorAll(".react-btn").forEach(btn => {
          btn.addEventListener("click", async () => {
            if (!ME) { alert("sign in to react to posts."); return; }
            const type = btn.dataset.type;
            const res = await fetch(API + "/post/react", {
              method: "POST", credentials: "include",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ post_id: postId, type })
            });
            const data = await res.json();
            if (!data.ok) { alert(data.error || "couldn't react"); return; }
            const likeBtn = card.querySelector(".react-btn.like");
            const dislikeBtn = card.querySelector(".react-btn.dislike");
            updateReactionButton(likeBtn, "like", data.likes, data.my_reaction === "like");
            updateReactionButton(dislikeBtn, "dislike", data.dislikes, data.my_reaction === "dislike");
            card.querySelector(".fight-bar").outerHTML = renderFightBar(data.likes, data.dislikes);
          });
        });

        const editBtn = card.querySelector(".post-edit-btn");
        if (editBtn) editBtn.addEventListener("click", async () => {
          const contentEl = card.querySelector(".post-content");
          const current = decodeURIComponent(contentEl.dataset.raw);
          const updated = await customPrompt("edit your post", current);
          if (updated === null || !updated.trim()) return;
          const res = await fetch(API + "/post", {
            method: "POST", credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: postId, content: updated.trim() })
          });
          const data = await res.json();
          if (!data.ok) { alert(data.error || "couldn't edit"); return; }
          loadFeed();
        });

        const deleteBtn = card.querySelector(".post-delete-btn");
        if (deleteBtn) deleteBtn.addEventListener("click", async () => {
          const ok = await customConfirm("delete this post? this can't be undone.", { danger: true });
          if (!ok) return;
          const res = await fetch(API + "/post?id=" + encodeURIComponent(postId), {
            method: "DELETE", credentials: "include"
          });
          const data = await res.json();
          if (!data.ok) { alert(data.error || "couldn't delete"); return; }
          card.remove();
        });
    }

    // ---- discover and feed tabs ----
    const exploreTabs = [document.getElementById("tab-discover"), document.getElementById("tab-feed")];
    exploreTabs[0].addEventListener("click", () => setExploreTab("discover"));
    exploreTabs[1].addEventListener("click", () => setExploreTab("feed"));
    exploreTabs.forEach((tab, index) => {
      tab.addEventListener("keydown", event => {
        let nextIndex = index;
        if (event.key === "ArrowRight") nextIndex = (index + 1) % exploreTabs.length;
        else if (event.key === "ArrowLeft") nextIndex = (index - 1 + exploreTabs.length) % exploreTabs.length;
        else if (event.key === "Home") nextIndex = 0;
        else if (event.key === "End") nextIndex = exploreTabs.length - 1;
        else return;
        event.preventDefault();
        exploreTabs[nextIndex].focus();
        exploreTabs[nextIndex].click();
      });
    });

    const discoverSearch = document.getElementById("discover-search");
    document.getElementById("discover-search-form").addEventListener("submit", event => {
      event.preventDefault();
      clearTimeout(discoverTimer);
      loadDiscover(discoverSearch.value);
    });
    discoverSearch.addEventListener("input", () => {
      clearTimeout(discoverTimer);
      discoverTimer = setTimeout(() => loadDiscover(discoverSearch.value), 250);
    });
    document.querySelectorAll(".discover-chip").forEach(button => {
      button.addEventListener("click", () => {
        discoverSearch.value = button.dataset.query || "";
        loadDiscover(discoverSearch.value);
      });
    });

    // ---- sort bar ----
    document.querySelectorAll(".sort-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".sort-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentSort = btn.dataset.sort;
        loadFeed();
      });
    });

    // ---- compose bar ----
    const composeInput = document.getElementById("compose-input");
    const composeSend = document.getElementById("compose-send");
    let attachedProjectCode = null;

    function growComposeInput() {
      composeInput.style.height = "42px";
      composeInput.style.height = Math.max(42, Math.min(composeInput.scrollHeight, 160)) + "px";
    }

    composeInput.addEventListener("input", () => {
      growComposeInput();
      handleMentionTyping();
    });

    composeInput.addEventListener("focus", growComposeInput);
    composeInput.addEventListener("blur", () => {
      if (!composeInput.value.trim()) composeInput.style.height = "42px";
    });

    composeSend.addEventListener("click", async () => {
      if (!ME) { alert("sign in to post."); return; }
      const content = composeInput.value.trim();
      if (!content) return;
      composeSend.disabled = true;
      try {
        const res = await fetch(API + "/posts", {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content, project_code: attachedProjectCode || undefined })
        });
        const data = await res.json();
        if (!data.ok) { alert(data.error || "couldn't post"); return; }

        // show it right away instead of waiting on a re-fetch
        const feed = document.getElementById("feed");
        const emptyState = feed.querySelector(".empty-state");
        if (emptyState) feed.innerHTML = "";
        const newPost = {
          id: data.id,
          author_id: ME.id,
          author_username: ME.username,
          author_pfp: ME.pfp_url,
          project_share_code: attachedProjectCode || null,
          project_name: document.getElementById("compose-project-name").textContent || null,
          content,
          created_at: new Date().toISOString().replace("T", " ").slice(0, 19),
          updated_at: new Date().toISOString().replace("T", " ").slice(0, 19),
          likes: 0, dislikes: 0, reply_count: 0, my_reaction: null,
        };
        feed.insertAdjacentHTML("afterbegin", postCardHtml(newPost));
        attachCardListeners(feed.querySelector(`.post-card[data-post-id="${data.id}"]`));

        composeInput.value = "";
        composeInput.style.height = "42px";
        clearAttachedProject();
      } finally {
        composeSend.disabled = false;
      }
    });

    // ---- project attach chip ----
    function setAttachedProject(code, name) {
      attachedProjectCode = code;
      document.getElementById("compose-project-name").textContent = name;
      document.getElementById("compose-project-chip").style.display = "flex";
    }
    function clearAttachedProject() {
      attachedProjectCode = null;
      document.getElementById("compose-project-chip").style.display = "none";
    }
    document.getElementById("compose-project-remove").addEventListener("click", clearAttachedProject);

    async function applyProjectHandoff() {
      const params = new URLSearchParams(location.search);
      const code = (params.get("project") || "").trim().toLowerCase();
      if (!code) return false;
      setExploreTab("feed");
      if (!/^[a-z0-9]{4,16}$/.test(code)) {
        alert("this project link doesn't look valid.");
        return true;
      }
      try {
        const res = await fetch(`${API}/project?code=${encodeURIComponent(code)}`);
        const data = await res.json();
        const isPublic = data.project && (data.project.is_public === 1 || data.project.is_public === true);
        if (!res.ok || !data.ok || !data.project || !isPublic) {
          alert("couldn't attach this project. check that the project is public, then try again.");
          return true;
        }
        setAttachedProject(code, data.project.name || "project");
        if (params.get("compose") === "1") {
          requestAnimationFrame(() => composeInput.focus({ preventScroll: true }));
        }
      } catch {
        alert("couldn't load this project link. try again in a moment.");
      }
      return true;
    }

    // ---- project picker modal ----
    const pickerOverlay = document.getElementById("project-picker-overlay");
    document.getElementById("compose-plus").addEventListener("click", async () => {
      if (!ME) { alert("sign in to attach a project."); return; }
      pickerOverlay.style.display = "flex";
      const list = document.getElementById("project-picker-list");
      list.innerHTML = '<div class="empty-state">loading your projects...</div>';
      try {
        const res = await fetch(API + "/projects", { credentials: "include" });
        const data = await res.json();
        if (!data.ok) { list.innerHTML = '<div class="empty-state">couldn\'t load projects.</div>'; return; }
        const all = [...(data.projects || []), ...(data.collab_projects || [])];
        if (!all.length) { list.innerHTML = '<div class="empty-state">you don\'t own or collaborate on any projects yet.</div>'; return; }
        list.innerHTML = all.map(p => `
          <div class="project-pick-item" data-code="${p.share_code}" data-name="${escapeHtml(p.name)}">
            <div class="p-name">${escapeHtml(p.name)}</div>
            <div class="p-desc">${escapeHtml(p.description || "no description")}</div>
          </div>
        `).join("");
        list.querySelectorAll(".project-pick-item").forEach(item => {
          item.addEventListener("click", () => {
            setAttachedProject(item.dataset.code, item.dataset.name);
            pickerOverlay.style.display = "none";
          });
        });
      } catch {
        list.innerHTML = '<div class="empty-state">couldn\'t load projects.</div>';
      }
    });
    document.getElementById("project-picker-close").addEventListener("click", () => pickerOverlay.style.display = "none");
    pickerOverlay.addEventListener("click", (e) => { if (e.target === pickerOverlay) pickerOverlay.style.display = "none"; });

    // ---- @mention autocomplete ----
    const mentionPopup = document.getElementById("mention-popup");
    let mentionTimer = null;

    function handleMentionTyping() {
      const val = composeInput.value;
      const cursor = composeInput.selectionStart;
      const upToCursor = val.slice(0, cursor);
      const match = upToCursor.match(/@([a-zA-Z0-9_.]{1,32})$/);
      if (!match) { mentionPopup.style.display = "none"; return; }

      const partial = match[1];
      clearTimeout(mentionTimer);
      mentionTimer = setTimeout(async () => {
        try {
          const res = await fetch(API + "/profile/search?q=" + encodeURIComponent(partial));
          const data = await res.json();
          if (!data.ok || !data.results.length) { mentionPopup.style.display = "none"; return; }
          mentionPopup.innerHTML = data.results.map(name => `<div class="mention-option" data-name="${escapeHtml(name)}">@${escapeHtml(name)}</div>`).join("");
          mentionPopup.style.display = "block";
          mentionPopup.querySelectorAll(".mention-option").forEach(opt => {
            opt.addEventListener("click", () => {
              const before = upToCursor.slice(0, match.index);
              const after = val.slice(cursor);
              composeInput.value = before + "@" + opt.dataset.name + " " + after;
              mentionPopup.style.display = "none";
              composeInput.focus();
            });
          });
        } catch { mentionPopup.style.display = "none"; }
      }, 150);
    }

    document.addEventListener("click", (e) => {
      if (!mentionPopup.contains(e.target) && e.target !== composeInput) mentionPopup.style.display = "none";
    });

    loadMe();
    const handoffCode = (new URLSearchParams(location.search).get("project") || "").trim();
    if (handoffCode) applyProjectHandoff();
    else loadDiscover();
  </script>
</body>
</html>
