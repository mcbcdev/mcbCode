<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>explore | mcbcode</title>

  <link rel="icon" href="https://mcbcode.com/img/icons/default.png">
  <link rel="stylesheet" href="https://mcbcode.com/theme/site.css">

  <style>
    :root {
      --accent-color: #05ee93;
      --accent-dark: #00a459;
      --accent-glow: rgba(5, 238, 147, 0.25);
      --danger-color: #f72f2f;
      --bg-color: #0c0c0c;
      --card-bg: rgba(18, 18, 18, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
      --text-muted: #bebebe;
    }

    *, *::before, *::after {
      font-weight: normal !important;
      border-radius: 0px !important;
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      margin: 0;
      font-family: 'mcfont', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-muted);
    }

    a { text-decoration: none; color: inherit; }

    h1, h2, h3 { color: var(--text-main); margin: 0; font-family: 'mcfontb', 'mcfont', sans-serif; }

    #page {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 16px 140px 16px;
    }

    #page-header {
      margin-bottom: 24px;
    }

    #page-header h1 {
      font-size: 1.8rem;
    }

    #page-header p {
      margin-top: 6px;
      font-size: 0.95rem;
    }

    /* sort bar */
    #sort-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
    }

    .sort-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 14px;
      font-size: 0.85rem;
      font-family: 'mcfont', sans-serif;
      cursor: pointer;
    }

    .sort-btn:hover {
      color: var(--text-main);
      border-color: rgba(255,255,255,0.3);
    }

    .sort-btn.active {
      color: var(--bg-color);
      background-color: var(--accent-color);
      border-color: var(--accent-color);
    }

    /* feed */
    #feed {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .post-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 18px;
    }

    .post-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .post-pfp {
      width: 34px;
      height: 34px;
      object-fit: cover;
      background: #222;
      image-rendering: pixelated;
    }

    .post-head-text {
      display: flex;
      flex-direction: column;
      line-height: 1.3;
    }

    .post-username {
      color: var(--text-main);
      font-family: 'mcfontb', sans-serif;
      font-size: 0.95rem;
    }

    .post-time {
      font-size: 0.75rem;
      color: #777;
    }

    .post-project-chip {
      margin-left: auto;
      font-size: 0.75rem;
      background: rgba(5,238,147,0.08);
      border: 1px solid rgba(5,238,147,0.3);
      color: var(--accent-color);
      padding: 4px 10px;
      font-family: monospace;
      white-space: nowrap;
    }

    .post-content {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #e5e5e5;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 12px;
    }

    .post-content .mention {
      color: var(--accent-color);
    }

    .post-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 0.85rem;
    }

    .react-group {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .react-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 10px;
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1;
    }

    .react-btn.like.active { color: var(--accent-color); border-color: var(--accent-color); }
    .react-btn.dislike.active { color: var(--danger-color); border-color: var(--danger-color); }

    .fight-bar {
      height: 4px;
      width: 100%;
      background: #222;
      display: flex;
      margin-top: 8px;
      overflow: hidden;
    }

    .fight-bar .side-like { background: var(--accent-color); height: 100%; }
    .fight-bar .side-dislike { background: var(--danger-color); height: 100%; }

    .post-link-btn, .post-edit-btn, .post-delete-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      font-family: 'mcfont', sans-serif;
      padding: 0;
    }

    .post-link-btn:hover { color: var(--text-main); }
    .post-edit-btn:hover { color: var(--accent-color); }
    .post-delete-btn:hover { color: var(--danger-color); }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }

    /* floating compose bar */
    #compose-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: min(680px, 92vw);
      background: rgba(18,18,18,0.95);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.6);
    }

    #compose-plus {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      background: var(--accent-dark);
      border: 1px solid var(--accent-color);
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #compose-plus:hover { background: var(--accent-color); color: var(--bg-color); }

    #compose-input-wrap {
      flex: 1;
      position: relative;
    }

    #compose-input {
      width: 100%;
      resize: none;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-family: 'mcfont', sans-serif;
      font-size: 0.9rem;
      padding: 10px 12px;
      height: 42px;
      max-height: 160px;
      transition: height 0.15s ease;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--accent-color) transparent;
    }

    #compose-input::-webkit-scrollbar { width: 6px; }
    #compose-input::-webkit-scrollbar-track { background: transparent; }
    #compose-input::-webkit-scrollbar-thumb { background: var(--accent-color); }

    .post-content strong, .reply-content strong { font-weight: bold !important; }
    .post-content em, .reply-content em { font-style: italic; }
    .post-content code, .reply-content code {
      background: #1c1c1c;
      padding: 1px 5px;
      font-family: monospace;
    }

    #compose-project-chip {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--accent-color);
      margin-bottom: 6px;
    }

    #compose-project-chip button {
      background: transparent;
      border: none;
      color: #777;
      cursor: pointer;
      font-size: 0.8rem;
    }

    #compose-send {
      flex-shrink: 0;
      background-color: var(--accent-dark);
      border: 1px solid var(--accent-color);
      color: #fff;
      font-family: 'mcfontb', sans-serif;
      padding: 10px 18px;
      cursor: pointer;
    }

    #compose-send:hover { background-color: var(--accent-color); color: var(--bg-color); }
    #compose-send:disabled { opacity: 0.4; cursor: default; }

    #compose-signin-note {
      display: none;
      text-align: center;
      color: #777;
      font-size: 0.8rem;
    }

    /* mention popup */
    .mention-popup {
      position: absolute;
      bottom: 100%;
      left: 0;
      margin-bottom: 4px;
      background: #161616;
      border: 1px solid var(--card-border);
      width: 220px;
      max-height: 180px;
      overflow-y: auto;
      display: none;
      z-index: 50;
    }

    .mention-popup .mention-option {
      padding: 8px 12px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .mention-popup .mention-option:hover,
    .mention-popup .mention-option.highlighted {
      background: rgba(5,238,147,0.1);
      color: var(--accent-color);
    }

    /* project picker modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-box {
      background: #141414;
      border: 1px solid var(--card-border);
      width: min(480px, 90vw);
      max-height: 70vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .modal-box h3 { margin-bottom: 14px; }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      color: #888;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .modal-box { position: relative; }

    #project-picker-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .project-pick-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--card-border);
      padding: 10px 12px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .project-pick-item:hover {
      border-color: var(--accent-color);
      color: var(--text-main);
    }

    .project-pick-item .p-name { color: var(--text-main); font-family: 'mcfontb', sans-serif; }
    .project-pick-item .p-desc { font-size: 0.8rem; color: #777; margin-top: 2px; }

    @media (max-width: 600px) {
      #compose-bar { width: 94vw; bottom: 12px; padding: 8px; }
      #compose-send { padding: 10px 14px; }
    }
  </style>
</head>
<body>

  <div id="page">
    <div id="page-header">
      <h1>explore</h1>
      <p>see what other bedrock creators on mcbcode are building.</p>
    </div>

    <div id="sort-bar">
      <button class="sort-btn active" data-sort="trending">trending</button>
      <button class="sort-btn" data-sort="relevant">relevant</button>
      <button class="sort-btn" data-sort="newest">newest</button>
      <button class="sort-btn" data-sort="oldest">oldest</button>
      <button class="sort-btn" data-sort="most_liked">most likes</button>
      <button class="sort-btn" data-sort="most_disliked">most dislikes</button>
    </div>

    <div id="feed">
      <div class="empty-state">loading posts...</div>
    </div>
  </div>

  <div id="compose-bar">
    <button id="compose-plus" title="attach a project">+</button>
    <div id="compose-input-wrap">
      <div id="compose-project-chip">
        <span id="compose-project-name"></span>
        <button id="compose-project-remove">x</button>
      </div>
      <textarea id="compose-input" rows="1" placeholder="share something you're working on... (@ to mention)" maxlength="2000"></textarea>
      <div class="mention-popup" id="mention-popup"></div>
    </div>
    <button id="compose-send">post</button>
  </div>

  <div class="modal-overlay" id="project-picker-overlay">
    <div class="modal-box">
      <button class="modal-close" id="project-picker-close">x</button>
      <h3>pick a project</h3>
      <div id="project-picker-list"><div class="empty-state">loading your projects...</div></div>
    </div>
  </div>

  <script>
    const API = "https://auth.mcbcode.com";
    let ME = null;
    let currentSort = "trending";
    let myProjects = [];

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }

    // escapes the raw text first (so nothing typed can inject real html), then
    // layers on a small safe subset of markdown, then styles @mentions last.
    function renderContent(raw) {
      let s = escapeHtml(raw);
      s = s.replace(/\[([^\]\n]{1,100})\]\((https?:\/\/[^\s)]{1,300})\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" style="color:var(--accent-color);text-decoration:underline;">$1</a>');
      s = s.replace(/\*\*([^\*\n]{1,300})\*\*/g, '<strong>$1</strong>');
      s = s.replace(/(^|[^*])\*([^*\n]{1,300})\*(?!\*)/g, '$1<em>$2</em>');
      s = s.replace(/(^|[^_])_([^_\n]{1,300})_(?!_)/g, '$1<em>$2</em>');
      s = s.replace(/`([^`\n]{1,300})`/g, '<code>$1</code>');
      s = s.replace(/@([a-zA-Z0-9_.]{1,32})/g, '<span class="mention">@$1</span>');
      return s;
    }

    function timeAgo(dateStr) {
      const then = new Date(dateStr + "Z").getTime();
      const diff = Math.max(0, Date.now() - then);
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return "just now";
      if (mins < 60) return mins + "m ago";
      const hours = Math.floor(mins / 60);
      if (hours < 24) return hours + "h ago";
      const days = Math.floor(hours / 24);
      if (days < 30) return days + "d ago";
      return new Date(dateStr + "Z").toLocaleDateString();
    }

    function pfpUrl(post) {
      return post.author_pfp || "https://mcbcode.com/img/icons/default.png";
    }

    async function loadMe() {
      try {
        const res = await fetch(API + "/me", { credentials: "include" });
        if (res.ok) {
          const data = await res.json();
          if (data.ok) ME = data;
        }
      } catch {}
      updateComposeState();
    }

    function updateComposeState() {
      const input = document.getElementById("compose-input");
      const send = document.getElementById("compose-send");
      if (!ME) {
        input.placeholder = "sign in to post something...";
        input.disabled = true;
        send.disabled = true;
      }
    }

    function renderFightBar(likes, dislikes) {
      const total = likes + dislikes;
      const likePct = total === 0 ? 50 : (likes / total) * 100;
      const dislikePct = 100 - likePct;
      return `<div class="fight-bar"><div class="side-like" style="width:${likePct}%"></div><div class="side-dislike" style="width:${dislikePct}%"></div></div>`;
    }

    function postCardHtml(post) {
      const isOwner = ME && ME.id === post.author_id;
      const projectChip = post.project_share_code
        ? `<a class="post-project-chip" href="https://mcbcode.com/project?code=${encodeURIComponent(post.project_share_code)}">${escapeHtml(post.project_name || "project")}</a>`
        : "";

      return `
        <div class="post-card" data-post-id="${post.id}">
          <div class="post-head">
            <img class="post-pfp" src="${pfpUrl(post)}" alt="">
            <div class="post-head-text">
              <span class="post-username">${escapeHtml(post.author_username || "unknown")}</span>
              <span class="post-time">${timeAgo(post.created_at)}${post.updated_at !== post.created_at ? " (edited)" : ""}</span>
            </div>
            ${projectChip}
          </div>
          <div class="post-content">${renderContent(post.content)}</div>
          <div class="post-actions">
            <div class="react-group">
              <button class="react-btn like ${post.my_reaction === "like" ? "active" : ""}" data-type="like">&#9650; ${post.likes}</button>
              <button class="react-btn dislike ${post.my_reaction === "dislike" ? "active" : ""}" data-type="dislike">&#9660; ${post.dislikes}</button>
            </div>
            <a class="post-link-btn" href="https://mcbcode.com/post?id=${post.id}">${post.reply_count} ${post.reply_count === 1 ? "reply" : "replies"}</a>
            ${isOwner ? `<button class="post-edit-btn">edit</button><button class="post-delete-btn">delete</button>` : ""}
          </div>
          ${renderFightBar(post.likes, post.dislikes)}
        </div>
      `;
    }

    async function loadFeed() {
      const feed = document.getElementById("feed");
      feed.innerHTML = '<div class="empty-state">loading posts...</div>';
      try {
        const res = await fetch(API + "/posts?sort=" + currentSort, { credentials: "include" });
        const data = await res.json();
        if (!data.ok) {
          if (res.status === 401) {
            feed.innerHTML = '<div class="empty-state">sign in to see posts from people you follow and projects you watch.</div>';
          } else {
            feed.innerHTML = '<div class="empty-state">couldn\'t load posts.</div>';
          }
          return;
        }
        if (!data.posts.length) {
          const msg = currentSort === "relevant"
            ? "nothing here yet — follow some people or watch some projects to see their posts."
            : "nothing here yet. be the first to post something!";
          feed.innerHTML = `<div class="empty-state">${msg}</div>`;
          return;
        }
        feed.innerHTML = data.posts.map(postCardHtml).join("");
        attachFeedListeners();
      } catch {
        feed.innerHTML = '<div class="empty-state">couldn\'t load posts. try refreshing.</div>';
      }
    }

    function attachFeedListeners() {
      document.querySelectorAll(".post-card").forEach(attachCardListeners);
    }

    function attachCardListeners(card) {
        const postId = card.dataset.postId;

        card.querySelectorAll(".react-btn").forEach(btn => {
          btn.addEventListener("click", async () => {
            if (!ME) { alert("sign in to react to posts."); return; }
            const type = btn.dataset.type;
            const res = await fetch(API + "/post/react", {
              method: "POST", credentials: "include",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ post_id: postId, type })
            });
            const data = await res.json();
            if (!data.ok) { alert(data.error || "couldn't react"); return; }
            const likeBtn = card.querySelector(".react-btn.like");
            const dislikeBtn = card.querySelector(".react-btn.dislike");
            likeBtn.innerHTML = "&#9650; " + data.likes;
            dislikeBtn.innerHTML = "&#9660; " + data.dislikes;
            likeBtn.classList.toggle("active", data.my_reaction === "like");
            dislikeBtn.classList.toggle("active", data.my_reaction === "dislike");
            card.querySelector(".fight-bar").outerHTML = renderFightBar(data.likes, data.dislikes);
          });
        });

        const editBtn = card.querySelector(".post-edit-btn");
        if (editBtn) editBtn.addEventListener("click", async () => {
          const contentEl = card.querySelector(".post-content");
          const current = contentEl.textContent;
          const updated = prompt("edit your post:", current);
          if (updated === null || !updated.trim()) return;
          const res = await fetch(API + "/post", {
            method: "POST", credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: postId, content: updated.trim() })
          });
          const data = await res.json();
          if (!data.ok) { alert(data.error || "couldn't edit"); return; }
          loadFeed();
        });

        const deleteBtn = card.querySelector(".post-delete-btn");
        if (deleteBtn) deleteBtn.addEventListener("click", async () => {
          if (!confirm("delete this post? this can't be undone.")) return;
          const res = await fetch(API + "/post?id=" + encodeURIComponent(postId), {
            method: "DELETE", credentials: "include"
          });
          const data = await res.json();
          if (!data.ok) { alert(data.error || "couldn't delete"); return; }
          card.remove();
        });
    }

    // ---- sort bar ----
    document.querySelectorAll(".sort-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".sort-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentSort = btn.dataset.sort;
        loadFeed();
      });
    });

    // ---- compose bar ----
    const composeInput = document.getElementById("compose-input");
    const composeSend = document.getElementById("compose-send");
    let attachedProjectCode = null;

    function growComposeInput() {
      composeInput.style.height = "42px";
      composeInput.style.height = Math.max(42, Math.min(composeInput.scrollHeight, 160)) + "px";
    }

    composeInput.addEventListener("input", () => {
      growComposeInput();
      handleMentionTyping();
    });

    composeInput.addEventListener("focus", growComposeInput);
    composeInput.addEventListener("blur", () => {
      if (!composeInput.value.trim()) composeInput.style.height = "42px";
    });

    composeSend.addEventListener("click", async () => {
      if (!ME) { alert("sign in to post."); return; }
      const content = composeInput.value.trim();
      if (!content) return;
      composeSend.disabled = true;
      try {
        const res = await fetch(API + "/posts", {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content, project_code: attachedProjectCode || undefined })
        });
        const data = await res.json();
        if (!data.ok) { alert(data.error || "couldn't post"); return; }

        // show it right away instead of waiting on a re-fetch
        const feed = document.getElementById("feed");
        const emptyState = feed.querySelector(".empty-state");
        if (emptyState) feed.innerHTML = "";
        const newPost = {
          id: data.id,
          author_id: ME.id,
          author_username: ME.username,
          author_pfp: ME.pfp_url,
          project_share_code: attachedProjectCode || null,
          project_name: document.getElementById("compose-project-name").textContent || null,
          content,
          created_at: new Date().toISOString().replace("T", " ").slice(0, 19),
          updated_at: new Date().toISOString().replace("T", " ").slice(0, 19),
          likes: 0, dislikes: 0, reply_count: 0, my_reaction: null,
        };
        feed.insertAdjacentHTML("afterbegin", postCardHtml(newPost));
        attachCardListeners(feed.querySelector(`.post-card[data-post-id="${data.id}"]`));

        composeInput.value = "";
        composeInput.style.height = "42px";
        clearAttachedProject();
      } finally {
        composeSend.disabled = false;
      }
    });

    // ---- project attach chip ----
    function setAttachedProject(code, name) {
      attachedProjectCode = code;
      document.getElementById("compose-project-name").textContent = name;
      document.getElementById("compose-project-chip").style.display = "flex";
    }
    function clearAttachedProject() {
      attachedProjectCode = null;
      document.getElementById("compose-project-chip").style.display = "none";
    }
    document.getElementById("compose-project-remove").addEventListener("click", clearAttachedProject);

    // ---- project picker modal ----
    const pickerOverlay = document.getElementById("project-picker-overlay");
    document.getElementById("compose-plus").addEventListener("click", async () => {
      if (!ME) { alert("sign in to attach a project."); return; }
      pickerOverlay.style.display = "flex";
      const list = document.getElementById("project-picker-list");
      list.innerHTML = '<div class="empty-state">loading your projects...</div>';
      try {
        const res = await fetch(API + "/projects", { credentials: "include" });
        const data = await res.json();
        if (!data.ok) { list.innerHTML = '<div class="empty-state">couldn\'t load projects.</div>'; return; }
        const all = [...(data.projects || []), ...(data.collab_projects || [])];
        if (!all.length) { list.innerHTML = '<div class="empty-state">you don\'t own or collaborate on any projects yet.</div>'; return; }
        list.innerHTML = all.map(p => `
          <div class="project-pick-item" data-code="${p.share_code}" data-name="${escapeHtml(p.name)}">
            <div class="p-name">${escapeHtml(p.name)}</div>
            <div class="p-desc">${escapeHtml(p.description || "no description")}</div>
          </div>
        `).join("");
        list.querySelectorAll(".project-pick-item").forEach(item => {
          item.addEventListener("click", () => {
            setAttachedProject(item.dataset.code, item.dataset.name);
            pickerOverlay.style.display = "none";
          });
        });
      } catch {
        list.innerHTML = '<div class="empty-state">couldn\'t load projects.</div>';
      }
    });
    document.getElementById("project-picker-close").addEventListener("click", () => pickerOverlay.style.display = "none");
    pickerOverlay.addEventListener("click", (e) => { if (e.target === pickerOverlay) pickerOverlay.style.display = "none"; });

    // ---- @mention autocomplete ----
    const mentionPopup = document.getElementById("mention-popup");
    let mentionTimer = null;

    function handleMentionTyping() {
      const val = composeInput.value;
      const cursor = composeInput.selectionStart;
      const upToCursor = val.slice(0, cursor);
      const match = upToCursor.match(/@([a-zA-Z0-9_.]{1,32})$/);
      if (!match) { mentionPopup.style.display = "none"; return; }

      const partial = match[1];
      clearTimeout(mentionTimer);
      mentionTimer = setTimeout(async () => {
        try {
          const res = await fetch(API + "/profile/search?q=" + encodeURIComponent(partial));
          const data = await res.json();
          if (!data.ok || !data.results.length) { mentionPopup.style.display = "none"; return; }
          mentionPopup.innerHTML = data.results.map(name => `<div class="mention-option" data-name="${escapeHtml(name)}">@${escapeHtml(name)}</div>`).join("");
          mentionPopup.style.display = "block";
          mentionPopup.querySelectorAll(".mention-option").forEach(opt => {
            opt.addEventListener("click", () => {
              const before = upToCursor.slice(0, match.index);
              const after = val.slice(cursor);
              composeInput.value = before + "@" + opt.dataset.name + " " + after;
              mentionPopup.style.display = "none";
              composeInput.focus();
            });
          });
        } catch { mentionPopup.style.display = "none"; }
      }, 150);
    }

    document.addEventListener("click", (e) => {
      if (!mentionPopup.contains(e.target) && e.target !== composeInput) mentionPopup.style.display = "none";
    });

    loadMe();
    loadFeed();
  </script>
</body>
</html>
