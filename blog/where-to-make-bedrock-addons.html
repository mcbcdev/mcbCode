  <script>
    const markdownSource = document.getElementById("post-markdown").value.trim();
    const renderedPost = document.getElementById("rendered-post");
    const rawMarkdown = document.getElementById("raw-markdown");
    const viewMarkdownButton = document.getElementById("view-markdown");
    const backButton = document.getElementById("back-button");
    const rawView = document.getElementById("raw-view");

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function renderInline(markdown) {
      const codeParts = [];
      let text = escapeHtml(markdown).replace(/`([^`]+)`/g, (_, code) => {
        const token = `@@INLINE_CODE_${codeParts.length}@@`;
        codeParts.push(`<code>${code}</code>`);
        return token;
      });

      text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|\/[^\s)]*|#[^\s)]*)\)/g,
        (_, label, url) => `<a href="${url}" rel="noopener noreferrer">${label}</a>`);
      text = text.replace(/\*\*(.+?)\*\*|__(.+?)__/g, (_, a, b) => `<strong>${a || b}</strong>`);
      text = text.replace(/\*(?!\s)(.+?)\*|_(?!\s)(.+?)_/g, (_, a, b) => `<em>${a || b}</em>`);
      text = text.replace(/@@INLINE_CODE_(\d+)@@/g, (_, index) => codeParts[Number(index)]);
      return text;
    }

    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r\n?/g, "\n").split("\n");
      const output = [];
      let index = 0;

      while (index < lines.length) {
        const line = lines[index];

        if (!line.trim()) {
          index += 1;
          continue;
        }

        if (/^\s*```/.test(line)) {
          index += 1;
          const codeLines = [];
          while (index < lines.length && !/^\s*```/.test(lines[index])) {
            codeLines.push(lines[index]);
            index += 1;
          }
          if (index < lines.length) index += 1;
          output.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
          continue;
        }

        const heading = line.match(/^\s*(#{1,6})\s+(.+?)\s*#*\s*$/);
        if (heading) {
          const level = heading[1].length;
          output.push(`<h${level}>${renderInline(heading[2])}</h${level}>`);
          index += 1;
          continue;
        }

        if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)) {
          output.push("<hr>");
          index += 1;
          continue;
        }

        if (/^\s*>/.test(line)) {
          const quoteLines = [];
          while (index < lines.length && /^\s*>/.test(lines[index])) {
            quoteLines.push(lines[index].replace(/^\s*>\s?/, ""));
            index += 1;
          }
          output.push(`<blockquote><p>${renderInline(quoteLines.join("<br>"))}</p></blockquote>`);
          continue;
        }

        const listMatch = line.match(/^\s*(?:([-*+])|(\d+)\.)\s+(.+)$/);
        if (listMatch) {
          const ordered = Boolean(listMatch[2]);
          const listTag = ordered ? "ol" : "ul";
          const items = [];
          while (index < lines.length) {
            const item = lines[index].match(/^\s*(?:([-*+])|(\d+)\.)\s+(.+)$/);
            if (!item || Boolean(item[2]) !== ordered) break;
            items.push(`<li>${renderInline(item[3])}</li>`);
            index += 1;
          }
          output.push(`<${listTag}>${items.join("")}</${listTag}>`);
          continue;
        }

        const paragraphLines = [];
        while (index < lines.length && lines[index].trim()) {
          if (index > 0 && (/^\s*```/.test(lines[index]) || /^\s*#{1,6}\s+/.test(lines[index]) || /^\s*>/.test(lines[index]) || /^\s*(?:[-*+]|\d+\.)\s+/.test(lines[index]) || /^\s*(---+|\*\*\*+|___+)\s*$/.test(lines[index]))) break;
          paragraphLines.push(lines[index]);
          index += 1;
        }
        if (paragraphLines.length) {
          output.push(`<p>${renderInline(paragraphLines.join("<br>"))}</p>`);
        } else {
          index += 1;
        }
      }

      return output.join("\n");
    }

    function showMarkdown() {
      document.body.classList.add("markdown-mode");
      rawView.setAttribute("aria-hidden", "false");
      backButton.focus();
    }

    function showArticle() {
      document.body.classList.remove("markdown-mode");
      rawView.setAttribute("aria-hidden", "true");
      viewMarkdownButton.focus();
    }

    renderedPost.innerHTML = renderMarkdown(markdownSource);
    rawMarkdown.textContent = markdownSource;
    viewMarkdownButton.addEventListener("click", showMarkdown);
    backButton.addEventListener("click", showArticle);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && document.body.classList.contains("markdown-mode")) {
        showArticle();
      }
    });
  </script>
