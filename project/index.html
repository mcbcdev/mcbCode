<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex">
  <link rel="icon" href="https://mcbcode.com/theme/favicon.png">
  <link rel="stylesheet" href="https://mcbcode.com/theme/site.css">
  <title>mcbCode | Project</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #111214; color: #c8c8c8; font-family: 'mcfont', sans-serif; overflow: hidden; }
    a { text-decoration: none; color: #ffffff; transition: color 0.2s; }
    a:hover { color: #05ee93; }
    g { color: #05ee93; }

    /* topnav */
    .topnav { position: fixed; top: 0; left: 0; right: 0; height: 48px; background: #161719; backdrop-filter: blur(8px); border-bottom: 1px solid #2a2a2e; display: flex; align-items: center; padding: 0 20px; z-index: 200; gap: 10px; flex-shrink: 0; }
    .topnav-logo { font-size: 18px; color: #fff; font-family: 'mcfontb', sans-serif; white-space: nowrap; }
    .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 12px; overflow: hidden; }
    .breadcrumb a { color: #888; transition: color 0.2s; white-space: nowrap; }
    .breadcrumb a:hover { color: #05ee93; }
    .breadcrumb span { color: #3a3a3a; }
    .breadcrumb-current { color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topnav-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .nav-btn { background: #222326; border: 1px solid #343438; color: #aaa; font-family: 'mcfont', sans-serif; font-size: 12px; padding: 5px 10px; cursor: pointer; transition: color 0.2s, border-color 0.2s; white-space: nowrap; }
    .nav-btn:hover { color: #05ee93; border-color: #05ee93; }

    /* full-height layout below topnav */
    .shell { display: flex; flex-direction: column; height: 100vh; padding-top: 48px; }

    /* project header bar */
    .proj-header { border-bottom: 1px solid #2a2a2e; padding: 14px 20px 0; flex-shrink: 0; background: #161719; }
    .proj-header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .proj-title { font-size: 18px; color: #fff; font-family: 'mcfontb', sans-serif; }
    .proj-badge { font-size: 10px; padding: 2px 7px; border: 1px solid #343438; color: #777; }
    .proj-badge.public { border-color: #05ee93; color: #05ee93; }
    .proj-tabs { display: flex; gap: 0; }
    .tab { padding: 6px 14px; font-size: 12px; color: #666; cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; }
    .tab:hover { color: #ccc; }
    .tab.active { color: #fff; border-bottom-color: #05ee93; }

    /* main panels area */
    .panels { display: flex; flex: 1; overflow: hidden; }

    /* left meta panel */
    .meta-panel { width: 260px; min-width: 260px; border-right: 1px solid #2a2a2e; overflow-y: auto; display: flex; flex-direction: column; background: #161719; }
    .meta-section { padding: 14px 16px; border-bottom: 1px solid #1e1e22; }
    .meta-label { font-size: 10px; color: #00b2ff; font-family: 'mcfontb', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
    .meta-value { font-size: 12px; color: #aaa; line-height: 1.5; }
    .meta-value.green { color: #05ee93; }
    .meta-value.mono { font-family: 'Fira Code', monospace; font-size: 11px; color: #666; background: #1e1e22; padding: 3px 6px; display: inline-block; }
    .tags-wrap { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag { font-size: 10px; padding: 2px 7px; background: #1e1e22; border: 1px solid #343438; color: #888; }
    .tag.removable { cursor: pointer; transition: border-color 0.15s, color 0.15s; }
    .tag.removable:hover { border-color: #ff5555; color: #ff5555; }
    .tag-row { display: flex; gap: 5px; margin-top: 6px; }
    .tag-input { flex: 1; background: #1e1e22; border: 1px solid #343438; color: #fff; font-family: 'mcfont', sans-serif; font-size: 11px; padding: 3px 7px; outline: none; }
    .tag-input:focus { border-color: #05ee93; }
    .tag-btn { background: #222326; border: 1px solid #343438; color: #888; font-family: 'mcfont', sans-serif; font-size: 11px; padding: 3px 8px; cursor: pointer; transition: color 0.15s; }
    .tag-btn:hover { color: #05ee93; }
    .stat-row { display: flex; gap: 20px; }
    .stat { display: flex; flex-direction: column; gap: 2px; }
    .stat-val { font-size: 20px; color: #05ee93; font-family: 'mcfontb', sans-serif; }
    .stat-lbl { font-size: 10px; color: #555; }

    /* right file panel */
    .file-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #111214; }

    /* path bar */
    .path-bar { display: flex; align-items: center; gap: 0; padding: 0 16px; height: 38px; border-bottom: 1px solid #2a2a2e; background: #161719; flex-shrink: 0; font-size: 12px; }
    .path-crumb { color: #00b2ff; cursor: pointer; transition: color 0.15s; padding: 0 2px; }
    .path-crumb:hover { color: #66d4ff; }
    .path-sep { color: #343438; padding: 0 4px; }
    .path-toolbar { margin-left: auto; display: flex; gap: 6px; }
    .sm-btn { background: #222326; border: 1px solid #343438; color: #aaa; font-family: 'mcfont', sans-serif; font-size: 11px; padding: 3px 10px; cursor: pointer; transition: color 0.15s, border-color 0.15s; white-space: nowrap; }
    .sm-btn:hover { color: #05ee93; border-color: #05ee93; }
    .sm-btn.danger:hover { color: #ff5555; border-color: #ff5555; }

    /* file list */
    .file-list { flex: 1; overflow-y: auto; }
    .file-row { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid #1a1a1e; cursor: pointer; transition: background 0.12s; font-size: 13px; }
    .file-row:hover { background: #1a1c1f; }
    .file-row:hover .file-del { opacity: 1; }
    .file-icon { font-size: 13px; color: #555; width: 16px; text-align: center; flex-shrink: 0; }
    .file-icon.folder { color: #00b2ff; }
    .file-name { flex: 1; color: #c8c8c8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-name.folder { color: #fff; font-family: 'mcfontb', sans-serif; }
    .file-updated { font-size: 11px; color: #444; white-space: nowrap; flex-shrink: 0; }
    .file-del { opacity: 0; background: none; border: none; color: #555; font-size: 11px; padding: 2px 6px; cursor: pointer; font-family: 'mcfont', sans-serif; transition: color 0.15s; flex-shrink: 0; }
    .file-del:hover { color: #ff5555; }
    .file-list-empty { padding: 48px 20px; text-align: center; color: #333; font-size: 13px; }

    /* settings panel */
    .settings-panel { flex: 1; overflow-y: auto; padding: 28px 32px; display: none; background: #111214; }
    .settings-panel.active { display: block; }
    .set-field { margin-bottom: 18px; }
    .set-field label { display: block; font-size: 10px; color: #00b2ff; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; font-family: 'mcfontb', sans-serif; }
    .set-field input, .set-field textarea { width: 100%; background: #1a1c1f; border: 1px solid #343438; color: #fff; font-family: 'mcfont', sans-serif; font-size: 13px; padding: 7px 10px; outline: none; transition: border-color 0.2s; resize: vertical; }
    .set-field input:focus, .set-field textarea:focus { border-color: #05ee93; }
    .vis-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    input[type="checkbox"].toggle { appearance: none; -webkit-appearance: none; background: #343438; width: 1.4em; height: 1.4em; cursor: pointer; flex-shrink: 0; transition: background 0.2s; }
    input[type="checkbox"].toggle:checked { background: #05ee93; }
    .save-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
    .primary-btn { background: #05ee93; border: none; color: #0c0c0c; font-family: 'mcfont', sans-serif; font-size: 13px; padding: 6px 18px; cursor: pointer; transition: background 0.2s; }
    .primary-btn:hover { background: #78e3a6; }
    .inline-msg { font-size: 11px; }
    .inline-msg.ok  { color: #05ee93; }
    .inline-msg.err { color: #ff5555; }

    /* modals */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 500; align-items: center; justify-content: center; }
    .overlay.open { display: flex; }
    .modal { background: #1a1c1f; border: 1px solid #343438; padding: 24px 28px; min-width: 320px; }
    .modal h3 { color: #fff; font-size: 14px; margin-bottom: 16px; }
    .modal-field { margin-bottom: 12px; }
    .modal-field label { display: block; font-size: 10px; color: #00b2ff; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; font-family: 'mcfontb', sans-serif; }
    .modal-field input { width: 100%; background: #111214; border: 1px solid #343438; color: #fff; font-family: 'mcfont', sans-serif; font-size: 13px; padding: 6px 9px; outline: none; transition: border-color 0.2s; }
    .modal-field input:focus { border-color: #05ee93; }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
    .modal-err { font-size: 11px; color: #ff5555; margin-top: 6px; display: none; }
    .modal-err.show { display: block; }
    .cancel-btn { background: #222326; border: 1px solid #343438; color: #aaa; font-family: 'mcfont', sans-serif; font-size: 12px; padding: 5px 14px; cursor: pointer; }
    .cancel-btn:hover { color: #fff; border-color: #555; }

    .confirm-modal { background: #1a1c1f; border: 1px solid #343438; padding: 24px 28px; min-width: 300px; text-align: center; }
    .confirm-modal p { font-size: 14px; color: #fff; margin-bottom: 4px; }
    .confirm-modal small { font-size: 11px; color: #666; }
    .confirm-modal .modal-actions { justify-content: center; }
    .del-btn { background: #ff5555; border: none; color: #fff; font-family: 'mcfont', sans-serif; font-size: 12px; padding: 5px 16px; cursor: pointer; }
    .del-btn:hover { background: #cc0000; }

    .loading-msg { padding: 48px; text-align: center; color: #444; font-size: 13px; }
    .err-msg { padding: 48px; text-align: center; color: #ff5555; font-size: 13px; }
  </style>
</head>
<body>

  <!-- new file/folder modal -->
  <div class="overlay" id="new-file-overlay">
    <div class="modal">
      <h3 id="nf-title">New File</h3>
      <div class="modal-field">
        <label>Name</label>
        <input type="text" id="nf-name" maxlength="128">
      </div>
      <div class="modal-err" id="nf-err"></div>
      <div class="modal-actions">
        <button class="cancel-btn" onclick="closeModal('new-file-overlay')">Cancel</button>
        <button class="primary-btn" id="nf-submit" onclick="submitNewFile()">Create</button>
      </div>
    </div>
  </div>

  <!-- delete confirm -->
  <div class="overlay" id="del-overlay">
    <div class="confirm-modal">
      <p>Delete this item?</p>
      <small id="del-name"></small>
      <div class="modal-actions">
        <button class="del-btn" onclick="confirmDelete()">Delete</button>
        <button class="cancel-btn" onclick="closeModal('del-overlay')">Cancel</button>
      </div>
    </div>
  </div>

  <!-- topnav -->
  <div class="topnav">
    <a href="/" class="topnav-logo">mcb<g>Code</g></a>
    <div class="breadcrumb">
      <span>/</span>
      <a href="/dashboard">dashboard</a>
      <span>/</span>
      <span class="breadcrumb-current" id="bc-project">...</span>
    </div>
    <div class="topnav-right">
      <span style="font-size:11px; color:#333;" id="nav-user"></span>
      <button class="nav-btn" onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <div class="shell">

    <!-- project header -->
    <div class="proj-header">
      <div class="proj-header-top">
        <span class="proj-title" id="proj-title">Loading...</span>
        <span class="proj-badge" id="proj-badge">private</span>
      </div>
      <div class="proj-tabs">
        <div class="tab active" id="tab-files-btn" onclick="switchTab('files', this)">Files</div>
        <div class="tab" id="tab-settings-btn" onclick="switchTab('settings', this)" style="display:none;">Settings</div>
      </div>
    </div>

    <!-- panels -->
    <div class="panels" id="tab-files">

      <!-- left meta panel -->
      <div class="meta-panel">
        <div class="meta-section">
          <div class="meta-label">About</div>
          <div class="meta-value" id="m-desc">—</div>
        </div>
        <div class="meta-section">
          <div class="meta-label">Owner</div>
          <div class="meta-value green" id="m-owner">—</div>
        </div>
        <div class="meta-section">
          <div class="meta-label">Updated</div>
          <div class="meta-value" id="m-updated">—</div>
        </div>
        <div class="meta-section">
          <div class="meta-label">Project ID</div>
          <div class="meta-value mono" id="m-code">—</div>
        </div>
        <div class="meta-section">
          <div class="meta-label">Tags</div>
          <div class="tags-wrap" id="tags-wrap"></div>
        </div>
        <div class="meta-section">
          <div class="stat-row">
            <div class="stat"><div class="stat-val" id="s-files">—</div><div class="stat-lbl">Files</div></div>
            <div class="stat"><div class="stat-val" id="s-folders">—</div><div class="stat-lbl">Folders</div></div>
          </div>
        </div>
      </div>

      <!-- right file panel -->
      <div class="file-panel">

        <!-- path breadcrumb bar -->
        <div class="path-bar">
          <span class="path-crumb" id="path-root" onclick="navToRoot()">root</span>
          <span id="path-segments"></span>
          <div class="path-toolbar" id="owner-toolbar" style="display:none;">
            <button class="sm-btn" onclick="openNewFile('file')">+ File</button>
            <button class="sm-btn" onclick="openNewFile('folder')">+ Folder</button>
          </div>
        </div>

        <!-- file list -->
        <div class="file-list" id="file-list">
          <div class="loading-msg">Loading...</div>
        </div>

      </div>
    </div>

    <!-- settings tab -->
    <div class="settings-panel" id="tab-settings">
      <h3 style="color:#fff; font-size:15px; margin-bottom:22px;">Project Settings</h3>
      <div class="set-field">
        <label>Project Name</label>
        <input type="text" id="set-name" maxlength="72">
      </div>
      <div class="set-field">
        <label>Description</label>
        <textarea id="set-desc" rows="3" maxlength="256"></textarea>
      </div>
      <div class="set-field">
        <label>Visibility</label>
        <div class="vis-row">
          <input type="checkbox" class="toggle" id="set-public">
          <label for="set-public" style="cursor:pointer; font-size:13px; color:#888;">Make project public</label>
        </div>
      </div>
      <div class="save-row">
        <button class="primary-btn" onclick="saveSettings()">Save Changes</button>
        <span class="inline-msg" id="set-msg"></span>
      </div>
    </div>

  </div>

  <script>
    const AUTH = "https://auth.mcbcode.com";
    const shareCode = location.pathname.split("/").filter(Boolean)[1] || "";

    let project     = null;
    let allFiles    = [];
    let isOwner     = false;
    let currentPath = []; // array of {id, name} folder nodes
    let tags        = [];
    let pendingDelId = null;
    let newFileType  = "file";
    let newFileParentId = null;

    function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
    function fmtDate(s) {
      if (!s) return "—";
      const d = new Date(s.endsWith("Z") ? s : s + "Z");
      return d.toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" });
    }

    function editorUrl(file) {
      const name = file.name.toLowerCase();
      if (name === "manifest.json") return `/editor/manifest?save=${file.save_id}`;
      if (name.endsWith(".mcfunction")) return `/editor/mcfunction?save=${file.save_id}`;
      return `/editor/json?save=${file.save_id}`;
    }

    // ---- INIT ----
    (async () => {
      if (!shareCode) return showErr("No project ID in URL.");
      try {
        const r = await fetch(`${AUTH}/me`, { credentials: "include" });
        if (r.ok) {
          const d = await r.json();
          document.getElementById("nav-user").textContent = d.email;
          window._myId = d.id;
        }
      } catch {}

      try {
        const r = await fetch(`${AUTH}/project?code=${encodeURIComponent(shareCode)}`, { credentials: "include" });
        if (!r.ok) { const d = await r.json(); return showErr(d.error || "Not found."); }
        const d = await r.json();
        project  = d.project;
        allFiles = d.files || [];
        isOwner  = window._myId && project.owner_id === window._myId;
        render();
      } catch { showErr("Failed to load project."); }
    })();

    function showErr(msg) {
      document.getElementById("file-list").innerHTML = `<div class="err-msg">${esc(msg)}</div>`;
      document.getElementById("proj-title").textContent = "Error";
    }

    function render() {
      document.title = `mcbCode | ${project.name}`;
      document.getElementById("proj-title").textContent  = project.name;
      document.getElementById("bc-project").textContent  = project.name;
      const isPublic = project.is_public === 1 || project.is_public === true;
      const badge = document.getElementById("proj-badge");
      badge.textContent = isPublic ? "public" : "private";
      badge.classList.toggle("public", isPublic);

      document.getElementById("m-desc").textContent    = project.description || "No description.";
      document.getElementById("m-owner").textContent   = isOwner ? "you" : `#${project.owner_id}`;
      document.getElementById("m-updated").textContent = fmtDate(project.updated_at);
      document.getElementById("m-code").textContent    = project.share_code;

      updateStats();
      renderTags();

      if (isOwner) {
        document.getElementById("owner-toolbar").style.display = "flex";
        document.getElementById("tab-settings-btn").style.display = "";
        document.getElementById("set-name").value    = project.name;
        document.getElementById("set-desc").value    = project.description || "";
        document.getElementById("set-public").checked = isPublic;
      }

      renderFileList();
    }

    // ---- STATS ----
    function updateStats() {
      document.getElementById("s-files").textContent   = allFiles.filter(f => f.type === "file").length;
      document.getElementById("s-folders").textContent = allFiles.filter(f => f.type === "folder").length;
    }

    // ---- TAGS ----
    function renderTags() {
      const wrap = document.getElementById("tags-wrap");
      wrap.innerHTML = "";
      if (tags.length === 0 && !isOwner) { wrap.innerHTML = `<span style="font-size:11px;color:#2a2a2a;">none</span>`; return; }
      tags.forEach((t, i) => {
        const el = document.createElement("span");
        el.className = isOwner ? "tag removable" : "tag";
        el.textContent = t;
        if (isOwner) el.onclick = () => { tags.splice(i, 1); renderTags(); };
        wrap.appendChild(el);
      });
      if (isOwner) {
        const row = document.createElement("div");
        row.className = "tag-row";
        row.innerHTML = `<input class="tag-input" id="tag-input" maxlength="24" placeholder="add tag...">
                         <button class="tag-btn" onclick="addTag()">+</button>`;
        wrap.appendChild(row);
        document.getElementById("tag-input").onkeydown = e => { if (e.key === "Enter") addTag(); };
      }
    }
    function addTag() {
      const inp = document.getElementById("tag-input");
      const v = inp.value.trim().toLowerCase().replace(/[^a-z0-9\-_]/g, "");
      if (!v || tags.includes(v) || tags.length >= 10) return;
      tags.push(v); renderTags();
    }

    // ---- FILE LIST ----
    function currentFolderId() {
      return currentPath.length ? currentPath[currentPath.length - 1].id : null;
    }

    function renderFileList() {
      renderPathBar();
      const list = document.getElementById("file-list");
      list.innerHTML = "";

      const parentId = currentFolderId();
      const children = allFiles
        .filter(f => f.parent_id === parentId || (parentId === null && f.parent_id === null))
        .sort((a, b) => {
          if (a.type !== b.type) return a.type === "folder" ? -1 : 1;
          return a.name.localeCompare(b.name);
        });

      // if inside a folder, show ".." row to go up
      if (currentPath.length > 0) {
        const up = document.createElement("div");
        up.className = "file-row";
        up.innerHTML = `<span class="file-icon folder">^</span><span class="file-name folder">..</span>`;
        up.onclick = () => { currentPath.pop(); renderFileList(); };
        list.appendChild(up);
      }

      if (children.length === 0) {
        list.innerHTML += `<div class="file-list-empty">${isOwner ? 'Empty folder. Use the buttons above to add files.' : 'Nothing here.'}</div>`;
        return;
      }

      children.forEach(f => {
        const row = document.createElement("div");
        row.className = "file-row";

        const icon = f.type === "folder" ? "+" : ">";
        const nameClass = f.type === "folder" ? "file-name folder" : "file-name";

        row.innerHTML = `
          <span class="file-icon${f.type === 'folder' ? ' folder' : ''}">${icon}</span>
          <span class="${nameClass}">${esc(f.name)}</span>
          <span class="file-updated">${fmtDate(f.updated_at)}</span>
          ${isOwner ? `<button class="file-del" onclick="askDelete(event, ${f.id}, '${esc(f.name)}')">del</button>` : ""}
        `;

        if (f.type === "folder") {
          row.onclick = (e) => {
            if (e.target.classList.contains("file-del")) return;
            currentPath.push({ id: f.id, name: f.name });
            renderFileList();
          };
        } else {
          row.onclick = (e) => {
            if (e.target.classList.contains("file-del")) return;
            if (!f.save_id) return;
            window.location.href = editorUrl(f);
          };
          // grey out files with no save_id (shouldn't happen but just in case)
          if (!f.save_id) {
            row.style.opacity = "0.4";
            row.style.cursor = "default";
          }
        }

        list.appendChild(row);
      });
    }

    // ---- PATH BAR ----
    function renderPathBar() {
      const seg = document.getElementById("path-segments");
      seg.innerHTML = "";
      currentPath.forEach((crumb, i) => {
        const sep = document.createElement("span");
        sep.className = "path-sep";
        sep.textContent = "/";
        seg.appendChild(sep);

        const el = document.createElement("span");
        el.className = "path-crumb";
        el.textContent = crumb.name;
        el.onclick = () => { currentPath = currentPath.slice(0, i + 1); renderFileList(); };
        seg.appendChild(el);
      });
    }

    function navToRoot() {
      currentPath = [];
      renderFileList();
    }

    // ---- NEW FILE/FOLDER ----
    function openNewFile(type) {
      newFileType     = type;
      newFileParentId = currentFolderId();
      document.getElementById("nf-title").textContent = type === "folder" ? "New Folder" : "New File";
      document.getElementById("nf-name").value = "";
      document.getElementById("nf-name").placeholder = type === "folder" ? "e.g. functions" : "e.g. player.mcfunction";
      document.getElementById("nf-err").textContent = "";
      document.getElementById("nf-err").classList.remove("show");
      document.getElementById("new-file-overlay").classList.add("open");
      setTimeout(() => document.getElementById("nf-name").focus(), 50);
    }

    async function submitNewFile() {
      const name = document.getElementById("nf-name").value.trim();
      const err  = document.getElementById("nf-err");
      const btn  = document.getElementById("nf-submit");
      if (!name) { err.textContent = "Name is required."; err.classList.add("show"); return; }
      btn.disabled = true;
      try {
        const res = await fetch(`${AUTH}/project/file`, {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ project_code: shareCode, parent_id: newFileParentId, name, type: newFileType })
        });
        const d = await res.json();
        if (!res.ok) { err.textContent = d.error || "Failed."; err.classList.add("show"); return; }
        allFiles.push({ id: d.file_id, project_id: project.id, parent_id: newFileParentId, name, type: newFileType, save_id: d.save_id || null, updated_at: new Date().toISOString() });
        closeModal("new-file-overlay");
        updateStats();
        renderFileList();
      } catch { err.textContent = "Something went wrong."; err.classList.add("show"); }
      btn.disabled = false;
    }

    // ---- DELETE ----
    function askDelete(e, id, name) {
      e.stopPropagation();
      pendingDelId = id;
      document.getElementById("del-name").textContent = name;
      document.getElementById("del-overlay").classList.add("open");
    }

    async function confirmDelete() {
      if (!pendingDelId) return closeModal("del-overlay");
      const id = pendingDelId;
      closeModal("del-overlay");
      try {
        const res = await fetch(`${AUTH}/project/file?file_id=${encodeURIComponent(id)}&project_code=${encodeURIComponent(shareCode)}`, {
          method: "DELETE", credentials: "include"
        });
        if (res.ok) { removeFromCache(id); updateStats(); renderFileList(); }
      } catch {}
    }

    function removeFromCache(id) {
      allFiles.filter(f => f.parent_id === id).forEach(c => removeFromCache(c.id));
      const i = allFiles.findIndex(f => f.id === id);
      if (i !== -1) allFiles.splice(i, 1);
    }

    // ---- SETTINGS ----
    async function saveSettings() {
      const name = document.getElementById("set-name").value.trim();
      const desc = document.getElementById("set-desc").value.trim();
      const pub  = document.getElementById("set-public").checked;
      const msg  = document.getElementById("set-msg");
      if (!name) return;
      try {
        const res = await fetch(`${AUTH}/project/settings`, {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ project_code: shareCode, name, description: desc, is_public: pub })
        });
        if (res.ok) {
          project.name = name; project.description = desc; project.is_public = pub;
          document.getElementById("proj-title").textContent = name;
          document.getElementById("bc-project").textContent = name;
          document.getElementById("m-desc").textContent = desc || "No description.";
          const badge = document.getElementById("proj-badge");
          badge.textContent = pub ? "public" : "private";
          badge.classList.toggle("public", pub);
          msg.textContent = "Saved!"; msg.className = "inline-msg ok";
        } else {
          const d = await res.json();
          msg.textContent = d.error || "Failed."; msg.className = "inline-msg err";
        }
      } catch { msg.textContent = "Error."; msg.className = "inline-msg err"; }
      setTimeout(() => { msg.textContent = ""; msg.className = "inline-msg"; }, 3000);
    }

    // ---- TABS ----
    function switchTab(tab, el) {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      el.classList.add("active");
      document.getElementById("tab-files").style.display    = tab === "files" ? "flex" : "none";
      document.getElementById("tab-settings").classList.toggle("active", tab === "settings");
    }

    // ---- UTILS ----
    function closeModal(id) {
      document.getElementById(id).classList.remove("open");
      pendingDelId = null;
    }
    document.getElementById("new-file-overlay").addEventListener("click", e => { if (e.target === e.currentTarget) closeModal("new-file-overlay"); });
    document.getElementById("del-overlay").addEventListener("click", e => { if (e.target === e.currentTarget) closeModal("del-overlay"); });

    async function doLogout() {
      await fetch(`${AUTH}/logout`, { method: "POST", credentials: "include" });
      window.location.href = "/account";
    }
  </script>

  <script data-goatcounter="https://mcbcode.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
