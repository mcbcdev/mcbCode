<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="https://mcbcode.com/theme/favicon.png">
  <link rel="stylesheet" href="https://mcbcode.com/theme/site.css">
  <title>mcbCode | Verifying...</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0c0c0c; color: #bebebe; font-family: 'mcfont', sans-serif; display: flex; align-items: center; justify-content: center; }
    .box { text-align: center; font-size: 14px; color: #444; }
    g { color: #05ee93; }
  </style>
</head>
<body>
  <div class="box">mcb<g>Code</g> &mdash; verifying your email...</div>
  <script>
    // just redirect to the worker's verify endpoint with the token
    // the worker does the actual verification and redirects to /dashboard?verify=ok
    const token = new URLSearchParams(location.search).get("token") || "";
    if (token) {
      window.location.href = `https://auth.mcbcode.com/verify?token=${encodeURIComponent(token)}`;
    } else {
      window.location.href = "/dashboard";
    }
  </script>
</body>
