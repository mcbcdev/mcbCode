<style>
  /* --- mcbCode navigation --- */
  .navi {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 75px;
    background: rgba(12, 12, 12, 0.48);
    -webkit-backdrop-filter: blur(18px) saturate(145%);
    backdrop-filter: blur(18px) saturate(145%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.09);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.055);
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-sizing: border-box;
    padding: 0 5%;
    z-index: 1000;
    isolation: isolate;
    overflow: visible;
  }

  /* LiquidGlass injects its rendering canvas into this element. */
  .navi > canvas {
    pointer-events: none !important;
  }

  .navi a {
    color: #fff !important;
    text-decoration: none;
    position: relative;
    z-index: 1;
  }

  .navi-brand a {
    display: flex;
    align-items: center;
  }

  .navi-logo {
    height: 35px;
    margin-right: 12px;
    filter: drop-shadow(0 0 5px rgba(5, 238, 147, 0.2));
  }

  .navi-brand h2 {
    font-size: 24px;
  }

  .quick-links {
    display: flex;
    align-items: center;
    gap: 30px;
    position: relative;
    z-index: 2;
  }

  /* --- Dropdown --- */
  .dropdown-btn {
    width: 18px;
    height: 18px;
    background-image: url('https://mcbcode.com/img/icons/dropdown.png');
    background-size: cover;
    transition: transform 0.3s ease, filter 0.3s ease;
    cursor: pointer;
  }

  .dropdown-btn:hover,
  .dropdown-btn.active {
    background-image: url('https://mcbcode.com/img/icons/dropdown-selected.png');
    filter: drop-shadow(0 0 5px var(--accent-color));
  }

  .dropdown-btn.active {
    transform: rotate(180deg);
  }

  .dropdown {
    position: fixed;
    width: 90%;
    max-width: 600px;
    background: rgba(20, 20, 20, 0.88);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, 0.1);
    z-index: 999;
    top: 85px;
    left: 50% !important;
    transform: translateX(-50%) translateY(-10px);
    padding: 20px;
    transition:
      opacity 0.25s ease,
      transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275),
      visibility 0.25s ease;
    opacity: 0;
    visibility: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  .dropdown-btn.active ~ .dropdown,
  .dropdown.active {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
  }

  .dropdown-content {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px 30px;
    width: 100%;
  }

  .dropdown-content a {
    flex: 1 1 auto;
    min-width: 100px;
    padding: 10px;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .dropdown-content a:hover {
    background-color: rgba(255, 255, 255, 0.06);
  }

  @media (max-width: 650px) {
    .navi {
      padding: 0 5%;
    }

    .quick-links {
      gap: 16px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .dropdown,
    .dropdown-btn {
      transition: none;
    }
  }
</style>

<div class="navi" id="mcbcode-navi">
  <div class="navi-brand">
    <a href="https://mcbcode.com">
      <img src="https://mcbcode.com/img/icons/default-transparent.png" alt="mcbCode Logo" class="navi-logo">
      <h2><span style="color:#fff;font-family:mcfontb">mcb</span><span style="color:#05ee93;font-family:mcfontb">Code</span></h2>
    </a>
  </div>

  <div class="quick-links">
    <a href="https://github.com/xyztoast/mcbCode">source</a>
    <a href="https://mcbcode.com/dashboard">dashboard</a>
    <div class="dropdown-btn" id="dd" role="button" tabindex="0" aria-label="open navigation menu" aria-expanded="false"></div>
    <div class="dropdown">
      <div class="dropdown-content">
        <a href="https://mcbcode.com/terms-of-use">terms</a>
        <a href="https://roadmap.mcbcode.com">roadmap</a>
        <a href="https://mcbcode.com/docs/">documentation</a>
        <a href="https://mcbcode.com/about">about</a>
        <a href="https://mcbcode.com/profile">profiles</a>
        <a href="https://mcbcode.com/search">search</a>
        <a href="https://mcbcode.com/explore" style="color:#d7b9f0">explore</a>
        <a href="https://mcbcode.com/download">download</a>
      </div>
    </div>
  </div>
</div>
