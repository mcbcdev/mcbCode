<!doctype html>
<html lang="en">
<head>

  <link rel="icon" href="https://mcbcode.com/theme/favicon.png">
  <link rel="stylesheet" href="https://mcbcode.com/theme/site.css">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>mcbCode's Terms of Use</title>
  <style>
    html,body{
      min-height:100%;
      margin:0;
      font-family: 'mcfont', sans-serif;
      background: #0c0c0c;
      font-weight: 0;
      color:#bebebe;
      justify-content: left;
      margin: auto;
      text-align: left;
      max-width: 85%;
    }

    h1{
      font-family: "mcfontb", sans-serif;
      font-size: 40px;
      margin-top: 20vh;
      color: #ffffff;
      text-align: center;
    }

    a {
        text-decoration: underline;
        color: #ffffff;
        transition: color 0.2s ease-in-out;
    }

    a:hover {
        color: #05ee93;
    }

  .mcbc {
    position: fixed;
    left: 5px;
    top: 10px;
    height: 50px;
    max-width: 50px;
  }

  c {
      color: #e7007b;
      font-family: inherit !important;
  }

  button {
      text-align: center;
      background-color: #313131;
      border: none;
      font-size: 18px;
      border-radius: 12px;
      padding: 8px 12px;
      color: #ffffff;
      transition: color 0.2s ease-in-out;
      cursor: pointer;
  }

  button:hover {
      color: #05ee93;
  }

  #tryitout {
      color: #0c0c0c;
      background-color: #05ee93;
      box-shadow: 0 0 20px 10px #05ee934;
      transition: color 0.2s ease-in-out, background-color 0.2s ease-in-out;
      border: 4px solid #00a459;
  }

  #tryitout:hover {
      color: #ffffff;
      background-color: #00a95c;
  }

    .terms {
      margin: auto;
      width: 80%;
    }
    .terms h2, p {
      text-align: left;
      font-weight: 0;
      width: 75;
    }
    h2 {
     font-size: 30px;
     color: #05ee93;

    }

  .terms p {
    color: #fff;
  }

  be {
    color: #bebebe
  }
  #p {
    text-align: center;
  }
  </style>
</head>
<body>

<div id="markdown-content"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
fetch("https://mcbcode.com/elements/terms-of-use.md")
  .then(response => response.text())
  .then(markdown => {
    document.getElementById("markdown-content").innerHTML = marked.parse(markdown);
  });
</script>
