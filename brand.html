<!doctype html>

<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

<title>mcbCode media kit</title>

<link rel="stylesheet" href="https://mcbcode.com/theme/site.css">
<link rel="icon" href="https://mcbcode.com/theme/favicon.png">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
    :root {
        --brand-green: #05ee93;
        --text-primary: #ffffff;
        --text-secondary: #bebebe;
        --text-muted: #7c7c7c;
        --border: #343434;
        --border-strong: #505050;
        --surface: #121212;
        --surface-hover: #191919;
        --surface-active: #202020;
        --content-max: 1000px;
        --sidebar-width: 250px;
    }

    * {
        box-sizing: border-box;
    }

    html {
        min-height: 100%;
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        min-height: 100vh;
        color: var(--text-secondary);
        background: #0c0c0c;
        overflow-x: hidden;
    }

    button,
    a {
        -webkit-tap-highlight-color: transparent;
    }

    .app {
        min-height: 100vh;
        display: flex;
    }

    /* sidebar */

    .sidebar {
        position: sticky;
        top: 0;
        width: var(--sidebar-width);
        height: 100vh;
        flex: 0 0 var(--sidebar-width);
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        background: #0c0c0c;
        overflow-y: auto;
        z-index: 100;
    }

    .sidebar-header {
        padding: 22px 18px 18px;
        border-bottom: 1px solid var(--border);
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text-primary);
        text-decoration: none;
    }

    .brand img {
        width: 36px;
        height: 36px;
        object-fit: contain;
        flex: 0 0 36px;
    }

    .brand-name {
        margin: 0;
        font-size: 18px;
        line-height: 1;
        font-family: mcfontb;
        color: #ffffff;
    }

    .brand-name span {
        color: var(--brand-green);
    }

    .brand-subtitle {
        margin: 8px 0 0 46px;
        font-size: 12px;
        line-height: 1.4;
        color: var(--text-muted);
    }

    .nav {
        padding: 14px 10px 18px;
    }

    .nav-group {
        margin-bottom: 22px;
    }

    .nav-group-title {
        margin: 0 0 7px;
        padding: 0 8px;
        color: #777777;
        font-size: 11px;
        line-height: 1.4;
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }

    .item {
        width: 100%;
        display: flex;
        align-items: center;
        min-height: 34px;
        margin: 2px 0;
        padding: 7px 10px;
        border: 1px solid transparent;
        background: transparent;
        color: #ffffff;
        font: inherit;
        font-size: 14px;
        text-align: left;
        cursor: pointer;
        user-select: none;
        transition:
            background-color 120ms ease,
            border-color 120ms ease,
            color 120ms ease;
    }

    .item:hover {
        background: var(--surface-hover);
        border-color: var(--border);
    }

    .item.active {
        background: var(--surface-active);
        border-color: var(--border-strong);
        color: var(--brand-green);
    }

    .item.active::before {
        content: "";
        width: 3px;
        height: 18px;
        margin-right: 8px;
        background: var(--brand-green);
    }

    .sidebar-footer {
        margin-top: auto;
        padding: 12px 18px 18px;
        border-top: 1px solid var(--border);
    }

    .sidebar-footer a {
        color: #8a8a8a;
        font-size: 12px;
        text-decoration: none;
    }

    .sidebar-footer a:hover {
        color: #ffffff;
    }

    /* mobile header */

    .mobile-header {
        position: sticky;
        top: 0;
        display: none;
        align-items: center;
        justify-content: space-between;
        height: 58px;
        padding: 0 14px;
        border-bottom: 1px solid var(--border);
        background: rgba(12, 12, 12, 0.94);
        backdrop-filter: blur(10px);
        z-index: 90;
    }

    .mobile-title {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        color: #ffffff;
        font-size: 14px;
    }

    .mobile-title span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .mobile-title .separator {
        color: #555555;
    }

    .mobile-menu-button {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border: 1px solid var(--border);
        background: transparent;
        cursor: pointer;
    }

    .mobile-menu-button:hover {
        background: var(--surface-hover);
    }

    .hamburger {
        position: relative;
        width: 16px;
        height: 12px;
    }

    .hamburger::before,
    .hamburger::after,
    .hamburger span {
        content: "";
        position: absolute;
        left: 0;
        width: 16px;
        height: 1px;
        background: #ffffff;
    }

    .hamburger::before {
        top: 0;
    }

    .hamburger span {
        top: 5px;
    }

    .hamburger::after {
        top: 10px;
    }

    .mobile-overlay {
        position: fixed;
        inset: 0;
        display: none;
        background: rgba(0, 0, 0, 0.55);
        z-index: 95;
    }

    /* content */

    .content-shell {
        min-width: 0;
        flex: 1;
    }

    #content {
        width: min(100%, var(--content-max));
        margin: 0 auto;
        padding: 56px 52px 96px;
    }

    .page-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 26px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
    }

    .page-context {
        color: var(--text-muted);
        font-size: 12px;
    }

    .page-context strong {
        color: #cfcfcf;
        font-weight: 500;
    }

    .page-label {
        flex: 0 0 auto;
        color: var(--brand-green);
        font-size: 12px;
        font-family: monospace;
    }

    /* loading */

    .page-loading {
        display: grid;
        gap: 12px;
    }

    .loading-line {
        height: 12px;
        width: 100%;
        background: #1b1b1b;
        animation: pulse 1.2s ease-in-out infinite;
    }

    .loading-line.short {
        width: 55%;
    }

    .loading-line.medium {
        width: 74%;
    }

    @keyframes pulse {
        0%,
        100% {
            opacity: 0.5;
        }

        50% {
            opacity: 1;
        }
    }

    /* markdown */

    .markdown-content {
        color: var(--text-secondary);
        font-size: 15px;
        line-height: 1.7;
    }

    .markdown-content > :first-child {
        margin-top: 0;
    }

    .markdown-content h1,
    .markdown-content h2,
    .markdown-content h3,
    .markdown-content h4 {
        color: #ffffff;
        line-height: 1.2;
        scroll-margin-top: 24px;
    }

    .markdown-content h1 {
        margin: 0 0 20px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border);
        font-size: clamp(30px, 5vw, 42px);
        letter-spacing: -0.025em;
    }

    .markdown-content h2 {
        margin: 56px 0 16px;
        font-size: 25px;
        letter-spacing: -0.015em;
    }

    .markdown-content h3 {
        margin: 34px 0 12px;
        font-size: 19px;
    }

    .markdown-content h4 {
        margin: 26px 0 10px;
        font-size: 16px;
    }

    .markdown-content p {
        margin: 0 0 18px;
        color: #b6b6b6;
    }

    .markdown-content strong {
        color: #ffffff;
        font-weight: 600;
    }

    .markdown-content em {
        color: #d0d0d0;
    }

    .markdown-content a {
        color: var(--brand-green);
        text-decoration: none;
    }

    .markdown-content a:hover {
        text-decoration: underline;
    }

    .markdown-content ul,
    .markdown-content ol {
        margin: 0 0 20px;
        padding-left: 24px;
    }

    .markdown-content li {
        margin: 6px 0;
    }

    .markdown-content li::marker {
        color: #666666;
    }

    .markdown-content blockquote {
        margin: 24px 0;
        padding: 12px 16px;
        border-left: 3px solid var(--brand-green);
        background: #111111;
        color: #a9a9a9;
    }

    .markdown-content blockquote p:last-child {
        margin-bottom: 0;
    }

    .markdown-content hr {
        margin: 40px 0;
        border: 0;
        border-top: 1px solid var(--border);
    }

    .markdown-content img {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 22px 0;
        border: 1px solid var(--border);
    }

    .markdown-content code {
        padding: 2px 6px;
        border: 1px solid #2b2b2b;
        background: #151515;
        color: #d7d7d7;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.9em;
    }

    .markdown-content pre {
        margin: 22px 0;
        padding: 16px;
        overflow-x: auto;
        border: 1px solid var(--border);
        background: #0b0b0b;
    }

    .markdown-content pre code {
        padding: 0;
        border: 0;
        background: transparent;
        color: #d7d7d7;
        font-size: 13px;
        line-height: 1.65;
    }

    .markdown-content table {
        width: 100%;
        margin: 24px 0;
        border-collapse: collapse;
        display: block;
        overflow-x: auto;
        white-space: nowrap;
    }

    .markdown-content th,
    .markdown-content td {
        padding: 10px 12px;
        border: 1px solid var(--border);
        text-align: left;
    }

    .markdown-content th {
        background: #151515;
        color: #ffffff;
        font-weight: 600;
    }

    .markdown-content td {
        color: #b6b6b6;
    }

    .markdown-content tr:nth-child(even) td {
        background: #101010;
    }

    .markdown-content input[type="checkbox"] {
        accent-color: var(--brand-green);
    }

    /* errors */

    .page-error {
        padding: 24px;
        border: 1px solid var(--border);
        background: #111111;
    }

    .page-error h1 {
        margin: 0 0 10px;
        color: #ffffff;
        font-size: 24px;
    }

    .page-error p {
        margin: 0;
        color: #999999;
    }

    /* mobile */

    @media (max-width: 760px) {
        .app {
            display: block;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: min(86vw, 300px);
            height: 100dvh;
            transform: translateX(-100%);
            transition: transform 180ms ease;
            box-shadow: 12px 0 35px rgba(0, 0, 0, 0.35);
        }

        body.nav-open .sidebar {
            transform: translateX(0);
        }

        body.nav-open .mobile-overlay {
            display: block;
        }

        .mobile-header {
            display: flex;
        }

        .content-shell {
            width: 100%;
        }

        #content {
            width: 100%;
            padding: 30px 20px 70px;
        }

        .page-meta {
            margin-bottom: 22px;
        }

        .page-label {
            display: none;
        }

        .markdown-content {
            font-size: 15px;
        }

        .markdown-content h1 {
            font-size: 32px;
        }

        .markdown-content h2 {
            margin-top: 44px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        html {
            scroll-behavior: auto;
        }

        .sidebar,
        .item,
        .mobile-menu-button {
            transition: none;
        }

        .loading-line {
            animation: none;
        }
    }
</style>

</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar" aria-label="brand navigation">
    <div class="sidebar-header">
        <a class="brand" href="/brand/logos" data-page="logos">
            <img
                src="https://mcbcode.com/img/icons/default-transparent.png"
                alt="mcbCode logo"
            >

            <p class="brand-name">
                mcb<span>Code</span>
            </p>
        </a>

        <p class="brand-subtitle">
            media kit &amp; brand guidelines
        </p>
    </div>

    <nav class="nav">
        <div class="nav-group">
            <p class="nav-group-title">style</p>

            <button class="item" type="button" data-page="logos">
                logos
            </button>

            <button class="item" type="button" data-page="colors">
                colors
            </button>

            <button class="item" type="button" data-page="fonts">
                fonts
            </button>
        </div>

        <div class="nav-group">
            <p class="nav-group-title">screenshots</p>

            <button class="item" type="button" data-page="pages">
                pages
            </button>
        </div>
    </nav>

    <div class="sidebar-footer">
        <a href="https://mcbcode.com">
            mcbcode.com
        </a>
    </div>
</aside>

<div class="mobile-overlay" id="mobileOverlay"></div>

<main class="content-shell">
    <header class="mobile-header">
        <div class="mobile-title">
            <span>mcbCode</span>
            <span class="separator">/</span>
            <span id="mobilePageTitle">logos</span>
        </div>

        <button
            class="mobile-menu-button"
            id="mobileMenuButton"
            type="button"
            aria-label="open navigation"
            aria-controls="sidebar"
            aria-expanded="false"
        >
            <span class="hamburger">
                <span></span>
            </span>
        </button>
    </header>

    <div id="content"></div>
</main>

</div>

<script>
    const content = document.getElementById("content");
    const mobilePageTitle = document.getElementById("mobilePageTitle");
    const mobileMenuButton = document.getElementById("mobileMenuButton");
    const mobileOverlay = document.getElementById("mobileOverlay");

    const navItems = Array.from(document.querySelectorAll(".item"));
    const validPages = new Set(navItems.map(item => item.dataset.page));

    const markdownBaseUrl =
        "https://mcbcode.com/docs/md/brand/";

    let currentPage = null;

    /*
     * each navigation request gets its own number.
     * if an older fetch finishes after a newer one, it is ignored.
     *
     * this prevents:
     * click "colors"
     * click "fonts"
     * colors loads last
     * page suddenly showing colors while the url says fonts
     */
    let renderRequest = 0;

    function getPageLabel(page) {
        const item = navItems.find(
            navItem => navItem.dataset.page === page
        );

        return item ? item.textContent.trim() : page;
    }

    function getPageFromUrl() {
        const match = window.location.pathname.match(
            /^\/brand\/([^/]+)\/?$/i
        );

        if (!match) {
            return "logos";
        }

        let page;

        try {
            page = decodeURIComponent(match[1]).toLowerCase();
        } catch {
            return "logos";
        }

        return validPages.has(page) ? page : "logos";
    }

    function getPageUrl(page) {
        return "/brand/" + encodeURIComponent(page);
    }

    function setActivePage(page) {
        navItems.forEach(item => {
            const active = item.dataset.page === page;

            item.classList.toggle("active", active);

            if (active) {
                item.setAttribute("aria-current", "page");
            } else {
                item.removeAttribute("aria-current");
            }
        });

        mobilePageTitle.textContent = getPageLabel(page);

        document.title =
            getPageLabel(page) + " · mcbCode media kit";
    }

    function renderLoading() {
        content.innerHTML = `
            <div class="page-meta">
                <div class="page-context">
                    mcbCode / <strong>brand</strong>
                </div>

                <div class="page-label">
                    loading
                </div>
            </div>

            <div class="page-loading" aria-hidden="true">
                <div class="loading-line short"></div>
                <div class="loading-line"></div>
                <div class="loading-line medium"></div>
                <div class="loading-line"></div>
            </div>
        `;
    }

    function renderError(title, message) {
        content.innerHTML = `
            <div class="page-meta">
                <div class="page-context">
                    mcbCode / <strong>brand</strong>
                </div>

                <div class="page-label">
                    error
                </div>
            </div>

            <div class="page-error">
                <h1>${title}</h1>
                <p>${message}</p>
            </div>
        `;
    }

    async function showPage(page, options = {}) {
        const {
            historyMode = "none"
        } = options;

        if (!validPages.has(page)) {
            page = "logos";
        }

        /*
         * update history immediately.
         *
         * your old code waited for fetch() to finish before pushState().
         * that means network timing could determine the order of your
         * browser history. humanity invented asynchronous requests and
         * immediately regretted it.
         */
        if (historyMode === "push" && page !== currentPage) {
            history.pushState(
                { page },
                "",
                getPageUrl(page)
            );
        }

        if (historyMode === "replace") {
            history.replaceState(
                { page },
                "",
                getPageUrl(page)
            );
        }

        currentPage = page;
        setActivePage(page);
        closeMobileNav();
        renderLoading();

        const requestId = ++renderRequest;
        const url = markdownBaseUrl + encodeURIComponent(page) + ".md";

        try {
            const response = await fetch(url, {
                cache: "no-store"
            });

            if (requestId !== renderRequest) {
                return;
            }

            if (!response.ok) {
                if (page !== "logos") {
                    /*
                     * keep the old fallback behavior, but fix the url too.
                     */
                    currentPage = "logos";

                    history.replaceState(
                        { page: "logos" },
                        "",
                        getPageUrl("logos")
                    );

                    setActivePage("logos");

                    const fallbackResponse = await fetch(
                        markdownBaseUrl + "logos.md",
                        { cache: "no-store" }
                    );

                    if (!fallbackResponse.ok) {
                        renderError(
                            "couldn't load the page",
                            "the requested markdown file could not be loaded."
                        );
                        return;
                    }

                    const fallbackMarkdown =
                        await fallbackResponse.text();

                    if (requestId !== renderRequest) {
                        return;
                    }

                    content.innerHTML = `
                        <div class="page-meta">
                            <div class="page-context">
                                mcbCode / <strong>brand</strong>
                            </div>

                            <div class="page-label">
                                logos
                            </div>
                        </div>

                        <div class="markdown-content">
                            ${marked.parse(fallbackMarkdown)}
                        </div>
                    `;

                    window.scrollTo({
                        top: 0,
                        behavior: "auto"
                    });

                    return;
                }

                renderError(
                    "couldn't load the page",
                    "the markdown file could not be loaded."
                );

                return;
            }

            const markdownText = await response.text();

            if (requestId !== renderRequest) {
                return;
            }

            content.innerHTML = `
                <div class="page-meta">
                    <div class="page-context">
                        mcbCode / <strong>brand</strong>
                    </div>

                    <div class="page-label">
                        ${getPageLabel(page)}
                    </div>
                </div>

                <div class="markdown-content">
                    ${marked.parse(markdownText)}
                </div>
            `;

            window.scrollTo({
                top: 0,
                behavior: "auto"
            });

        } catch (error) {
            if (requestId !== renderRequest) {
                return;
            }

            renderError(
                "network error",
                "could not connect to the markdown source."
            );
        }
    }

    function openMobileNav() {
        document.body.classList.add("nav-open");

        mobileMenuButton.setAttribute(
            "aria-expanded",
            "true"
        );
    }

    function closeMobileNav() {
        document.body.classList.remove("nav-open");

        mobileMenuButton.setAttribute(
            "aria-expanded",
            "false"
        );
    }

    navItems.forEach(item => {
        item.addEventListener("click", () => {
            const page = item.dataset.page;

            if (page === currentPage) {
                closeMobileNav();
                return;
            }

            showPage(page, {
                historyMode: "push"
            });
        });
    });

    mobileMenuButton.addEventListener("click", () => {
        const open = document.body.classList.contains("nav-open");

        if (open) {
            closeMobileNav();
        } else {
            openMobileNav();
        }
    });

    mobileOverlay.addEventListener("click", closeMobileNav);

    document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
            closeMobileNav();
        }
    });

    window.addEventListener("popstate", () => {
        /*
         * always trust the actual url when going back/forward.
         * relying only on event.state can leave the ui stale when the
         * url was changed by another source.
         */
        showPage(getPageFromUrl(), {
            historyMode: "none"
        });
    });

    /*
     * normalize the initial url once.
     *
     * /brand
     * /brand/
     * /brand/anything-invalid
     *
     * all get a real page state instead of leaving the app with a null
     * history state and hoping for the best.
     */
    const initialPage = getPageFromUrl();

    showPage(initialPage, {
        historyMode: "replace"
    });
</script>

</body>
</html>
