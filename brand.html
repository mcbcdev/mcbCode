<!doctype html>
<html>
<head>
    <link rel="stylesheet" href="https://mcbcode.com/theme/site.css">
    <link rel="icon" href="https://mcbcode.com/theme/favicon.png">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            color: #bebebe;
        }

        body {
            display: flex;
        }

        .sidebar {
            width: 250px;
            border-right: 2px solid #bebebe;
            color: #bebebe;
            min-height: 100vh;
            flex-shrink: 0;
        }

        .item {
            padding: 6px;
            margin-left: 12px;
            margin-right: 12px;
            user-select: none;
            color: #ffffff;
        }

        .item:hover {
            background-color: #343434;
            cursor: pointer;
        }

        #group {
            font-size: 12px;
            margin-left: 3px;
            padding: 6px;
            line-height: 0em;
        }

        #content {
            padding: 30px;
            flex: 1;
        }

        /* You can customize the rendered markdown appearance here */
        .markdown-content h1 {
            font-size: 2.2em;
            margin-bottom: 0.5em;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .markdown-content h2 {
            font-size: 1.8em;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }

        .markdown-content p {
            line-height: 1.6;
            color: #444;
            margin-bottom: 1em;
        }

        .markdown-content a {
            color: #05ee93;
            text-decoration: none;
        }

        .markdown-content a:hover {
            text-decoration: underline;
        }

        .markdown-content code {
            background-color: #f5f5f5;
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

<div class="sidebar">

    <div style="display: flex; align-items: center; color: #ffffff; justify-content: center;">
        <img src="https://mcbcode.com/img/icons/default-transparent.png" style="height: 36px;">
        <p style="font-size: 18px; font-family: mcfontb;">
            mcb<span style="color: #05ee93;">Code</span>
        </p>
    </div>

    <p id="group">style</p>

    <div class="item" data-page="logos">logos</div>
    <div class="item" data-page="colors">colors</div>
    <div class="item" data-page="fonts">fonts</div>

    <br>

    <p id="group">screenshots</p>

    <div class="item" data-page="pages">pages</div>

</div>


<main id="content"></main>


<script>
const content = document.getElementById("content");

async function showPage(page, addToHistory = true) {
    let url = `https://mcbcode.com/docs/md/brand/${page}.md`;
    
    try {
        let response = await fetch(url);

        // Fallback to logos if the markdown file doesn't exist (404)
        if (!response.ok) {
            page = "logos";
            url = `https://mcbcode.com/docs/md/brand/${page}.md`;
            response = await fetch(url);
        }

        if (response.ok) {
            const markdownText = await response.text();
            // Parse markdown and wrap it in our custom styled div
            content.innerHTML = `<div class="markdown-content">${marked.parse(markdownText)}</div>`;
        } else {
            // Failsafe error display
            content.innerHTML = `<div class="markdown-content"><h1>Error</h1><p>Failed to load documentation.</p></div>`;
        }
    } catch (error) {
        content.innerHTML = `<div class="markdown-content"><h1>Network Error</h1><p>Could not connect to fetch markdown.</p></div>`;
    }

    if (addToHistory) {
        history.pushState(
            { page: page },
            "",
            "/brand/" + page
        );
    }
}


document.querySelectorAll(".item").forEach(item => {
    item.addEventListener("click", () => {
        showPage(item.dataset.page);
    });
});


function getPageFromURL() {
    const pathParts = window.location.pathname.split('/');
    const lastPart = pathParts.pop();
    
    if (!lastPart || lastPart === "brand" || lastPart.includes(".html")) {
        return "logos";
    }
    
    return lastPart;
}

window.addEventListener("popstate", event => {
    const page =
        event.state?.page ||
        getPageFromURL();

    showPage(page, false);
});


const initialPage = getPageFromURL();
showPage(initialPage, false);
</script>

</body>
</html>
