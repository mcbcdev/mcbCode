<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="https://mcbcode.com/theme/favicon.png">
  <link rel="stylesheet" href="https://mcbcode.com/theme/site.css">
  <title>mcbCode | Profile</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: #111214; color: #c8c8c8; font-family: 'mcfont', sans-serif; overflow-x: hidden; }
    a { text-decoration: none; color: #fff; transition: color 0.2s; }
    a:hover { color: #05ee93; }
    g { color: #05ee93; }

    /* ---- TOPNAV ---- */
    .topnav { position: fixed; top: 0; left: 0; right: 0; height: 48px; background: #161719; border-bottom: 1px solid #2a2a2e; display: flex; align-items: center; padding: 0 16px; z-index: 200; gap: 10px; }
    .topnav-logo { font-size: 18px; color: #fff; font-family: 'mcfontb', sans-serif; white-space: nowrap; }
    .topnav-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .nav-btn { background: #222326; border: 1px solid #343438; color: #aaa; font-family: 'mcfont', sans-serif; font-size: 12px; padding: 5px 10px; cursor: pointer; transition: color 0.2s, border-color 0.2s; white-space: nowrap; text-decoration: none; display: inline-block; }
    .nav-btn:hover { color: #05ee93; border-color: #05ee93; }

    /* ---- SEARCH ---- */
    .search-wrap { transition: all 0.3s ease; }

    /* centered state — normal flow (not fixed), so it scrolls away instead of floating over the grid */
    .search-wrap.centered {
      position: static;
      width: min(440px, calc(100vw - 32px));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .search-wrap.centered .search-logo { display: block; }
    .search-wrap.centered .search-input-row { width: 100%; }

    /* sticky-top state (scrolled past search) */
    .search-wrap.sticky-top {
      position: fixed;
      top: 48px;
      left: 0;
      right: 0;
      padding: 10px 16px;
      background: #161719;
      border-bottom: 1px solid #2a2a2e;
      z-index: 150;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .search-wrap.sticky-top .search-logo { display: none; }
    .search-wrap.sticky-top .search-input-row { width: 100%; max-width: 400px; }

    /* in-nav state (profile loaded, search in topnav) */
    .search-wrap.in-nav { position: static; transform: none; width: 200px; display: flex; flex-direction: column; gap: 0; }
    .search-wrap.in-nav .search-logo { display: none; }
    .search-wrap.in-nav .search-input-row { width: 100%; }

    .search-logo { display: none; font-size: 26px; color: #fff; font-family: 'mcfontb', sans-serif; text-align: center; }
    .search-logo g { color: #05ee93; }
    .search-logo small { display: block; font-size: 13px; color: #555; margin-top: 4px; font-family: 'mcfont', sans-serif; }

    .search-input-row { position: relative; }
    .search-input { width: 100%; background: #1a1c1f; border: 1px solid #343438; color: #fff; font-family: 'mcfont', sans-serif; font-size: 14px; padding: 10px 14px; outline: none; transition: border-color 0.2s; }
    .search-wrap.in-nav .search-input { font-size: 12px; padding: 6px 10px; }
    .search-wrap.sticky-top .search-input { font-size: 13px; padding: 7px 12px; }
    .search-input:focus { border-color: #00b2ff; }
    .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: #1a1c1f; border: 1px solid #343438; border-top: none; z-index: 300; display: none; }
    .autocomplete-list.open { display: block; }
    .ac-item { padding: 8px 14px; font-size: 13px; color: #aaa; cursor: pointer; transition: background 0.12s; }
    .search-wrap.in-nav .ac-item { padding: 6px 10px; font-size: 12px; }
    .ac-item:hover, .ac-item.selected { background: #222326; color: #fff; }

    /* ---- LANDING (before search) ---- */
    .landing { margin-top: 48px; min-height: calc(100vh - 48px); padding-top: 120px; padding-bottom: 80px; display: flex; flex-direction: column; align-items: center; }
    .landing.hidden { display: none; }

    /* all-profiles section — bigger cards, section capped to ~80% of viewport width */
    .recent-section { margin-top: 40px; width: min(1600px, 80vw); }
    .recent-label { font-size: 13px; color: #444; font-family: 'mcfontb', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 18px; text-align: center; }
    .recent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; max-height: 65vh; overflow-y: auto; padding-right: 4px; }
    .recent-card { background: #161719; border: 1px solid #1e1e22; padding: 22px 24px; cursor: pointer; transition: border-color 0.2s, background 0.2s; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
    .recent-card:hover { border-color: #343438; background: #1a1c1f; }
    .recent-avatar { width: 64px; height: 64px; background: #222326; border: 1px solid #343438; display: flex; align-items: center; justify-content: center; font-size: 26px; font-family: 'mcfontb', sans-serif; color: #555; flex-shrink: 0; overflow: hidden; }
    .recent-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .recent-name { font-size: 16px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .recent-rank-badge { font-size: 11px; padding: 3px 9px; width: fit-content; }
    .recent-loading, .recent-empty { font-size: 13px; color: #444; text-align: center; padding: 30px 0; grid-column: 1 / -1; }

    /* ---- PROFILE PAGE ---- */
    .page { margin-top: 48px; display: none; }
    .page.visible { display: flex; }

    /* sidebar */
    .profile-sidebar { width: 280px; min-width: 280px; border-right: 1px solid #2a2a2e; min-height: calc(100vh - 48px); padding: 32px 24px; display: flex; flex-direction: column; gap: 18px; background: #161719; flex-shrink: 0; }

    /* avatar */
    .profile-avatar-wrap { position: relative; width: 80px; }
    .profile-avatar { width: 80px; height: 80px; background: #1e1e22; border: 2px solid #343438; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #444; font-family: 'mcfontb', sans-serif; overflow: hidden; transition: border-color 0.2s; }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-hint { font-size: 10px; color: #444; margin-top: 4px; transition: color 0.2s; display: none; }

    /* clickable avatar (owner only) */
    .profile-avatar-wrap.clickable { cursor: pointer; }
    .profile-avatar-wrap.clickable:hover .profile-avatar { border-color: #00b2ff; }
    .profile-avatar-wrap.clickable:hover .avatar-hint { color: #00b2ff; }
    .profile-avatar-wrap.clickable .avatar-hint { display: block; }

    /* username + rank */
    .profile-username { font-size: 22px; color: #fff; font-family: 'mcfontb', sans-serif; line-height: 1.1; }
    .profile-joined { font-size: 11px; color: #444; margin-top: 2px; }
    .profile-rank { display: none; width: fit-content; padding: 4px 8px; font-size: 13px; font-family: 'mcfont', sans-serif; margin-top: 8px; }

    /* rank-specific username styling */
    .username-owner    { color: #05ee93; text-shadow: 0 0 20px #05ee9366; }
    .username-admin    { color: #00b2ff; text-shadow: 0 0 20px #00b2ff55; }
    .username-developer,
    .username-dev      { color: #ff9900; text-shadow: 0 0 20px #ff990044; }
    .username-obsidian { background: linear-gradient(90deg, #ff00d0, #9b18ed, #00b2ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; filter: drop-shadow(0 0 8px #ff00d066); }
    .username-verified { color: #9b18ed; text-shadow: 0 0 20px #9b18ed55; }

    .profile-bio { font-size: 13px; color: #888; line-height: 1.6; }
    .profile-bio-empty { font-size: 13px; color: #333; font-style: italic; }

    .edit-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .edit-btn { font-size: 11px; color: #444; cursor: pointer; transition: color 0.15s; background: none; border: none; font-family: 'mcfont', sans-serif; padding: 0; }
    .edit-btn:hover { color: #00b2ff; }

    .edit-area { display: none; flex-direction: column; gap: 6px; margin-top: 6px; }
    .edit-area.open { display: flex; }
    .edit-input { width: 100%; background: #111214; border: 1px solid #343438; color: #fff; font-family: 'mcfont', sans-serif; font-size: 13px; padding: 7px 10px; outline: none; transition: border-color 0.2s; }
    .edit-input:focus { border-color: #05ee93; }
    .edit-textarea { width: 100%; background: #111214; border: 1px solid #343438; color: #fff; font-family: 'mcfont', sans-serif; font-size: 13px; padding: 7px 10px; outline: none; resize: vertical; min-height: 72px; transition: border-color 0.2s; }
    .edit-textarea:focus { border-color: #05ee93; }
    .edit-save-row { display: flex; gap: 6px; align-items: center; }
    .sm-btn { background: #222326; border: 1px solid #343438; color: #aaa; font-family: 'mcfont', sans-serif; font-size: 11px; padding: 4px 10px; cursor: pointer; transition: color 0.15s, border-color 0.15s; }
    .sm-btn:hover { color: #05ee93; border-color: #05ee93; }
    .sm-btn.primary { background: #05ee93; border-color: #05ee93; color: #0c0c0c; }
    .sm-btn.primary:hover { background: #78e3a6; }
    .inline-msg { font-size: 11px; }
    .inline-msg.ok { color: #05ee93; }
    .inline-msg.err { color: #ff5555; }

    /* projects panel */
    .projects-panel { flex: 1; padding: 32px 36px; min-width: 0; }
    .projects-panel h2 { font-size: 15px; color: #00b2ff; font-family: 'mcfontb', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 20px; border-bottom: 1px solid #1e1e22; padding-bottom: 10px; }
    .project-grid { display: flex; flex-direction: column; gap: 10px; }
    .project-card { background: #161719; border: 1px solid #2a2a2e; padding: 16px 20px; cursor: pointer; transition: border-color 0.2s; }
    .project-card:hover { border-color: #05ee93; }
    .project-card-name { font-size: 15px; color: #fff; font-family: 'mcfontb', sans-serif; margin-bottom: 4px; }
    .project-card-desc { font-size: 12px; color: #555; line-height: 1.5; }
    .project-card-date { font-size: 11px; color: #333; margin-top: 10px; }
    .no-projects { font-size: 13px; color: #333; padding: 40px 0; }

    /* pfp modal */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 500; align-items: center; justify-content: center; }
    .overlay.open { display: flex; }
    .pfp-modal { background: #1a1c1f; border: 1px solid #343438; padding: 28px 32px; min-width: 320px; max-width: 440px; width: calc(100vw - 32px); }
    .pfp-modal h3 { color: #fff; font-size: 14px; margin-bottom: 4px; }
    .pfp-modal-sub { font-size: 11px; color: #444; margin-bottom: 20px; }
    .pfp-drop-zone { border: 2px dashed #343438; padding: 36px 20px; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
    .pfp-drop-zone:hover, .pfp-drop-zone.drag-over { border-color: #00b2ff; background: #1e2024; }
    .pfp-drop-zone input { display: none; }
    .pfp-drop-icon { font-size: 28px; color: #343438; margin-bottom: 8px; }
    .pfp-drop-text { font-size: 13px; color: #555; }
    .pfp-drop-text span { color: #00b2ff; }
    .pfp-preview-wrap { display: none; flex-direction: column; align-items: center; gap: 10px; }
    .pfp-preview-wrap.visible { display: flex; }
    .pfp-preview { width: 96px; height: 96px; object-fit: cover; border: 2px solid #343438; }
    .pfp-preview-name { font-size: 11px; color: #444; }
    .pfp-soon { font-size: 11px; color: #444; margin-top: 10px; text-align: center; display: none; }
    .pfp-modal-actions { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; }
    .cancel-btn { background: #222326; border: 1px solid #343438; color: #aaa; font-family: 'mcfont', sans-serif; font-size: 12px; padding: 5px 14px; cursor: pointer; }
    .cancel-btn:hover { color: #fff; }
    .soon-btn { background: #1a1c1f; border: 1px solid #343438; color: #444; font-family: 'mcfont', sans-serif; font-size: 12px; padding: 5px 14px; cursor: not-allowed; }

    .center-msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 13px; color: #444; }
    .center-msg.err { color: #ff5555; }

    /* ---- MOBILE ---- */
    @media (max-width: 640px) {
      .search-wrap.in-nav { width: 130px; }
      .search-wrap.in-nav .search-input { font-size: 11px; padding: 5px 8px; }
      .page.visible { flex-direction: column; }
      .profile-sidebar { width: 100%; min-width: unset; min-height: unset; border-right: none; border-bottom: 1px solid #2a2a2e; padding: 20px 16px; flex-direction: row; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
      .profile-avatar-wrap { width: 64px; }
      .profile-avatar { width: 64px; height: 64px; font-size: 24px; }
      .profile-sidebar-text { flex: 1; min-width: 150px; display: flex; flex-direction: column; gap: 4px; }
      .profile-username { font-size: 18px; }
      .profile-bio-section { width: 100%; }
      .projects-panel { padding: 16px; }
      .project-card { padding: 12px 14px; }

      /* all-profiles section on mobile */
      .landing { padding-top: 100px; }
      .recent-section { width: 100%; padding: 0 4px; }
      .recent-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); max-height: 65vh; gap: 10px; }
      .recent-card { padding: 16px 14px; }
      .recent-avatar { width: 48px; height: 48px; font-size: 20px; }
      .recent-name { font-size: 13px; }

      .pfp-modal { padding: 20px 16px; }
    }
  </style>
</head>
<body>

  <!-- pfp modal (ui preview only) -->
  <div class="overlay" id="pfp-overlay">
    <div class="pfp-modal">
      <h3>Profile Picture</h3>
      <div class="pfp-modal-sub">ui preview — profile pictures coming soon</div>
      <div class="pfp-drop-zone" id="pfp-drop-zone" onclick="document.getElementById('pfp-file-input').click()">
        <input type="file" id="pfp-file-input" accept="image/*">
        <div class="pfp-drop-icon">+</div>
        <div class="pfp-drop-text">click or <span>drag a file</span> here</div>
      </div>
      <div class="pfp-preview-wrap" id="pfp-preview-wrap">
        <img class="pfp-preview" id="pfp-preview" src="" alt="">
        <span class="pfp-preview-name" id="pfp-preview-name"></span>
      </div>
      <div class="pfp-soon" id="pfp-soon">looking good! saving is coming soon.</div>
      <div class="pfp-modal-actions">
        <button class="cancel-btn" onclick="closePfpModal()">Close</button>
<button class="sm-btn primary" id="pfp-save-btn" onclick="uploadPfp()" style="display:none;">
  Save
</button>
      </div>
    </div>
  </div>

  <!-- topnav -->
  <div class="topnav">
    <a href="/" class="topnav-logo">mcb<g>Code</g></a>
    <div id="nav-search-slot"></div>
    <div class="topnav-right">
      <a href="/dashboard" class="nav-btn">Dashboard</a>
    </div>
  </div>

  <!-- centered search + landing -->
  <div class="landing" id="landing">
    <div class="search-wrap centered" id="search-wrap">
      <div class="search-logo">mcb<g>Code</g><small>search for a user</small></div>
      <div class="search-input-row">
        <input class="search-input" id="search-input" type="text" placeholder="username..." autocomplete="off" maxlength="32">
        <div class="autocomplete-list" id="ac-list"></div>
      </div>
    </div>

    <div class="recent-section" id="recent-section">
      <div class="recent-label">All Profiles</div>
      <div class="recent-grid" id="recent-grid">
        <div class="recent-loading">loading...</div>
      </div>
    </div>
  </div>

  <!-- profile page -->
  <div class="page" id="profile-page">
    <div class="profile-sidebar">

      <div class="profile-avatar-wrap" id="avatar-wrap">
        <div class="profile-avatar" id="prof-avatar">?</div>
        <div class="avatar-hint">change photo</div>
      </div>

      <div class="profile-sidebar-text">
        <div class="profile-username" id="prof-username"></div>
        <div class="profile-joined" id="prof-joined"></div>
        <div class="profile-rank" id="prof-rank"></div>

        <div class="edit-row" id="username-edit-row" style="display:none;">
          <button class="edit-btn" id="edit-username-btn" onclick="toggleUsernameEdit()">edit username</button>
        </div>
        <div class="edit-area" id="username-edit-area">
          <input class="edit-input" type="text" id="username-input" maxlength="32" placeholder="new username">
          <div class="edit-save-row">
            <button class="sm-btn primary" onclick="saveUsername()">Save</button>
            <button class="sm-btn" onclick="toggleUsernameEdit()">Cancel</button>
            <span class="inline-msg" id="username-msg"></span>
          </div>
        </div>
      </div>

      <div class="profile-bio-section">
        <div class="profile-bio" id="prof-bio"></div>
        <div class="profile-bio-empty" id="prof-bio-empty" style="display:none;">no bio yet.</div>
        <div class="edit-row" id="bio-edit-row" style="display:none; margin-top:8px;">
          <button class="edit-btn" id="edit-bio-btn" onclick="toggleBioEdit()">edit bio</button>
        </div>
        <div class="edit-area" id="bio-edit-area">
          <textarea class="edit-textarea" id="bio-textarea" maxlength="256" placeholder="tell people about yourself..."></textarea>
          <div class="edit-save-row">
            <button class="sm-btn primary" onclick="saveBio()">Save</button>
            <button class="sm-btn" onclick="toggleBioEdit()">Cancel</button>
            <span class="inline-msg" id="bio-msg"></span>
          </div>
        </div>
      </div>

    </div>

    <div class="projects-panel">
      <h2>Owned by me</h2>
      <div class="project-grid" id="project-grid"></div>

      <h2 style="margin-top:40px;">Collaborating with</h2>
      <div class="project-grid" id="collab-grid"></div>
    </div>
  </div>

  <div class="center-msg" id="center-msg" style="display:none;"></div>

  <script>
    const AUTH = "https://auth.mcbcode.com";
    const params = new URLSearchParams(location.search);
    const targetUser = params.get("u") || "";
    let myUsername = null;
    let acDebounce = null;
    let acSelected = -1;
    let acResults  = [];
    let searchInLanding = true; // track if search is still in landing vs topnav
    let selectedPfpFile = null;

    function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
    function fmtDate(s) {
      if (!s) return "";
      const d = new Date(s.endsWith("Z") ? s : s + "Z");
      return d.toLocaleDateString(undefined, { year:"numeric", month:"long", day:"numeric" });
    }

    // rank → username css class
    function rankClass(rank) {
      if (!rank) return "";
      return "username-" + rank.toLowerCase().replace(/[^a-z]/g, "");
    }

    // rank badge bg from color
    function rankBg(color) {
      if (!color) return "rgba(136,136,136,.2)";
      return color.startsWith("#") && color.length === 7 ? color + "40" : "rgba(136,136,136,.2)";
    }

    // ---- INIT ----
    (async () => {
      try {
        const r = await fetch(`${AUTH}/me`, { credentials: "include" });
        if (r.ok) { const d = await r.json(); myUsername = d.username; }
      } catch {}

      if (targetUser) {
        // profile url — hide landing, load profile
        document.getElementById("landing").classList.add("hidden");
        await loadProfile(targetUser);
      } else {
        // landing — load all profiles
        loadRecentUsers();
        initScrollSticky();
      }
    })();

    // ---- ALL PROFILES ----
    async function loadRecentUsers() {
      const grid = document.getElementById("recent-grid");
      try {
        const r = await fetch(`${AUTH}/users/recent?limit=200`);
        if (!r.ok) { grid.innerHTML = `<div class="recent-empty">couldn't load profiles.</div>`; return; }
        const d = await r.json();
        if (!d.users.length) { grid.innerHTML = `<div class="recent-empty">no profiles yet.</div>`; return; }
        grid.innerHTML = d.users.map(u => {
          const cls = rankClass(u.rank);
          const badgeStyle = u.rank ? `style="background:${rankBg(u.rankColor)};color:${u.rankColor || '#888'}"` : "";
          const pfp = u.pfp_url || u.pfpUrl;
          const avatarInner = pfp
            ? `<img src="${esc(pfp)}" alt="">`
            : u.username[0].toUpperCase();
          return `
            <div class="recent-card" onclick="goToProfile('${esc(u.username)}')">
              <div class="recent-avatar" style="${!pfp && cls ? `color:${u.rankColor}` : ''}">${avatarInner}</div>
              <div class="recent-name ${cls}">${esc(u.username)}</div>
              ${u.rank ? `<div class="recent-rank-badge" ${badgeStyle}>${esc(u.rank.toLowerCase())}</div>` : ""}
            </div>
          `;
        }).join("");
      } catch { grid.innerHTML = `<div class="recent-empty">couldn't load profiles.</div>`; }
    }

    // ---- STICKY SEARCH ON SCROLL (landing only) ----
    function initScrollSticky() {
      const wrap = document.getElementById("search-wrap");
      let restingTop = null;

      const measure = () => {
        // only measure while it's still in normal flow (not already pinned)
        if (wrap.classList.contains("centered")) {
          restingTop = wrap.getBoundingClientRect().top + window.scrollY;
        }
      };
      measure();
      window.addEventListener("resize", measure, { passive: true });

      window.addEventListener("scroll", () => {
        if (!searchInLanding || restingTop === null) return;
        if (window.scrollY > restingTop - 58) {
          wrap.classList.remove("centered");
          wrap.classList.add("sticky-top");
        } else {
          wrap.classList.remove("sticky-top");
          wrap.classList.add("centered");
          measure();
        }
      }, { passive: true });
    }

    // ---- SEARCH ----
    const searchInput = document.getElementById("search-input");
    const acList      = document.getElementById("ac-list");
    if (targetUser) searchInput.value = targetUser;

    searchInput.addEventListener("input", () => {
      clearTimeout(acDebounce);
      const q = searchInput.value.trim();
      if (!q) { closeAc(); return; }
      acDebounce = setTimeout(() => fetchAc(q), 180);
    });

    searchInput.addEventListener("keydown", e => {
      if (e.key === "ArrowDown") { acSelected = Math.min(acSelected + 1, acResults.length - 1); renderAc(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { acSelected = Math.max(acSelected - 1, 0); renderAc(); e.preventDefault(); }
      else if (e.key === "Enter") { const val = acSelected >= 0 ? acResults[acSelected] : searchInput.value.trim(); if (val) goToProfile(val); }
      else if (e.key === "Escape") closeAc();
    });

    async function fetchAc(q) {
      try {
        const r = await fetch(`${AUTH}/profile/search?q=${encodeURIComponent(q)}`);
        if (!r.ok) return;
        const d = await r.json();
        acResults = d.results || []; acSelected = -1; renderAc();
      } catch {}
    }

    function renderAc() {
      if (!acResults.length) { closeAc(); return; }
      acList.innerHTML = acResults.map((u, i) => `<div class="ac-item${i === acSelected ? ' selected' : ''}" onclick="goToProfile('${esc(u)}')">${esc(u)}</div>`).join("");
      acList.classList.add("open");
    }

    function closeAc() { acList.classList.remove("open"); acList.innerHTML = ""; acResults = []; acSelected = -1; }
    function goToProfile(u) { window.location.href = `/profile?u=${encodeURIComponent(u)}`; }

    // ---- LOAD PROFILE ----
    async function loadProfile(username) {
      const msg = document.getElementById("center-msg");
      msg.textContent = "Loading..."; msg.style.display = ""; msg.className = "center-msg";
      try {
        const r = await fetch(`${AUTH}/profile?u=${encodeURIComponent(username)}`);
        if (!r.ok) { const d = await r.json(); msg.textContent = d.error || "User not found."; msg.className = "center-msg err"; return; }
        const d = await r.json();
        msg.style.display = "none";
        renderProfile(d);
      } catch { msg.textContent = "Failed to load profile."; msg.className = "center-msg err"; }
    }

function renderProfile(data) {
  const {
    user,
    projects,
    collaborating = []
  } = data;

  // move search to topnav
  searchInLanding = false;
  const wrap = document.getElementById("search-wrap");
  wrap.classList.remove("centered", "sticky-top");
  wrap.classList.add("in-nav");
  document.getElementById("nav-search-slot").appendChild(wrap);

  // avatar
  const avatarEl = document.getElementById("prof-avatar");

  if (user.pfp_url) {
    avatarEl.innerHTML = `
      <img
        src="${user.pfp_url}?t=${Date.now()}"
        alt="Profile Picture"
      >
    `;
  } else {
    avatarEl.textContent = user.username[0].toUpperCase();
  }

  // username with rank styling
  const unEl = document.getElementById("prof-username");
  unEl.textContent = user.username;
  if (user.rank) unEl.classList.add(rankClass(user.rank));

  document.getElementById("prof-joined").textContent = "joined " + fmtDate(user.joined);
  document.title = `mcbCode | ${user.username}`;

  // rank badge
  const rankEl = document.getElementById("prof-rank");
  if (user.rank) {
    rankEl.textContent = user.rank.toLowerCase();
    rankEl.style.color = user.rankColor || "#888";
    rankEl.style.backgroundColor = rankBg(user.rankColor);
    rankEl.style.display = "block";
  } else {
    rankEl.style.display = "none";
  }

  // bio
  if (user.bio) {
    document.getElementById("prof-bio").textContent = user.bio;
    document.getElementById("prof-bio").style.display = "";
    document.getElementById("prof-bio-empty").style.display = "none";
  } else {
    document.getElementById("prof-bio").style.display = "none";
    document.getElementById("prof-bio-empty").style.display = "";
  }

  const isMe = myUsername && myUsername === user.username;

  if (isMe) {
    // avatar clickable only for owner
    const avatarWrap = document.getElementById("avatar-wrap");
    avatarWrap.classList.add("clickable");
    avatarWrap.onclick = openPfpModal;

    // username edit
    document.getElementById("username-edit-row").style.display = "";
    document.getElementById("username-input").value = user.username;

    // bio edit
    document.getElementById("bio-edit-row").style.display = "";
    document.getElementById("bio-textarea").value = user.bio || "";
  }

  // owned projects
  const grid = document.getElementById("project-grid");

  if (!projects.length) {
    grid.innerHTML = `<div class="no-projects">no public projects yet.</div>`;
  } else {
    grid.innerHTML = projects.map(p => `
      <div class="project-card" onclick="window.location.href='/project/${esc(p.share_code)}/'">
        <div class="project-card-name">${esc(p.name)}</div>
        ${p.description ? `<div class="project-card-desc">${esc(p.description)}</div>` : ""}
        <div class="project-card-date">updated ${fmtDate(p.updated_at)}</div>
      </div>
    `).join("");
  }

  // collaborated projects
  const collabGrid = document.getElementById("collab-grid");

  if (!collaborating.length) {
    collabGrid.innerHTML = `<div class="no-projects">not collaborating on any public projects.</div>`;
  } else {
    collabGrid.innerHTML = collaborating.map(p => `
      <div class="project-card" onclick="window.location.href='/project/${esc(p.share_code)}/'">
        <div class="project-card-name">${esc(p.name)}</div>
        ${p.description ? `<div class="project-card-desc">${esc(p.description)}</div>` : ""}
        <div class="project-card-date">
          owner: ${esc(p.owner)} • updated ${fmtDate(p.updated_at)}
        </div>
      </div>
    `).join("");
  }

  document.getElementById("profile-page").classList.add("visible");
}

    // ---- USERNAME EDIT ----
    function toggleUsernameEdit() {
      const area = document.getElementById("username-edit-area");
      const isOpen = area.classList.toggle("open");
      document.getElementById("edit-username-btn").textContent = isOpen ? "cancel" : "edit username";
      if (isOpen) setTimeout(() => document.getElementById("username-input").focus(), 50);
    }

    async function saveUsername() {
      const val = document.getElementById("username-input").value.trim().replace(/[^a-zA-Z0-9_\-]/g, "");
      const msg = document.getElementById("username-msg");
      if (!val || val.length < 2) { msg.textContent = "too short."; msg.className = "inline-msg err"; return; }
      try {
        const res = await fetch(`${AUTH}/profile`, {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: val })
        });
        const d = await res.json();
        if (res.ok) {
          msg.textContent = "saved!"; msg.className = "inline-msg ok";
          const unEl = document.getElementById("prof-username");
          unEl.textContent = val;
          myUsername = val;
          setTimeout(() => { toggleUsernameEdit(); window.history.replaceState({}, "", `/profile?u=${encodeURIComponent(val)}`); }, 800);
        } else { msg.textContent = d.error || "failed."; msg.className = "inline-msg err"; }
      } catch { msg.textContent = "error."; msg.className = "inline-msg err"; }
      setTimeout(() => { msg.textContent = ""; msg.className = "inline-msg"; }, 3000);
    }

    // ---- BIO EDIT ----
    function toggleBioEdit() {
      const area = document.getElementById("bio-edit-area");
      const isOpen = area.classList.toggle("open");
      document.getElementById("edit-bio-btn").textContent = isOpen ? "cancel" : "edit bio";
    }

    async function saveBio() {
      const bio = document.getElementById("bio-textarea").value.trim();
      const msg = document.getElementById("bio-msg");
      try {
        const res = await fetch(`${AUTH}/profile/bio`, {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ bio })
        });
        if (res.ok) {
          const bioEl = document.getElementById("prof-bio");
          bioEl.textContent = bio; bioEl.style.display = bio ? "" : "none";
          document.getElementById("prof-bio-empty").style.display = bio ? "none" : "";
          msg.textContent = "saved!"; msg.className = "inline-msg ok";
          setTimeout(() => toggleBioEdit(), 800);
        } else { msg.textContent = "failed."; msg.className = "inline-msg err"; }
      } catch { msg.textContent = "error."; msg.className = "inline-msg err"; }
      setTimeout(() => { msg.textContent = ""; msg.className = "inline-msg"; }, 3000);
    }

    // ---- PFP MODAL ----
    function openPfpModal() {
      document.getElementById("pfp-overlay").classList.add("open");
    }
    function closePfpModal() {
      document.getElementById("pfp-overlay").classList.remove("open");
      document.getElementById("pfp-drop-zone").style.display = "";
      document.getElementById("pfp-preview-wrap").classList.remove("visible");
      document.getElementById("pfp-soon").style.display = "none";
      document.getElementById("pfp-file-input").value = "";
    }

    const dropZone = document.getElementById("pfp-drop-zone");
    const fileInput = document.getElementById("pfp-file-input");
    fileInput.addEventListener("change", e => { if (e.target.files[0]) handlePfpFile(e.target.files[0]); });
    dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("drag-over"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
    dropZone.addEventListener("drop", e => {
      e.preventDefault(); dropZone.classList.remove("drag-over");
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith("image/")) handlePfpFile(file);
    });
function handlePfpFile(file) {
  selectedPfpFile = file;

  const reader = new FileReader();
  reader.onload = e => {
    dropZone.style.display = "none";

    document.getElementById("pfp-preview-wrap").classList.add("visible");
    document.getElementById("pfp-preview").src = e.target.result;
    document.getElementById("pfp-preview-name").textContent = file.name;

    document.getElementById("pfp-save-btn").style.display = "";
  };

  reader.readAsDataURL(file);
}

async function uploadPfp() {
  if (!selectedPfpFile) return;

  const btn = document.getElementById("pfp-save-btn");

  try {
    btn.disabled = true;
    btn.textContent = "Uploading...";

    const res = await fetch(`${AUTH}/pfp`, {
      method: "POST",
      credentials: "include",
      headers: {
        "Content-Type": selectedPfpFile.type
      },
      body: selectedPfpFile
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || "Upload failed");
    }

    const avatar = document.getElementById("prof-avatar");

    avatar.innerHTML = `
      <img
        src="${data.pfp_url}?t=${Date.now()}"
        alt="Profile Picture"
      >
    `;

    closePfpModal();

  } catch (err) {
    alert(err.message || "Failed to upload image");
  } finally {
    btn.disabled = false;
    btn.textContent = "Save";
  }
}

    document.getElementById("pfp-overlay").addEventListener("click", e => { if (e.target === e.currentTarget) closePfpModal(); });
    document.addEventListener("click", e => { if (!e.target.closest(".search-input-row")) closeAc(); });
  </script>
