<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="https://mcbcode.com/theme/favicon.png">
  <link rel="stylesheet" href="https://mcbcode.com/theme/site.css">
  <link rel="stylesheet" href="https://mcbcode.com/theme/ranks.css">
  <title>mcbCode | Dashboard</title>
  <style>
    :root {
      --bg: #0c0c0c;
      --bg-soft: #111214;
      --panel: #141414;
      --panel-alt: #161719;
      --border: #232323;
      --border-alt: #2a2a2e;
      --text: #c8c8c8;
      --dim: #888;
      --dimmer: #666;
      --faint: #444;
      --white: #fff;
      --green: #05ee93;
      --green-soft: rgba(5, 238, 147, 0.1);
      --pink: #ff00d0;
      --purple: #dc6bff;
      --blue: #00b2ff;
      --red: #ff5555;

      /* border radius scale: small = buttons/inputs/tabs, medium = cards/panels, large = big containers/modal */
      --r-sm: 6px;
      --r-md: 12px;
      --r-lg: 18px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: 'mcfont', sans-serif; }
    a { text-decoration: none; color: var(--white); transition: color .15s; }
    a:hover { color: var(--green); }
    button { font-family: 'mcfont', sans-serif; cursor: pointer; }
    g { color: var(--green); }

    /* ---- topnav ---- */
    .topnav {
      position: fixed; top: 0; left: 0; right: 0; height: 56px;
      background: rgba(20, 20, 20, .85); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-alt);
      display: flex; align-items: center; padding: 0 20px; gap: 16px; z-index: 200;
    }
    .topnav-title { font-size: 20px; color: var(--white); font-family: 'mcfontb', sans-serif; white-space: nowrap; }
    .topnav-search {
      flex: 1; max-width: 360px; display: flex; align-items: center;
      background: #1a1c1f; border: 1px solid var(--border-alt); padding: 7px 12px;
      border-radius: var(--r-sm);
      transition: border-color .15s;
    }
    .topnav-search:focus-within { border-color: var(--green); }
    .topnav-search input { flex: 1; background: none; border: none; outline: none; color: var(--white); font-family: 'mcfont', sans-serif; font-size: 13px; }
    .topnav-search input::placeholder { color: var(--faint); }
    .topnav-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .logout-btn { font-size: 11px; padding: 7px 10px; color: var(--dim); background: #1e1e1e; border: 1px solid var(--border-alt); border-radius: var(--r-sm); }
    .logout-btn:hover { color: var(--red); border-color: var(--red); }
    .icon-btn {
      width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
      background: #1e1e1e; border: 1px solid var(--border-alt); color: var(--dim);
      border-radius: var(--r-sm);
      font-size: 15px; position: relative; transition: color .15s, border-color .15s;
    }
    .icon-btn:hover { color: var(--green); border-color: var(--green); }
    .icon-btn .dot {
      position: absolute; top: -5px; right: -5px; min-width: 16px; height: 16px; padding: 0 4px;
      background: var(--pink); color: #111; font-size: 9px; font-family: 'mcfontb', sans-serif;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center; display: none;
    }
    .icon-btn .dot.visible { display: flex; }
    .avatar-link { width: 34px; height: 34px; border: 1px solid var(--border-alt); overflow: hidden; background: #222326; display: flex; align-items: center; justify-content: center; font-family: 'mcfontb', sans-serif; color: var(--dim); font-size: 13px; border-radius: var(--r-sm); }
    .avatar-link img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-link:hover { border-color: var(--green); }

    /* ---- page shell ---- */
    .shell { margin-top: 56px; padding: 28px 20px 80px; max-width: 1180px; margin-left: auto; margin-right: auto; }

    .signed-out {
      text-align: center; padding: 100px 20px; color: var(--faint); font-size: 13px;
    }
    .signed-out strong { display: block; color: var(--dim); font-size: 17px; margin-bottom: 10px; font-family: 'mcfontb', sans-serif; }
    .signed-out a { color: var(--blue); }

    /* ---- hero ---- */
    .hero {
      display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .hero-welcome { font-size: 22px; color: var(--white); font-family: 'mcfontb', sans-serif; }
    .hero-welcome span { color: var(--green); }
    .hero-sub { font-size: 12px; color: var(--dimmer); margin-top: 6px; }
    .hero-actions { display: flex; gap: 10px; }
    .btn {
      font-size: 13px; padding: 9px 16px; border: 1px solid var(--border-alt); background: #1e1e1e;
      color: var(--dim); border-radius: var(--r-sm);
      transition: color .15s, border-color .15s, background .15s;
    }
    .btn:hover { color: var(--green); border-color: var(--green); }
    .btn-primary { background: var(--green); border-color: var(--green); color: #0c0c0c; font-family: 'mcfont', sans-serif; }
    .btn-primary:hover { background: #78e3a6; color: #0c0c0c; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ---- main grid ---- */
    .grid {
      display: grid; grid-template-columns: 260px 1fr; gap: 22px; align-items: start;
    }

    /* ---- aside / quick links ---- */
    .aside { display: flex; flex-direction: column; gap: 18px; position: sticky; top: 76px; }
    .panel { background: var(--panel-alt); border: 1px solid var(--border-alt); padding: 16px; border-radius: var(--r-md); }
    .panel-title { font-size: 11px; color: var(--dimmer); letter-spacing: .06em; font-family: 'mcfontb', sans-serif; margin-bottom: 10px; }
    .link-list { display: flex; flex-direction: column; gap: 2px; }
    .link-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 8px; font-size: 13px; color: var(--dim);
      border-radius: var(--r-sm);
      transition: background .12s, color .12s;
    }
    .link-item .li-icon { width: 18px; text-align: center; font-size: 13px; color: var(--dimmer); }
    .link-item:hover { color: var(--green); background: #1e2024; }
    .link-item:hover .li-icon { color: var(--green); }

    /* ---- points card ---- */
    .points-card {
      background: var(--panel); border: 2px dashed var(--border-alt); padding: 18px 20px;
      border-radius: var(--r-lg);
      transform: rotate(-.4deg); display: flex; flex-direction: column; gap: 10px;
    }
    .points-num { font-size: 32px; color: var(--purple); font-family: 'mcfontb', sans-serif; line-height: 1; }
    .points-lbl { font-size: 11px; color: var(--dimmer); letter-spacing: .06em; margin-top: 4px; }
    .points-btns { display: flex; gap: 8px; margin-top: 6px; }
    .points-btns .btn { flex: 1; text-align: center; font-size: 12px; padding: 8px 0; }
    .obsidian-tag { font-size: 10px; color: var(--purple); border: 1px solid #3a2a4a; padding: 3px 8px; align-self: flex-start; border-radius: var(--r-sm); }

    /* ---- section heading ---- */
    .section { margin-bottom: 32px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
    .section-title { font-size: 16px; color: var(--white); font-family: 'mcfontb', sans-serif; }
    .section-link { font-size: 12px; color: var(--blue); }

    /* ---- project tabs ---- */
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .tab {
      font-size: 12px; padding: 7px 14px; background: #1a1a1a; border: 1px solid var(--border);
      color: var(--dim); border-radius: var(--r-sm); cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .tab.active { color: var(--green); border-color: var(--green); background: var(--green-soft); }

    .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
    .project-card {
      background: var(--panel-alt); border: 1px solid var(--border-alt); padding: 16px;
      border-radius: var(--r-md);
      display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: border-color .15s;
    }
    .project-card:hover { border-color: var(--green); }
    .project-name { font-size: 14px; color: var(--white); font-family: 'mcfontb', sans-serif; }
    .project-desc { font-size: 12px; color: var(--dimmer); line-height: 1.5; min-height: 18px; }
    .project-meta { font-size: 11px; color: var(--faint); display: flex; justify-content: space-between; margin-top: auto; }
    .project-owner { color: var(--blue); }
    .project-actions { display: flex; justify-content: flex-end; margin-top: 4px; }
    .leave-btn { font-size: 11px; padding: 5px 8px; color: var(--dim); background: #1e1e1e; border: 1px solid var(--border); border-radius: var(--r-sm); }
    .leave-btn:hover { color: var(--red); border-color: var(--red); }
    .leave-btn:disabled { opacity: .5; cursor: not-allowed; }

    .empty-note, .loading-note, .error-note {
      font-size: 12px; color: var(--faint); padding: 18px; border: 1px dashed var(--border); text-align: center;
      border-radius: var(--r-md);
    }
    .error-note { color: var(--red); border-color: #3a1a1a; }

    /* ---- feed ---- */
    .feed-list { display: flex; flex-direction: column; gap: 2px; }
    .feed-item {
      display: flex; gap: 12px; padding: 12px 14px; background: var(--panel-alt); border: 1px solid var(--border-alt);
      border-radius: var(--r-md);
      margin-bottom: 6px; transition: border-color .15s;
    }
    .feed-item:hover { border-color: var(--green); }
    .feed-icon {
      width: 30px; height: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      background: #1e1e1e; border: 1px solid var(--border); font-size: 13px; color: var(--dim);
      border-radius: var(--r-sm);
    }
    .feed-body { flex: 1; min-width: 0; }
    .feed-title { font-size: 13px; color: var(--text); line-height: 1.4; }
    .feed-title b { color: var(--white); font-family: 'mcfontb', sans-serif; font-weight: normal; }
    .feed-desc { font-size: 12px; color: var(--dimmer); margin-top: 3px; line-height: 1.4; }
    .feed-time { font-size: 10px; color: var(--faint); margin-top: 6px; }

    /* ---- editors panel ---- */
    .editor-note { font-size: 11px; color: var(--faint); line-height: 1.5; margin-top: 8px; }

    /* ---- new project modal ---- */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 500; display: none;
      align-items: center; justify-content: center; padding: 20px;
      background: rgba(0, 0, 0, .65); backdrop-filter: blur(6px);
    }
    .modal-overlay.open { display: flex; animation: fadeIn .15s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }

    .modal {
      width: 100%; max-width: 480px; max-height: calc(100vh - 40px); overflow-y: auto;
      background: var(--panel-alt); border: 1px solid var(--border-alt); border-radius: var(--r-lg);
      padding: 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
      animation: popIn .18s ease;
    }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .modal-title { font-size: 20px; color: var(--white); font-family: 'mcfontb', sans-serif; }
    .modal-sub { font-size: 12px; color: var(--dimmer); margin-top: 5px; }
    .modal-close {
      width: 30px; height: 30px; flex-shrink: 0; background: #1e1e1e; border: 1px solid var(--border-alt);
      color: var(--dim); font-size: 14px; border-radius: var(--r-sm);
      transition: color .15s, border-color .15s;
    }
    .modal-close:hover { color: var(--red); border-color: var(--red); }

    .field { margin-bottom: 16px; }
    .field-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--dimmer); letter-spacing: .06em; font-family: 'mcfontb', sans-serif; margin-bottom: 7px; }
    .field-label span { color: var(--faint); font-family: 'mcfont', sans-serif; letter-spacing: 0; }
    .field-hint { font-size: 11px; color: var(--faint); line-height: 1.45; margin-top: 6px; }
    .input, .textarea {
      width: 100%; background: #1a1c1f; border: 1px solid var(--border-alt); color: var(--white);
      font-family: 'mcfont', sans-serif; font-size: 13px; padding: 10px 12px; outline: none;
      border-radius: var(--r-sm); transition: border-color .15s;
    }
    .textarea { resize: vertical; min-height: 70px; max-height: 160px; line-height: 1.5; }
    .input:focus, .textarea:focus { border-color: var(--green); }
    .input::placeholder, .textarea::placeholder { color: var(--faint); }

    .start-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .start-opt {
      text-align: left; background: #1a1c1f; border: 1px solid var(--border-alt); color: var(--dim);
      padding: 14px; border-radius: var(--r-md); display: flex; flex-direction: column; gap: 5px;
      transition: border-color .15s, background .15s, color .15s;
    }
    .start-opt:hover { border-color: var(--dimmer); }
    .start-opt.active { border-color: var(--green); background: var(--green-soft); }
    .start-opt-title { font-size: 13px; color: var(--white); font-family: 'mcfontb', sans-serif; }
    .start-opt.active .start-opt-title { color: var(--green); }
    .start-opt-desc { font-size: 11px; color: var(--dimmer); line-height: 1.45; }

    .dropzone {
      margin-top: 12px; border: 2px dashed var(--border-alt); border-radius: var(--r-md);
      padding: 20px 14px; text-align: center; cursor: pointer; background: #131416;
      transition: border-color .15s, background .15s;
    }
    .dropzone:hover, .dropzone.drag { border-color: var(--green); background: var(--green-soft); }
    .dropzone.has-file { border-style: solid; border-color: var(--green); }
    .dz-main { font-size: 13px; color: var(--text); }
    .dz-main b { color: var(--green); font-family: 'mcfontb', sans-serif; font-weight: normal; }
    .dz-sub { font-size: 11px; color: var(--faint); margin-top: 6px; }
    .dz-file { font-size: 13px; color: var(--white); word-break: break-all; }
    .dz-clear { margin-top: 8px; font-size: 11px; padding: 4px 9px; background: #1e1e1e; border: 1px solid var(--border-alt); color: var(--dim); border-radius: var(--r-sm); }
    .dz-clear:hover { color: var(--red); border-color: var(--red); }
    .hidden { display: none !important; }

    .progress-wrap { margin-top: 14px; }
    .progress-bar { height: 8px; background: #1a1c1f; border-radius: 4px; overflow: hidden; border: 1px solid var(--border-alt); }
    .progress-fill { height: 100%; width: 0%; background: var(--green); transition: width .15s; }
    .progress-text { font-size: 11px; color: var(--dimmer); margin-top: 6px; word-break: break-all; }

    .modal-msg { font-size: 12px; margin-top: 14px; padding: 10px 12px; border-radius: var(--r-sm); line-height: 1.5; }
    .modal-msg.error { color: var(--red); background: rgba(255, 85, 85, .08); border: 1px solid #3a1a1a; }
    .modal-msg.warn { color: #ffcc55; background: rgba(255, 204, 85, .08); border: 1px solid #4a3a1a; }
    .modal-msg a { color: var(--blue); }

    .modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }

    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
      .aside { position: static; order: 2; }
      .aside-links { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 4px; }
      .aside-links .link-item { flex: 0 0 auto; background: var(--panel-alt); border: 1px solid var(--border-alt); }
      .main-col { order: 1; }
      .topnav-search { display: none; }
      .hero { flex-direction: column; align-items: flex-start; }
    }
    @media (max-width: 480px) {
      .start-options { grid-template-columns: 1fr; }
      .modal { padding: 18px; }
    }
  </style>
</head>
<body>

  <div class="topnav">
    <a href="/" class="topnav-title">mcb<g>Code</g></a>
    <div class="topnav-search">
      <input id="topnav-search-input" type="text" placeholder="search mcbcode..." autocomplete="off" maxlength="64">
    </div>
    <div class="topnav-right">
      <a class="icon-btn" href="/notifications" title="notifications">
        <img src="https://mcbcode.com/img/icons/bell.png"><span class="dot" id="notif-dot"></span>
      </a>
      <button class="logout-btn" id="logout-btn" type="button">log out</button>
      <a class="avatar-link" id="topnav-avatar" href="/account">?</a>
    </div>
  </div>

  <div class="shell" id="shell">
    <div class="loading-note" style="margin-top:60px;">loading your dashboard...</div>
  </div>

  <!-- new project modal (lives outside #shell so renderShell doesn't wipe it) -->
  <div class="modal-overlay" id="np-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="np-title">
      <div class="modal-head">
        <div>
          <div class="modal-title" id="np-title">new project</div>
          <div class="modal-sub">name it, then start fresh or bring in an existing pack.</div>
        </div>
        <button class="modal-close" id="np-close" type="button" title="close">x</button>
      </div>

      <div class="field">
        <label class="field-label" for="np-type">PROJECT TYPE</label>
        <select class="input" id="np-type">
          <option value="addon">addon (bp + rp)</option>
          <option value="texture_pack">texture pack (rp only)</option>
          <option value="skinpack">skinpack (rp only)</option>
          <option value="script">script (bp only)</option>
        </select>
        <div class="field-hint" id="np-type-hint">starts with behavior and resource pack folders.</div>
      </div>

      <div class="field">
        <div class="field-label">NAME <span id="np-name-count">0/72</span></div>
        <input class="input" id="np-name" type="text" maxlength="72" placeholder="my awesome addon" autocomplete="off">
      </div>

      <div class="field">
        <div class="field-label">DESCRIPTION <span id="np-desc-count">0/256</span></div>
        <textarea class="textarea" id="np-desc" maxlength="256" placeholder="what is this project about? (optional)"></textarea>
      </div>

      <div class="field" style="margin-bottom:0;">
        <div class="field-label">START FROM</div>
        <div class="start-options">
          <button type="button" class="start-opt active" id="np-opt-scratch" data-mode="scratch">
            <span class="start-opt-title">scratch</span>
            <span class="start-opt-desc">empty BP and RP folders with manifests already set up.</span>
          </button>
          <button type="button" class="start-opt" id="np-opt-upload" data-mode="upload">
            <span class="start-opt-title">upload a pack</span>
            <span class="start-opt-desc">import a .mcpack or .mcaddon and edit it here.</span>
          </button>
        </div>

        <div class="dropzone hidden" id="np-drop">
          <div id="np-drop-empty">
            <div class="dz-main">drop a file here or <b>browse</b></div>
            <div class="dz-sub" id="np-drop-limit">.mcpack or .mcaddon, up to 10MB</div>
          </div>
          <div id="np-drop-file" class="hidden">
            <div class="dz-file" id="np-file-name"></div>
            <div class="dz-sub" id="np-file-size"></div>
            <button type="button" class="dz-clear" id="np-file-clear">remove</button>
          </div>
        </div>
        <input type="file" id="np-file" accept=".mcpack,.mcaddon,.zip" class="hidden">
      </div>

      <div class="progress-wrap hidden" id="np-progress">
        <div class="progress-bar"><div class="progress-fill" id="np-progress-fill"></div></div>
        <div class="progress-text" id="np-progress-text">starting...</div>
      </div>

      <div class="modal-msg error hidden" id="np-error"></div>
      <div class="modal-msg warn hidden" id="np-warn"></div>

      <div class="modal-foot">
        <button class="btn" id="np-cancel" type="button">cancel</button>
        <button class="btn btn-primary" id="np-create" type="button">create project</button>
      </div>
    </div>
  </div>

  <script>
    const AUTH = "https://auth.mcbcode.com";
    let me = null;

    function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
    function fmtDate(s) {
      if (!s) return "";
      const d = new Date(s.endsWith("Z") ? s : s + "Z");
      return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }
    function timeAgo(s) {
      if (!s) return "";
      const d = new Date(s.endsWith("Z") ? s : s + "Z");
      const diff = Math.max(0, (Date.now() - d.getTime()) / 1000);
      if (diff < 60) return "just now";
      if (diff < 3600) return Math.floor(diff / 60) + "m ago";
      if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
      if (diff < 604800) return Math.floor(diff / 86400) + "d ago";
      return fmtDate(s);
    }
    function fmtSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    const FEED_ICONS = { Activity: "◍", Projects: "▤", Comments: "✉", System: "✦", GitHub: "⌥", Achievements: "★" };

    document.getElementById("topnav-search-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && e.target.value.trim()) {
        location.href = `/search?q=${encodeURIComponent(e.target.value.trim())}`;
      }
    });

    document.getElementById("logout-btn").addEventListener("click", logout);

    (async () => {
      try {
        const r = await fetch(`${AUTH}/me`, { credentials: "include" });
        if (!r.ok) { renderSignedOut(); return; }
        me = await r.json();
        renderShell();
        loadProjects();
        loadFeed();
      } catch {
        document.getElementById("shell").innerHTML = `<div class="error-note" style="margin-top:60px;">couldn't reach mcbcode. check your connection and reload.</div>`;
      }
    })();

    function renderSignedOut() {
      document.getElementById("shell").innerHTML = `
        <div class="signed-out">
          <strong>you're not signed in</strong>
          <a href="/account">log in</a> to see your dashboard.
        </div>`;
    }

    function renderShell() {
      const avatarEl = document.getElementById("topnav-avatar");
      avatarEl.href = `/profile/${encodeURIComponent(me.username)}`;
      avatarEl.innerHTML = me.pfp_url ? `<img src="${esc(me.pfp_url)}" alt="">` : esc((me.username || "?")[0].toUpperCase());

      document.getElementById("shell").innerHTML = `
        <div class="hero">
          <div>
            <div class="hero-welcome">welcome back, <span>${esc(me.username || "friend")}</span></div>
            <div class="hero-sub">here's what's going on across mcbcode</div>
          </div>
          <div class="hero-actions">
            <button class="btn" id="import-btn" onclick="location.href='/explore'">explore</button>
            <button class="btn btn-primary" id="new-project-btn">+ new project</button>
          </div>
        </div>

        <div class="grid">
          <div class="aside">
            <div class="points-card">
              <div>
                <div class="points-num">${(me.points || 0).toLocaleString()}</div>
                <div class="points-lbl">your points</div>
              </div>
              ${me.is_obsidian ? `<div class="obsidian-tag">obsidian member</div>` : ""}
              <div class="points-btns">
                <a class="btn btn-primary" href="https://mcbcode.com/points">point shop</a>
              </div>
            </div>

            <div class="panel">
              <div class="panel-title">quick links</div>
              <div class="link-list">
                <a class="link-item" href="/explore">explore</a>
                <a class="link-item" href="/profile/${encodeURIComponent(me.username)}">your profile</a>
                <a class="link-item" href="/profile/${encodeURIComponent(me.username)}#settings">account settings</a>
                <a class="link-item" href="/dripstone">dripstone ai</a>
                <a class="link-item" href="https://mcbcode.com/points">point shop</a>
              </div>
            </div>

            <div class="panel">
              <div class="panel-title">editors</div>
              <div class="link-list">
                <a class="link-item" href="https://mcbcode.com/editor/mcfunction">.mcfunction</a>
                <a class="link-item" href="https://mcbcode.com/editor/manifest">manifest.json</a>
                <a class="link-item" href="https://mcbcode.com/editor/javascript">.js</a>
                <a class="link-item" href="https://mcbcode.com/editor/json">.json</a>
                <a class="link-item" href="https://mcbcode.com/pixel">pixel editor</a>
              </div>
            </div>
          </div>

          <div class="main-col">
            <div class="section">
              <div class="section-head">
                <div class="section-title">your projects</div>
                <a class="section-link" href="/projects">see all</a>
              </div>
              <div class="tabs">
                <div class="tab active" data-tab="owned" onclick="setProjectTab('owned')">owned</div>
                <div class="tab" data-tab="collab" onclick="setProjectTab('collab')">collaborating</div>
              </div>
              <div id="project-content"><div class="loading-note">loading projects...</div></div>
            </div>

            <div class="section">
              <div class="section-head">
                <div class="section-title">activity feed</div>
                <a class="section-link" href="/notifications">see all</a>
              </div>
              <div id="feed-content"><div class="loading-note">loading activity...</div></div>
            </div>
          </div>
        </div>
      `;

      document.getElementById("new-project-btn").addEventListener("click", openNewProject);
    }

    // ---- projects ----
    let projectsData = { owned: [], collab: [] };
    let activeProjectTab = "owned";

    async function loadProjects() {
      try {
        const r = await fetch(`${AUTH}/projects`, { credentials: "include" });
        if (!r.ok) { document.getElementById("project-content").innerHTML = `<div class="error-note">couldn't load projects.</div>`; return; }
        const d = await r.json();
        projectsData.owned = d.projects || [];
        projectsData.collab = d.collab_projects || [];
        renderProjects();
      } catch {
        document.getElementById("project-content").innerHTML = `<div class="error-note">couldn't load projects.</div>`;
      }
    }

    function setProjectTab(tab) {
      activeProjectTab = tab;
      document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
      renderProjects();
    }

    function projectCardHtml(p, showOwner) {
      return `
        <div class="project-card" onclick="location.href='/project/${esc(p.share_code)}/'">
          <div class="project-name">${esc(p.name)}</div>
          <div class="project-desc">${esc(p.description || "no description yet")}</div>
          <div class="project-meta">
            ${showOwner ? `<span class="project-owner">by ${esc(p.owner_username || "")}</span>` : `<span>${p.is_public ? "public" : "private"}</span>`}
            <span>updated ${fmtDate(p.updated_at)}</span>
          </div>
          ${showOwner ? `<div class="project-actions"><button class="leave-btn" type="button" data-project-code="${esc(p.share_code)}" onclick="leaveProject(event, this)">leave project</button></div>` : ""}
        </div>`;
    }

    function renderProjects() {
      const el = document.getElementById("project-content");
      const list = activeProjectTab === "owned" ? projectsData.owned : projectsData.collab;
      if (!list.length) {
        el.innerHTML = activeProjectTab === "owned"
          ? `<div class="empty-note">no projects yet — hit "+ new project" to start one.</div>`
          : `<div class="empty-note">you're not collaborating on anything yet.</div>`;
        return;
      }
      el.innerHTML = `<div class="project-grid">${list.map(p => projectCardHtml(p, activeProjectTab === "collab")).join("")}</div>`;
    }

    async function leaveProject(event, btn) {
      event.stopPropagation();
      const code = btn.dataset.projectCode;
      if (!code || !confirm("leave this project? you can be invited back later.")) return;

      btn.disabled = true;
      btn.textContent = "leaving...";
      try {
        const r = await fetch(`${AUTH}/project/leave?code=${encodeURIComponent(code)}`, {
          method: "DELETE", credentials: "include"
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || "couldn't leave the project.");
        projectsData.collab = projectsData.collab.filter(p => p.share_code !== code);
        renderProjects();
      } catch (e) {
        alert(e.message || "couldn't leave the project. try again in a bit.");
        btn.disabled = false;
        btn.textContent = "leave project";
      }
    }

    async function logout() {
      const btn = document.getElementById("logout-btn");
      btn.disabled = true;
      btn.textContent = "logging out...";
      try {
        await fetch(`${AUTH}/logout`, { method: "POST", credentials: "include" });
      } finally {
        me = null;
        renderSignedOut();
        document.getElementById("topnav-avatar").href = "/account";
        document.getElementById("topnav-avatar").innerHTML = "?";
        btn.disabled = false;
        btn.textContent = "log out";
      }
    }

    // ---- new project modal ----
    const np = {
      overlay: document.getElementById("np-overlay"),
      type: document.getElementById("np-type"),
      typeHint: document.getElementById("np-type-hint"),
      name: document.getElementById("np-name"),
      desc: document.getElementById("np-desc"),
      nameCount: document.getElementById("np-name-count"),
      descCount: document.getElementById("np-desc-count"),
      optScratch: document.getElementById("np-opt-scratch"),
      optUpload: document.getElementById("np-opt-upload"),
      drop: document.getElementById("np-drop"),
      dropEmpty: document.getElementById("np-drop-empty"),
      dropFile: document.getElementById("np-drop-file"),
      dropLimit: document.getElementById("np-drop-limit"),
      fileInput: document.getElementById("np-file"),
      fileName: document.getElementById("np-file-name"),
      fileSize: document.getElementById("np-file-size"),
      fileClear: document.getElementById("np-file-clear"),
      progress: document.getElementById("np-progress"),
      progressFill: document.getElementById("np-progress-fill"),
      progressText: document.getElementById("np-progress-text"),
      error: document.getElementById("np-error"),
      warn: document.getElementById("np-warn"),
      create: document.getElementById("np-create"),
      cancel: document.getElementById("np-cancel"),
      close: document.getElementById("np-close"),
      mode: "scratch",
      file: null,
      code: null,
      busy: false
    };

    function npMaxBytes() { return (me && me.is_obsidian ? 25 : 10) * 1024 * 1024; }

    const PROJECT_TYPE_HINTS = {
      addon: "starts with behavior and resource pack folders.",
      texture_pack: "starts with a resource pack folder.",
      skinpack: "starts with a skin pack manifest and starter metadata in the rp folder.",
      script: "starts with a behavior pack and a javascript entry file."
    };

    function npUpdateTypeHint() {
      np.typeHint.textContent = PROJECT_TYPE_HINTS[np.type.value] || PROJECT_TYPE_HINTS.addon;
    }

    function npShowError(msg, html) {
      if (html) np.error.innerHTML = msg; else np.error.textContent = msg;
      np.error.classList.remove("hidden");
    }
    function npClearMessages() {
      np.error.classList.add("hidden");
      np.warn.classList.add("hidden");
    }

    function npSetMode(mode) {
      np.mode = mode;
      np.optScratch.classList.toggle("active", mode === "scratch");
      np.optUpload.classList.toggle("active", mode === "upload");
      np.drop.classList.toggle("hidden", mode !== "upload");
      npClearMessages();
    }

    function npSetFile(file) {
      npClearMessages();
      if (!file) {
        np.file = null;
        np.fileInput.value = "";
        np.drop.classList.remove("has-file");
        np.dropEmpty.classList.remove("hidden");
        np.dropFile.classList.add("hidden");
        return;
      }
      const ext = file.name.split(".").pop().toLowerCase();
      if (!["mcpack", "mcaddon", "zip"].includes(ext)) {
        npShowError("that file isn't a .mcpack or .mcaddon.");
        return;
      }
      if (file.size > npMaxBytes()) {
        const mb = npMaxBytes() / (1024 * 1024);
        npShowError(`that file is too large. max ${mb}MB${me && me.is_obsidian ? "" : " (obsidian members get 25MB)"}.`);
        return;
      }
      np.file = file;
      np.fileName.textContent = file.name;
      np.fileSize.textContent = fmtSize(file.size);
      np.drop.classList.add("has-file");
      np.dropEmpty.classList.add("hidden");
      np.dropFile.classList.remove("hidden");
      // if the name box is empty, fill it in from the file name
      if (!np.name.value.trim()) {
        np.name.value = file.name.replace(/\.(mcpack|mcaddon|zip)$/i, "").slice(0, 72);
        np.nameCount.textContent = np.name.value.length + "/72";
      }
    }

    function npSetBusy(busy) {
      np.busy = busy;
      np.create.disabled = busy;
      np.cancel.disabled = busy;
      np.close.disabled = busy;
      np.name.disabled = busy;
      np.desc.disabled = busy;
      np.optScratch.disabled = busy;
      np.optUpload.disabled = busy;
      np.fileClear.disabled = busy;
    }

    function openNewProject() {
      np.type.value = "addon";
      npUpdateTypeHint();
      np.name.value = "";
      np.desc.value = "";
      np.nameCount.textContent = "0/72";
      np.descCount.textContent = "0/256";
      np.dropLimit.textContent = `.mcpack or .mcaddon, up to ${npMaxBytes() / (1024 * 1024)}MB`;
      npSetMode("scratch");
      npSetFile(null);
      np.progress.classList.add("hidden");
      np.progressFill.style.width = "0%";
      np.create.textContent = "create project";
      np.code = null;
      npSetBusy(false);
      npClearMessages();
      np.overlay.classList.add("open");
      setTimeout(() => np.name.focus(), 50);
    }

    function closeNewProject() {
      if (np.busy) return;
      np.overlay.classList.remove("open");
    }

    np.name.addEventListener("input", () => { np.nameCount.textContent = np.name.value.length + "/72"; });
    np.desc.addEventListener("input", () => { np.descCount.textContent = np.desc.value.length + "/256"; });
    np.type.addEventListener("change", npUpdateTypeHint);
    np.optScratch.addEventListener("click", () => npSetMode("scratch"));
    np.optUpload.addEventListener("click", () => npSetMode("upload"));
    np.close.addEventListener("click", closeNewProject);
    np.cancel.addEventListener("click", closeNewProject);
    np.overlay.addEventListener("mousedown", (e) => { if (e.target === np.overlay) closeNewProject(); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && np.overlay.classList.contains("open")) closeNewProject();
    });

    np.drop.addEventListener("click", (e) => {
      if (np.busy || e.target === np.fileClear) return;
      np.fileInput.click();
    });
    np.fileInput.addEventListener("change", () => { if (np.fileInput.files[0]) npSetFile(np.fileInput.files[0]); });
    np.fileClear.addEventListener("click", (e) => { e.stopPropagation(); npSetFile(null); });
    ["dragenter", "dragover"].forEach(ev => np.drop.addEventListener(ev, (e) => {
      e.preventDefault(); if (!np.busy) np.drop.classList.add("drag");
    }));
    ["dragleave", "drop"].forEach(ev => np.drop.addEventListener(ev, (e) => {
      e.preventDefault(); np.drop.classList.remove("drag");
    }));
    np.drop.addEventListener("drop", (e) => {
      if (np.busy) return;
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) npSetFile(f);
    });

    np.create.addEventListener("click", submitNewProject);
    np.name.addEventListener("keydown", (e) => { if (e.key === "Enter") submitNewProject(); });

    function npProgress(pct, text) {
      np.progress.classList.remove("hidden");
      np.progressFill.style.width = Math.max(0, Math.min(100, pct)) + "%";
      np.progressText.textContent = text || "";
    }

    async function submitNewProject() {
      if (np.busy) return;
      npClearMessages();

      const uploading = np.mode === "upload";
      if (uploading && !np.file) { npShowError("pick a .mcpack or .mcaddon file first, or switch to scratch."); return; }

      const name = np.name.value.trim() || "Untitled Project";
      const description = np.desc.value.trim();

      npSetBusy(true);
      np.create.textContent = "creating...";

      let code = np.code;
      try {
        // step 1: make the project. skip_defaults = true when importing so the default BP/RP folders don't clash with the pack
        if (!code) {
          const r = await fetch(`${AUTH}/projects`, {
            method: "POST", credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, description, project_type: np.type.value, skip_defaults: uploading })
          });
          const d = await r.json().catch(() => ({}));
          if (!r.ok || !d.share_code) throw new Error(d.error || "couldn't create the project.");
          code = d.share_code;
          np.code = code;
        }

        if (!uploading) {
          location.href = `/project/${code}/`;
          return;
        }

        // step 2: send the pack file to the import endpoint (streams progress back as it extracts)
        np.create.textContent = "importing...";
        npProgress(0, "uploading pack...");

        const imp = await fetch(`${AUTH}/project/import?project_code=${encodeURIComponent(code)}`, {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/octet-stream" },
          body: np.file
        });

        if (!imp.ok) {
          const ed = await imp.json().catch(() => ({}));
          throw new Error(ed.error || "import failed.");
        }

        let wellFormed = true;
        let finished = false;
        let importError = null;

        function handleLine(line) {
          if (!line.trim()) return;
          let m;
          try { m = JSON.parse(line); } catch { return; }
          if (m.error) importError = m.error;
          else if (m.done) { finished = true; wellFormed = m.well_formed !== false; }
          else if (typeof m.progress === "number") npProgress(m.progress, m.status || "extracting...");
        }

        const reader = imp.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split("\n");
          buf = lines.pop();
          lines.forEach(handleLine);
        }
        handleLine(buf);

        if (importError) throw new Error(importError);
        if (!finished) throw new Error("import ended early. check the project to see what made it in.");

        npProgress(100, "done!");

        if (!wellFormed) {
          // pack imported fine but isn't the usual one BP + one RP layout, so let them know before jumping in
          np.warn.textContent = "imported, but this pack doesn't look like exactly one BP and one RP folder with manifests. opening your project anyway...";
          np.warn.classList.remove("hidden");
          setTimeout(() => { location.href = `/project/${code}/`; }, 1800);
        } else {
          location.href = `/project/${code}/`;
        }
      } catch (e) {
        const msg = (e && e.message) || "couldn't reach mcbcode. try again in a bit.";
        if (code && uploading) {
          npShowError(`${esc(msg)} your project was still created, <a href="/project/${esc(code)}/">open it here</a>.`, true);
        } else {
          npShowError(msg);
        }
        npSetBusy(false);
        np.create.textContent = code && uploading ? "retry import" : "create project";
      }
    }

    // ---- feed ----
    async function loadFeed() {
      try {
        const r = await fetch(`${AUTH}/notifications`, { credentials: "include" });
        if (!r.ok) { document.getElementById("feed-content").innerHTML = `<div class="error-note">couldn't load your activity.</div>`; return; }
        const d = await r.json();
        const dot = document.getElementById("notif-dot");
        if (d.unread_count > 0) { dot.textContent = d.unread_count > 9 ? "9+" : d.unread_count; dot.classList.add("visible"); }

        const feed = (d.notifications || []).filter(n => n.category !== "Points").slice(0, 8);
        renderFeed(feed);
      } catch {
        document.getElementById("feed-content").innerHTML = `<div class="error-note">couldn't load your activity.</div>`;
      }
    }

    function renderFeed(items) {
      const el = document.getElementById("feed-content");
      if (!items.length) {
        el.innerHTML = `<div class="empty-note">nothing here yet — follow people and watch projects to see updates.</div>`;
        return;
      }
      el.innerHTML = `<div class="feed-list">${items.map(n => `
        <a class="feed-item" href="${n.url ? esc(n.url) : '/notifications'}">
          <div class="feed-icon">${FEED_ICONS[n.category] || "•"}</div>
          <div class="feed-body">
            <div class="feed-title">${esc(n.title)}</div>
            ${n.description ? `<div class="feed-desc">${esc(n.description)}</div>` : ""}
            <div class="feed-time">${timeAgo(n.created_at)}</div>
          </div>
        </a>
      `).join("")}</div>`;
    }
  </script>
