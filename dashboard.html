<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="https://mcbcode.com/theme/favicon.png">
  <link rel="stylesheet" href="https://mcbcode.com/theme/site.css">
  <link rel="stylesheet" href="https://mcbcode.com/theme/ranks.css">
  <title>mcbCode | Dashboard</title>
  <style>
    :root {
      --bg: #0c0c0c;
      --bg-soft: #111214;
      --panel: #141414;
      --panel-alt: #161719;
      --border: #232323;
      --border-alt: #2a2a2e;
      --text: #c8c8c8;
      --dim: #888;
      --dimmer: #666;
      --faint: #444;
      --white: #fff;
      --green: #05ee93;
      --green-soft: rgba(5, 238, 147, 0.1);
      --pink: #ff00d0;
      --purple: #dc6bff;
      --blue: #00b2ff;
      --red: #ff5555;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: 'mcfont', sans-serif; }
    a { text-decoration: none; color: var(--white); transition: color .15s; }
    a:hover { color: var(--green); }
    button { font-family: 'mcfont', sans-serif; cursor: pointer; }
    g { color: var(--green); }

    /* ---- topnav ---- */
    .topnav {
      position: fixed; top: 0; left: 0; right: 0; height: 56px;
      background: rgba(20, 20, 20, .85); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-alt);
      display: flex; align-items: center; padding: 0 20px; gap: 16px; z-index: 200;
    }
    .topnav-title { font-size: 20px; color: var(--white); font-family: 'mcfontb', sans-serif; white-space: nowrap; }
    .topnav-search {
      flex: 1; max-width: 360px; display: flex; align-items: center;
      background: #1a1c1f; border: 1px solid var(--border-alt); padding: 7px 12px;
      transition: border-color .15s;
    }
    .topnav-search:focus-within { border-color: var(--green); }
    .topnav-search input { flex: 1; background: none; border: none; outline: none; color: var(--white); font-family: 'mcfont', sans-serif; font-size: 13px; }
    .topnav-search input::placeholder { color: var(--faint); }
    .topnav-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .icon-btn {
      width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
      background: #1e1e1e; border: 1px solid var(--border-alt); color: var(--dim);
      font-size: 15px; position: relative; transition: color .15s, border-color .15s;
    }
    .icon-btn:hover { color: var(--green); border-color: var(--green); }
    .icon-btn .dot {
      position: absolute; top: -4px; right: -4px; min-width: 15px; height: 15px; padding: 0 3px;
      background: var(--pink); color: #111; font-size: 9px; font-family: 'mcfontb', sans-serif;
      display: flex; align-items: center; justify-content: center; display: none;
    }
    .icon-btn .dot.visible { display: flex; }
    .avatar-link { width: 34px; height: 34px; border: 1px solid var(--border-alt); overflow: hidden; background: #222326; display: flex; align-items: center; justify-content: center; font-family: 'mcfontb', sans-serif; color: var(--dim); font-size: 13px; }
    .avatar-link img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-link:hover { border-color: var(--green); }

    /* ---- page shell ---- */
    .shell { margin-top: 56px; padding: 28px 20px 80px; max-width: 1180px; margin-left: auto; margin-right: auto; }

    .signed-out {
      text-align: center; padding: 100px 20px; color: var(--faint); font-size: 13px;
    }
    .signed-out strong { display: block; color: var(--dim); font-size: 17px; margin-bottom: 10px; font-family: 'mcfontb', sans-serif; }
    .signed-out a { color: var(--blue); }

    /* ---- hero ---- */
    .hero {
      display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .hero-welcome { font-size: 22px; color: var(--white); font-family: 'mcfontb', sans-serif; }
    .hero-welcome span { color: var(--green); }
    .hero-sub { font-size: 12px; color: var(--dimmer); margin-top: 6px; }
    .hero-actions { display: flex; gap: 10px; }
    .btn {
      font-size: 13px; padding: 9px 16px; border: 1px solid var(--border-alt); background: #1e1e1e;
      color: var(--dim); transition: color .15s, border-color .15s, background .15s;
    }
    .btn:hover { color: var(--green); border-color: var(--green); }
    .btn-primary { background: var(--green); border-color: var(--green); color: #0c0c0c; font-family: 'mcfont', sans-serif; }
    .btn-primary:hover { background: #78e3a6; color: #0c0c0c; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ---- main grid ---- */
    .grid {
      display: grid; grid-template-columns: 260px 1fr; gap: 22px; align-items: start;
    }

    /* ---- aside / quick links ---- */
    .aside { display: flex; flex-direction: column; gap: 18px; position: sticky; top: 76px; }
    .panel { background: var(--panel-alt); border: 1px solid var(--border-alt); padding: 16px; }
    .panel-title { font-size: 11px; color: var(--dimmer); letter-spacing: .06em; font-family: 'mcfontb', sans-serif; margin-bottom: 10px; }
    .link-list { display: flex; flex-direction: column; gap: 2px; }
    .link-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 8px; font-size: 13px; color: var(--dim);
      transition: background .12s, color .12s;
    }
    .link-item .li-icon { width: 18px; text-align: center; font-size: 13px; color: var(--dimmer); }
    .link-item:hover { color: var(--green); background: #1e2024; }
    .link-item:hover .li-icon { color: var(--green); }

    /* ---- points card ---- */
    .points-card {
      background: var(--panel); border: 2px dashed var(--border-alt); padding: 18px 20px;
      transform: rotate(-.4deg); display: flex; flex-direction: column; gap: 10px;
    }
    .points-num { font-size: 32px; color: var(--purple); font-family: 'mcfontb', sans-serif; line-height: 1; }
    .points-lbl { font-size: 11px; color: var(--dimmer); letter-spacing: .06em; margin-top: 4px; }
    .points-btns { display: flex; gap: 8px; margin-top: 6px; }
    .points-btns .btn { flex: 1; text-align: center; font-size: 12px; padding: 8px 0; }
    .obsidian-tag { font-size: 10px; color: var(--purple); border: 1px solid #3a2a4a; padding: 3px 7px; align-self: flex-start; }

    /* ---- section heading ---- */
    .section { margin-bottom: 32px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
    .section-title { font-size: 16px; color: var(--white); font-family: 'mcfontb', sans-serif; }
    .section-link { font-size: 12px; color: var(--blue); }

    /* ---- project tabs ---- */
    .tabs { display: flex; gap: 4px; margin-bottom: 14px; }
    .tab {
      font-size: 12px; padding: 7px 14px; background: #1a1a1a; border: 1px solid var(--border);
      color: var(--dim); transition: color .15s, border-color .15s;
    }
    .tab.active { color: var(--green); border-color: var(--green); background: var(--green-soft); }

    .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
    .project-card {
      background: var(--panel-alt); border: 1px solid var(--border-alt); padding: 16px;
      display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: border-color .15s;
    }
    .project-card:hover { border-color: var(--green); }
    .project-name { font-size: 14px; color: var(--white); font-family: 'mcfontb', sans-serif; }
    .project-desc { font-size: 12px; color: var(--dimmer); line-height: 1.5; min-height: 18px; }
    .project-meta { font-size: 11px; color: var(--faint); display: flex; justify-content: space-between; margin-top: auto; }
    .project-owner { color: var(--blue); }

    .empty-note, .loading-note, .error-note {
      font-size: 12px; color: var(--faint); padding: 18px; border: 1px dashed var(--border); text-align: center;
    }
    .error-note { color: var(--red); border-color: #3a1a1a; }

    /* ---- feed ---- */
    .feed-list { display: flex; flex-direction: column; gap: 2px; }
    .feed-item {
      display: flex; gap: 12px; padding: 12px 14px; background: var(--panel-alt); border: 1px solid var(--border-alt);
      margin-bottom: 6px; transition: border-color .15s;
    }
    .feed-item:hover { border-color: var(--green); }
    .feed-icon {
      width: 30px; height: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      background: #1e1e1e; border: 1px solid var(--border); font-size: 13px; color: var(--dim);
    }
    .feed-body { flex: 1; min-width: 0; }
    .feed-title { font-size: 13px; color: var(--text); line-height: 1.4; }
    .feed-title b { color: var(--white); font-family: 'mcfontb', sans-serif; font-weight: normal; }
    .feed-desc { font-size: 12px; color: var(--dimmer); margin-top: 3px; line-height: 1.4; }
    .feed-time { font-size: 10px; color: var(--faint); margin-top: 6px; }

    /* ---- editors panel ---- */
    .editor-note { font-size: 11px; color: var(--faint); line-height: 1.5; margin-top: 8px; }

    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
      .aside { position: static; order: 2; }
      .aside-links { display: flex; overflow-x: auto; gap: 8px; padding-bottom: 4px; }
      .aside-links .link-item { flex: 0 0 auto; background: var(--panel-alt); border: 1px solid var(--border-alt); }
      .main-col { order: 1; }
      .topnav-search { display: none; }
      .hero { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <div class="topnav">
    <a href="/" class="topnav-title">mcb<g>Code</g></a>
    <div class="topnav-search">
      <input id="topnav-search-input" type="text" placeholder="search mcbcode..." autocomplete="off" maxlength="64">
    </div>
    <div class="topnav-right">
      <a class="icon-btn" href="/notifications" title="notifications">
        <img src="https://mcbcode.com/img/icons/bell.png"><span class="dot" id="notif-dot"></span>
      </a>
      <a class="avatar-link" id="topnav-avatar" href="/account">?</a>
    </div>
  </div>

  <div class="shell" id="shell">
    <div class="loading-note" style="margin-top:60px;">loading your dashboard...</div>
  </div>

  <script>
    const AUTH = "https://auth.mcbcode.com";
    let me = null;

    function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
    function fmtDate(s) {
      if (!s) return "";
      const d = new Date(s.endsWith("Z") ? s : s + "Z");
      return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }
    function timeAgo(s) {
      if (!s) return "";
      const d = new Date(s.endsWith("Z") ? s : s + "Z");
      const diff = Math.max(0, (Date.now() - d.getTime()) / 1000);
      if (diff < 60) return "just now";
      if (diff < 3600) return Math.floor(diff / 60) + "m ago";
      if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
      if (diff < 604800) return Math.floor(diff / 86400) + "d ago";
      return fmtDate(s);
    }

    const FEED_ICONS = { Activity: "◍", Projects: "▤", Comments: "✉", System: "✦", GitHub: "⌥", Achievements: "★" };

    document.getElementById("topnav-search-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && e.target.value.trim()) {
        location.href = `/search?q=${encodeURIComponent(e.target.value.trim())}`;
      }
    });

    (async () => {
      try {
        const r = await fetch(`${AUTH}/me`, { credentials: "include" });
        if (!r.ok) { renderSignedOut(); return; }
        me = await r.json();
        renderShell();
        loadProjects();
        loadFeed();
      } catch {
        document.getElementById("shell").innerHTML = `<div class="error-note" style="margin-top:60px;">couldn't reach mcbcode. check your connection and reload.</div>`;
      }
    })();

    function renderSignedOut() {
      document.getElementById("shell").innerHTML = `
        <div class="signed-out">
          <strong>you're not signed in</strong>
          <a href="/account">log in</a> to see your dashboard.
        </div>`;
    }

    function renderShell() {
      const avatarEl = document.getElementById("topnav-avatar");
      avatarEl.href = `/profile/${encodeURIComponent(me.username)}`;
      avatarEl.innerHTML = me.pfp_url ? `<img src="${esc(me.pfp_url)}" alt="">` : esc((me.username || "?")[0].toUpperCase());

      document.getElementById("shell").innerHTML = `
        <div class="hero">
          <div>
            <div class="hero-welcome">welcome back, <span>${esc(me.username || "friend")}</span></div>
            <div class="hero-sub">here's what's going on across mcbcode</div>
          </div>
          <div class="hero-actions">
            <button class="btn" id="import-btn" onclick="location.href='/explore'">explore</button>
            <button class="btn btn-primary" id="new-project-btn">+ new project</button>
          </div>
        </div>

        <div class="grid">
          <div class="aside">
            <div class="points-card">
              <div>
                <div class="points-num">${(me.points || 0).toLocaleString()}</div>
                <div class="points-lbl">your points</div>
              </div>
              ${me.is_obsidian ? `<div class="obsidian-tag">obsidian member</div>` : ""}
              <div class="points-btns">
                <a class="btn btn-primary" href="https://mcbcode.com/points">point shop</a>
              </div>
            </div>

            <div class="panel">
              <div class="panel-title">quick links</div>
              <div class="link-list">
                <a class="link-item" href="/explore">explore</a>
                <a class="link-item" href="/profile/${encodeURIComponent(me.username)}">your profile</a>
                <a class="link-item" href="/profile/${encodeURIComponent(me.username)}#settings">account settings</a>
                <a class="link-item" href="/dripstone">dripstone ai</a>
                <a class="link-item" href="https://mcbcode.com/points">point shop</a>
              </div>
            </div>

            <div class="panel">
              <div class="panel-title">editors</div>
              <div class="link-list">
                <a class="link-item" href="https://mcbcode.com/editor/mcfunction">.mcfunction</a>
                <a class="link-item" href="https://mcbcode.com/editor/manifest">manifest.json</a>
                <a class="link-item" href="https://mcbcode.com/editor/javascript">.js</a>
                <a class="link-item" href="https://mcbcode.com/editor/json">.json</a>
                <a class="link-item" href="https://mcbcode.com/pixel">pixel editor</a>
              </div>
              <div class="editor-note">the last two links are placeholders — swap them for your real editor urls.</div>
            </div>
          </div>

          <div class="main-col">
            <div class="section">
              <div class="section-head">
                <div class="section-title">your projects</div>
                <a class="section-link" href="/projects">see all</a>
              </div>
              <div class="tabs">
                <div class="tab active" data-tab="owned" onclick="setProjectTab('owned')">owned</div>
                <div class="tab" data-tab="collab" onclick="setProjectTab('collab')">collaborating</div>
              </div>
              <div id="project-content"><div class="loading-note">loading projects...</div></div>
            </div>

            <div class="section">
              <div class="section-head">
                <div class="section-title">activity feed</div>
                <a class="section-link" href="/notifications">see all</a>
              </div>
              <div id="feed-content"><div class="loading-note">loading activity...</div></div>
            </div>
          </div>
        </div>
      `;

      document.getElementById("new-project-btn").addEventListener("click", createNewProject);
    }

    // ---- projects ----
    let projectsData = { owned: [], collab: [] };
    let activeProjectTab = "owned";

    async function loadProjects() {
      try {
        const r = await fetch(`${AUTH}/projects`, { credentials: "include" });
        if (!r.ok) { document.getElementById("project-content").innerHTML = `<div class="error-note">couldn't load projects.</div>`; return; }
        const d = await r.json();
        projectsData.owned = d.projects || [];
        projectsData.collab = d.collab_projects || [];
        renderProjects();
      } catch {
        document.getElementById("project-content").innerHTML = `<div class="error-note">couldn't load projects.</div>`;
      }
    }

    function setProjectTab(tab) {
      activeProjectTab = tab;
      document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
      renderProjects();
    }

    function projectCardHtml(p, showOwner) {
      return `
        <div class="project-card" onclick="location.href='/project/${esc(p.share_code)}/'">
          <div class="project-name">${esc(p.name)}</div>
          <div class="project-desc">${esc(p.description || "no description yet")}</div>
          <div class="project-meta">
            ${showOwner ? `<span class="project-owner">by ${esc(p.owner_username || "")}</span>` : `<span>${p.is_public ? "public" : "private"}</span>`}
            <span>updated ${fmtDate(p.updated_at)}</span>
          </div>
        </div>`;
    }

    function renderProjects() {
      const el = document.getElementById("project-content");
      const list = activeProjectTab === "owned" ? projectsData.owned : projectsData.collab;
      if (!list.length) {
        el.innerHTML = activeProjectTab === "owned"
          ? `<div class="empty-note">no projects yet — hit "+ new project" to start one.</div>`
          : `<div class="empty-note">you're not collaborating on anything yet.</div>`;
        return;
      }
      el.innerHTML = `<div class="project-grid">${list.map(p => projectCardHtml(p, activeProjectTab === "collab")).join("")}</div>`;
    }

    async function createNewProject() {
      const btn = document.getElementById("new-project-btn");
      btn.disabled = true; btn.textContent = "creating...";
      try {
        const r = await fetch(`${AUTH}/projects`, {
          method: "POST", credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: "Untitled Project" })
        });
        const d = await r.json();
        if (r.ok && d.share_code) {
          location.href = `/project/${d.share_code}/`;
          return;
        }
        alert(d.error || "couldn't create the project.");
      } catch {
        alert("couldn't reach mcbcode. try again in a bit.");
      }
      btn.disabled = false; btn.textContent = "+ new project";
    }

    // ---- feed ----
    async function loadFeed() {
      try {
        const r = await fetch(`${AUTH}/notifications`, { credentials: "include" });
        if (!r.ok) { document.getElementById("feed-content").innerHTML = `<div class="error-note">couldn't load your activity.</div>`; return; }
        const d = await r.json();
        const dot = document.getElementById("notif-dot");
        if (d.unread_count > 0) { dot.textContent = d.unread_count > 9 ? "9+" : d.unread_count; dot.classList.add("visible"); }

        const feed = (d.notifications || []).filter(n => n.category !== "Points").slice(0, 8);
        renderFeed(feed);
      } catch {
        document.getElementById("feed-content").innerHTML = `<div class="error-note">couldn't load your activity.</div>`;
      }
    }

    function renderFeed(items) {
      const el = document.getElementById("feed-content");
      if (!items.length) {
        el.innerHTML = `<div class="empty-note">nothing here yet — follow people and watch projects to see updates.</div>`;
        return;
      }
      el.innerHTML = `<div class="feed-list">${items.map(n => `
        <a class="feed-item" href="${n.url ? esc(n.url) : '/notifications'}">
          <div class="feed-icon">${FEED_ICONS[n.category] || "•"}</div>
          <div class="feed-body">
            <div class="feed-title">${esc(n.title)}</div>
            ${n.description ? `<div class="feed-desc">${esc(n.description)}</div>` : ""}
            <div class="feed-time">${timeAgo(n.created_at)}</div>
          </div>
        </a>
      `).join("")}</div>`;
    }
  </script>

</body>
</html>
