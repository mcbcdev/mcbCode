<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>mcbCode | Dripstone</title>

  <link rel="icon" href="https://mcbcode.com/theme/favicon.png">
  <link rel="stylesheet" href="https://mcbcode.com/theme/site.css">

  <style>
    :root {
        --accent: #05ee93;
        --accent-dim: #05ee9333;
        --panel: #1c1c1cdd;
        --panel-solid: #232323;
        --border: #333333;
        --text: #ffffff;
        --text-dim: #b8b8b8;
        --error: #ff6b6b;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
    }

    .bg-image {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        filter: blur(6px);
        transform: scale(1.05);
        z-index: -999;
    }

    .bg-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.65);
        z-index: -998;
        pointer-events: none;
    }

    /* ---------- sidebar ---------- */
    .sidebar {
        background-color: var(--panel-solid);
        color: var(--text);
        height: 100%;
        position: fixed;
        top: 0;
        right: 0;
        width: 250px;
        border-left: 2px solid var(--accent);
        padding: 18px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: transform 0.3s ease;
        z-index: 100;
    }
    .sidebar.hidden { transform: translateX(100%); }
    .toggle-btn {
        position: fixed;
        top: 15px;
        right: 15px;
        background-color: var(--panel-solid);
        color: var(--accent);
        border: 1px solid var(--accent);
        padding: 8px 12px;
        cursor: pointer;
        z-index: 101;
        font-size: 1rem;
        font-family: 'mcfontb', sans-serif;
    }
    .toggle-btn:hover { background-color: var(--accent); color: #181818; }
    .sidebar-close-btn {
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 1.2rem;
        cursor: pointer;
        align-self: flex-end;
    }
    h3 { font-family: 'mcfontb', sans-serif; }

    @media (min-width: 769px) {
        body:not(.sidebar-hidden) .app { margin-right: 250px; }
    }
    @media (max-width: 768px) {
        .sidebar { width: 85%; max-width: 320px; }
    }

    /* ---------- main app layout ---------- */
    /* normal top-to-bottom flex column: messages grow to fill space,
       input bar just sits after it in flow. no fixed/absolute fighting. */
    .app {
        height: 100vh;
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        padding: 24px 20px;
        transition: margin-right 0.3s ease;
    }

    .messages-area {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        overflow-y: auto;
        gap: 20px;
        padding: 10px 4px 24px 4px;
        scrollbar-width: thin;
        scrollbar-color: var(--accent-dim) transparent;
    }
    .messages-area.has-messages { justify-content: flex-start; }

    .hero-title {
        font-size: 2.2rem;
        font-family: 'mcfontb', sans-serif;
        text-align: center;
        color: var(--text);
        padding: 0 10px;
    }
    .hero-title span { color: var(--accent); }
    .hero-title.gone { display: none; }

    .msg-row { display: flex; }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.ai { justify-content: flex-start; }

    .msg-user {
        max-width: 82%;
        background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
        border: 1px solid var(--accent);
        color: var(--text);
        padding: 10px 14px;
        border-radius: 14px 14px 2px 14px;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: 'mcfont', sans-serif;
    }

    .msg-ai {
        max-width: 92%;
        color: var(--text-dim);
        white-space: pre-wrap;
        word-break: break-word;
        font-family: 'mcfont', sans-serif;
        line-height: 1.55;
        padding-top: 2px;
    }
    .msg-ai.pending {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #777;
        font-style: italic;
    }
    .msg-ai.error-msg { color: var(--error); }

    .dot-pulse {
        display: inline-flex;
        gap: 3px;
    }
    .dot-pulse span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.2s infinite ease-in-out;
    }
    .dot-pulse span:nth-child(2) { animation-delay: 0.15s; }
    .dot-pulse span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes pulse {
        0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1.15); }
    }

    /* ---------- input bar ---------- */
    .input-bar {
        flex-shrink: 0;
        background-color: var(--panel);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 12px 14px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    }
    .input-bar.focused { border-color: var(--accent); }

    .login-notice {
        display: none;
        color: #ff9900;
        font-family: 'mcfont', sans-serif;
        font-size: 0.85rem;
        margin-bottom: 8px;
    }
    .login-notice a { color: var(--accent); }
    .login-notice.show { display: block; }

    .selected-files-container {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
    }
    .file-chip {
        background-color: #181818;
        border: 1px solid var(--accent);
        color: var(--text);
        padding: 4px 8px;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        gap: 6px;
        border-radius: 8px;
        font-family: 'mcfont', sans-serif;
    }
    .file-chip span { cursor: pointer; color: var(--accent); font-family: 'mcfontb', sans-serif; }

    .chat-textarea {
        width: 100%;
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 1rem;
        resize: none;
        outline: none;
        height: 24px;
        min-height: 24px;
        max-height: 200px;
        font-family: 'mcfont', sans-serif;
        line-height: 24px;
        padding: 0;
        margin: 0;
        overflow-y: hidden;
    }
    .chat-textarea:disabled { opacity: 0.4; cursor: not-allowed; }
    .chat-textarea::placeholder { color: #777; }

    .chat-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        border-top: 1px solid var(--border);
        padding-top: 10px;
    }
    .extra-tools { display: flex; align-items: center; gap: 10px; }
    .file-upload-icon { height: 20px; width: 20px; cursor: pointer; filter: invert(1); display: block; }
    .file-upload-icon:hover { opacity: 0.8; }

    .send-btn {
        background-color: var(--accent);
        color: #181818;
        border: none;
        padding: 8px 18px;
        font-family: 'mcfontb', sans-serif;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.1s ease, opacity 0.15s ease;
    }
    .send-btn:hover:not(:disabled) { opacity: 0.9; }
    .send-btn:active:not(:disabled) { transform: scale(0.96); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

<img id="bgImage" class="bg-image" alt="Background">
<div class="bg-overlay"></div>

<button class="toggle-btn" id="sidebarToggle" onclick="toggleSidebar()">☰</button>

<div class="app" id="app">
    <div class="messages-area" id="messagesArea">
        <div class="hero-title" id="heroTitle">what are we building?</div>
    </div>

    <div class="input-bar" id="inputBar">
        <div class="login-notice" id="loginNotice">
            you need to be logged in to use DripstoneAI. <a href="https://mcbcode.com/account">log in here</a>
        </div>

        <div class="selected-files-container" id="selectedFilesContainer"></div>

        <textarea class="chat-textarea" placeholder="Ask DripstoneAI anything... (Shift+Enter for new line)" id="autoGrowInput"></textarea>

        <div class="chat-controls">
            <div class="extra-tools">
                <label for="fileInput" title="Attach file">
                    <img src="https://mcbcode.com/img/icons/file.png" class="file-upload-icon" alt="Attach file">
                </label>
                <input type="file" id="fileInput" style="display: none;" multiple onchange="handleFileSelect(event)">
            </div>
            <button class="send-btn" id="sendBtn">Send</button>
        </div>
    </div>
</div>

<div class="sidebar" id="sidebar">
    <div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <img src="https://mcbcode.com/img/icons/default-transparent.png" style="height: 18px;">
                <h3 style="margin: 0;">DripstoneAI</h3>
            </div>
            <button class="sidebar-close-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <p style="margin-top: 0; color: #888; font-size: 0.9rem;">mcb<span style="color: var(--accent);">Code</span></p>
    </div>

    <div style="font-size: 0.85rem; color: #666; border-top: 1px solid #333; padding-top: 12px;">
        Session: <span id="sessionStatus">Checking...</span>
    </div>
</div>

<script>
    // ---- background renderer ----
    (function() {
        const bgImages = [
            'https://mcbcode.com/img/mc/nether_forest.png',
            'https://mcbcode.com/img/mc/end_city_one.png',
            'https://mcbcode.com/img/mc/end_city_two.png'
        ];
        const randomBg = bgImages[Math.floor(Math.random() * bgImages.length)];
        const imgElement = document.getElementById('bgImage');
        if (imgElement) imgElement.src = randomBg;
    })();

    const DRIPSTONE_API = "https://dripstone-ai.mcbcode.com";
    const AUTH_ME_URL = "https://auth.mcbcode.com/me";

    let attachedFiles = [];
    let conversation = []; // [{role: "user"|"assistant", content: "..."}]
    let isLoggedIn = false;
    let isSending = false;

    const textarea = document.getElementById('autoGrowInput');
    const messagesArea = document.getElementById('messagesArea');
    const heroTitle = document.getElementById('heroTitle');
    const loginNotice = document.getElementById('loginNotice');
    const sendBtn = document.getElementById('sendBtn');
    const inputBar = document.getElementById('inputBar');
    const sessionStatus = document.getElementById('sessionStatus');

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('hidden');
        document.body.classList.toggle('sidebar-hidden', sidebar.classList.contains('hidden'));
    }

    function autoGrow() {
        textarea.style.height = '24px';
        const scrollH = textarea.scrollHeight;
        if (scrollH > 24) {
            textarea.style.height = scrollH + 'px';
            textarea.style.overflowY = 'auto';
        } else {
            textarea.style.height = '24px';
            textarea.style.overflowY = 'hidden';
        }
    }
    textarea.addEventListener('input', autoGrow);
    textarea.addEventListener('focus', () => inputBar.classList.add('focused'));
    textarea.addEventListener('blur', () => inputBar.classList.remove('focused'));

    textarea.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    });

    sendBtn.addEventListener('click', sendMessage);

    // ---- login check ----
    // this only controls what the UI lets you do. the worker checks again
    // on its own server-side, so hitting the api directly still gets blocked.
    async function checkLogin() {
        try {
            const res = await fetch(AUTH_ME_URL, { credentials: 'include' });
            isLoggedIn = res.ok;
        } catch {
            isLoggedIn = false;
        }

        if (isLoggedIn) {
            loginNotice.classList.remove('show');
            textarea.disabled = false;
            sendBtn.disabled = false;
            sessionStatus.textContent = "Logged in";
        } else {
            loginNotice.classList.add('show');
            textarea.disabled = true;
            sendBtn.disabled = true;
            sessionStatus.textContent = "Not logged in";
        }
    }

    // ---- rendering messages ----
    function renderMessage(role, text, opts = {}) {
        if (!heroTitle.classList.contains('gone')) heroTitle.classList.add('gone');
        messagesArea.classList.add('has-messages');

        const row = document.createElement('div');
        row.className = 'msg-row ' + (role === 'user' ? 'user' : 'ai');

        const bubble = document.createElement('div');
        bubble.className = role === 'user' ? 'msg-user' : 'msg-ai';
        if (opts.error) bubble.classList.add('error-msg');

        if (opts.pending) {
            bubble.classList.add('pending');
            bubble.innerHTML = '<span class="dot-pulse"><span></span><span></span><span></span></span>';
        } else {
            bubble.textContent = text;
        }

        row.appendChild(bubble);
        messagesArea.appendChild(row);
        messagesArea.scrollTop = messagesArea.scrollHeight;
        return bubble;
    }

    async function sendMessage() {
        if (isSending) return;
        if (!isLoggedIn) {
            await checkLogin();
            return;
        }

        let text = textarea.value.trim();
        if (!text) return;

        conversation.push({ role: 'user', content: text });
        renderMessage('user', text);

        textarea.value = '';
        textarea.style.height = '24px';
        textarea.style.overflowY = 'hidden';
        attachedFiles = [];
        renderFiles();

        isSending = true;
        sendBtn.disabled = true;
        const pendingEl = renderMessage('assistant', '', { pending: true });

        try {
            const res = await fetch(DRIPSTONE_API, {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: conversation }),
            });

            const data = await res.json();

            if (!res.ok) {
                pendingEl.classList.remove('pending');
                pendingEl.classList.add('error-msg');
                pendingEl.textContent = data.error || 'something went wrong.';
                if (res.status === 401) await checkLogin();
                return;
            }

            pendingEl.classList.remove('pending');
            pendingEl.textContent = data.reply;
            conversation.push({ role: 'assistant', content: data.reply });
        } catch (err) {
            pendingEl.classList.remove('pending');
            pendingEl.classList.add('error-msg');
            pendingEl.textContent = 'could not reach DripstoneAI. check your connection.';
        } finally {
            isSending = false;
            sendBtn.disabled = !isLoggedIn;
        }
    }

    // ---- file attachments (ui only for now, not sent to the ai yet) ----
    function handleFileSelect(event) {
        const files = Array.from(event.target.files);
        attachedFiles = [...attachedFiles, ...files];
        renderFiles();
        event.target.value = '';
    }

    function removeFile(index) {
        attachedFiles.splice(index, 1);
        renderFiles();
    }

    function renderFiles() {
        const container = document.getElementById('selectedFilesContainer');
        container.innerHTML = '';
        attachedFiles.forEach((file, index) => {
            const chip = document.createElement('div');
            chip.className = 'file-chip';
            chip.innerHTML = `
                <span>📄</span>
                <span>${file.name}</span>
                <span onclick="removeFile(${index})" title="Remove file">✕</span>
            `;
            container.appendChild(chip);
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        if (window.innerWidth <= 768) {
            document.getElementById('sidebar').classList.add('hidden');
            document.body.classList.add('sidebar-hidden');
        }
        checkLogin();
    });
</script>

</body>
</html>
