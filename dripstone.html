<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>mcbCode | Dripstone</title>

  <link rel="icon" href="https://mcbcode.com/theme/favicon.png">
  <link rel="stylesheet" href="https://mcbcode.com/theme/site.css">

  <style>
    :root {
        --accent: #05ee93;
        --accent-dim: #05ee9333;
        --panel: #1c1c1cdd;
        --panel-solid: #232323;
        --border: #333333;
        --text: #ffffff;
        --text-dim: #b8b8b8;
        --error: #ff6b6b;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
    }

    .bg-image {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        filter: blur(6px);
        transform: scale(1.05);
        z-index: -999;
    }

    .bg-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.65);
        z-index: -998;
        pointer-events: none;
    }

    /* ---------- sidebar ---------- */
    .sidebar {
        background-color: var(--panel-solid);
        color: var(--text);
        height: 100%;
        position: fixed;
        top: 0;
        right: 0;
        width: 250px;
        border-left: 2px solid var(--accent);
        padding: 18px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: transform 0.3s ease;
        z-index: 100;
    }
    h3 { font-family: 'mcfontb', sans-serif; }

    @media (min-width: 769px) {
        .app { margin-right: 250px; }
    }
    @media (max-width: 768px) {
        .sidebar { width: 85%; max-width: 320px; }
    }

    /* ---------- main app layout ---------- */
    /* normal top-to-bottom flex column: messages grow to fill space,
       input bar just sits after it in flow. no fixed/absolute fighting. */
    .app {
        height: 100vh;
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        padding: 24px 20px;
        transition: margin-right 0.3s ease;
        position: relative;
    }

    .messages-area {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        overflow-y: auto;
        gap: 20px;
        padding: 10px 4px 24px 4px;
        scrollbar-width: thin;
        scrollbar-color: var(--accent-dim) transparent;
    }
    .messages-area.has-messages { justify-content: flex-start; }

    .hero-title {
        font-size: 2.2rem;
        font-family: 'mcfontb', sans-serif;
        text-align: center;
        color: var(--text);
        padding: 0 10px;
    }
    .hero-title span { color: var(--accent); }
    .hero-title.gone { display: none; }

    .msg-row { display: flex; }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.ai { flex-direction: column; align-items: flex-start; }

    .msg-user {
        max-width: 82%;
        background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
        border: 1px solid var(--accent);
        color: var(--text);
        padding: 10px 14px;
        border-radius: 14px 14px 2px 14px;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: 'mcfont', sans-serif;
    }

    .msg-ai {
        max-width: 92%;
        color: var(--text-dim);
        white-space: pre-wrap;
        word-break: break-word;
        font-family: 'mcfont', sans-serif;
        line-height: 1.55;
        padding-top: 2px;
    }
    .msg-ai.pending {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #777;
        font-style: italic;
    }
    .msg-ai.error-msg { color: var(--error); }

    /* markdown styling inside ai replies */
    .msg-ai h1, .msg-ai h2, .msg-ai h3 {
        color: var(--accent);
        font-family: 'mcfontb', sans-serif;
        margin: 10px 0 6px;
        font-size: 1.1em;
    }
    .msg-ai strong { font-family: 'mcfontb', sans-serif; font-weight: normal; color: #ffffff; }
    .msg-ai em { color: var(--text-dim); }
    .msg-ai code.md-inline-code {
        background: #111;
        color: #bebebe;
        padding: 2px 5px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 0.9em;
    }

    .md-code-wrap {
        margin: 10px 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
    }
    .md-code-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #141414;
        padding: 6px 10px;
        border-bottom: 1px solid var(--border);
    }
    .md-code-lang {
        font-family: 'mcfont', sans-serif;
        font-size: 0.75rem;
        color: #888;
    }
    .code-copy-btn {
        display: flex;
        align-items: center;
        gap: 5px;
        background: transparent;
        border: none;
        color: #aaa;
        cursor: pointer;
        font-family: 'mcfont', sans-serif;
        font-size: 0.75rem;
        padding: 3px 7px;
        border-radius: 5px;
    }
    .code-copy-btn:hover { color: var(--accent); background: #1f1f1f; }
    .code-copy-btn img { width: 12px; height: 12px; filter: invert(1); opacity: 0.85; }

    .msg-ai pre.md-code-block {
        margin: 0;
        border: none;
        border-radius: 0;
        background: #111;
        padding: 10px 12px;
        overflow-x: auto;
    }
    .msg-ai pre.md-code-block code {
        color: #bebebe;
        font-family: monospace;
        font-size: 0.85em;
        white-space: pre;
    }
    .msg-ai ul.md-list {
        margin: 4px 0 4px 20px;
        padding: 0;
    }
    .msg-ai ul.md-list li::marker { color: #00b2ff; }
    .msg-ai a.md-link { color: var(--accent); text-decoration: underline; }

    /* the copy button + timestamp that sit below every finished ai reply */
    .msg-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
    }
    .msg-copy-btn {
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 4px;
        border-radius: 6px;
        opacity: 0.55;
        transition: opacity 0.15s ease, background 0.15s ease, transform 0.1s ease;
    }
    .msg-copy-btn:hover { opacity: 1; background: #1f1f1f; }
    .msg-copy-btn:active { transform: scale(0.9); }
    .msg-copy-btn img { width: 14px; height: 14px; filter: invert(1); display: block; }
    .msg-timestamp {
        font-family: 'mcfont', sans-serif;
        font-size: 0.72rem;
        color: #666;
    }

    /* jumps you back to the newest message when you've scrolled up */
    .scroll-bottom-btn {
        position: absolute;
        bottom: 130px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        align-items: center;
        gap: 6px;
        background-color: var(--panel-solid);
        color: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 20px;
        padding: 6px 14px;
        font-family: 'mcfontb', sans-serif;
        font-size: 0.8rem;
        cursor: pointer;
        z-index: 20;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }
    .scroll-bottom-btn.show { display: flex; }
    .scroll-bottom-btn:hover { background-color: var(--accent); color: #181818; }

    .dot-pulse {
        display: inline-flex;
        gap: 4px;
    }
    .dot-pulse span {
        width: 6px;
        height: 6px;
        background: var(--accent);
        animation: pulse 1.2s infinite ease-in-out;
    }
    .dot-pulse span:nth-child(2) { animation-delay: 0.15s; }
    .dot-pulse span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes pulse {
        0%, 80%, 100% { opacity: 0.25; transform: scale(0.8) rotate(0deg); }
        40% { opacity: 1; transform: scale(1.15) rotate(15deg); }
    }

    /* word-by-word fade-in-down for ai replies */
    .word-fade {
        display: inline-block;
        opacity: 0;
        transform: translateY(-8px);
        animation: fadeInDown 0.35s ease forwards;
    }
    @keyframes fadeInDown {
        to { opacity: 1; transform: translateY(0); }
    }

    /* ---------- input bar ---------- */
    .input-bar {
        flex-shrink: 0;
        background-color: var(--panel);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 12px 14px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    }
    .input-bar.focused { border-color: var(--accent); }

    .login-notice {
        display: none;
        color: #ff9900;
        font-family: 'mcfont', sans-serif;
        font-size: 0.85rem;
        margin-bottom: 8px;
    }
    .login-notice a { color: var(--accent); }
    .login-notice.show { display: block; }

    .selected-files-container {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
    }
    .file-chip {
        background-color: #181818;
        border: 1px solid var(--accent);
        color: var(--text);
        padding: 4px 8px;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        gap: 6px;
        border-radius: 8px;
        font-family: 'mcfont', sans-serif;
    }
    .file-chip span { cursor: pointer; color: var(--accent); font-family: 'mcfontb', sans-serif; }

    .chat-textarea {
        width: 100%;
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 1rem;
        resize: none;
        outline: none;
        height: 24px;
        min-height: 24px;
        max-height: 200px;
        font-family: 'mcfont', sans-serif;
        line-height: 24px;
        padding: 0;
        margin: 0;
        overflow-y: hidden;
    }
    .chat-textarea:disabled { opacity: 0.4; cursor: not-allowed; }
    .chat-textarea::placeholder { color: #777; }

    .chat-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        border-top: 1px solid var(--border);
        padding-top: 10px;
    }
    .extra-tools { display: flex; align-items: center; gap: 10px; }
    .file-upload-icon { height: 20px; width: 20px; cursor: pointer; filter: invert(1); display: block; }
    .file-upload-icon:hover { opacity: 0.8; }

    .send-btn {
        background-color: var(--accent);
        color: #181818;
        border: none;
        padding: 8px 18px;
        font-family: 'mcfontb', sans-serif;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.1s ease, opacity 0.15s ease;
    }
    .send-btn:hover:not(:disabled) { opacity: 0.9; }
    .send-btn:active:not(:disabled) { transform: scale(0.96); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

<img id="bgImage" class="bg-image" alt="Background">
<div class="bg-overlay"></div>

<div class="app" id="app">
    <div class="messages-area" id="messagesArea">
        <div class="hero-title" id="heroTitle">what are we building?</div>
    </div>

    <button class="scroll-bottom-btn" id="scrollBottomBtn" type="button">↓ latest</button>

    <div class="input-bar" id="inputBar">
        <div class="login-notice" id="loginNotice">
            you need to be logged in to use DripstoneAI. <a href="https://mcbcode.com/account">log in here</a>
        </div>

        <div class="selected-files-container" id="selectedFilesContainer"></div>

        <textarea class="chat-textarea" placeholder="Ask DripstoneAI anything... (Shift+Enter for new line)" id="autoGrowInput"></textarea>

        <div class="chat-controls">
            <div class="extra-tools">
                <label for="fileInput" title="Attach file">
                    <img src="https://mcbcode.com/img/icons/file.png" class="file-upload-icon" alt="Attach file">
                </label>
                <input type="file" id="fileInput" style="display: none;" multiple onchange="handleFileSelect(event)">
            </div>
            <button class="send-btn" id="sendBtn">Send</button>
        </div>
    </div>
</div>

<div class="sidebar" id="sidebar">
    <div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <img src="https://mcbcode.com/img/icons/default-transparent.png" style="height: 18px;">
                <h3 style="margin: 0;">DripstoneAI</h3>
            </div>
        </div>
        <p style="margin-top: 0; color: #888; font-size: 0.9rem;">mcb<span style="color: var(--accent);">Code</span></p>
    </div>

    <div style="font-size: 0.85rem; color: #666; border-top: 1px solid #333; padding-top: 12px;">
        Session: <span id="sessionStatus">Checking...</span>
    </div>
</div>

<script>
    // ---- background renderer ----
    (function() {
        const imgElement = document.getElementById('bgImage');
        if (imgElement) imgElement.src = 'https://mcbcode.com/img/mc/end_city_two.png';
    })();

    const DRIPSTONE_API = "https://dripstone-ai.mcbcode.com";
    const AUTH_ME_URL = "https://auth.mcbcode.com/me";

    let attachedFiles = [];
    let conversation = []; // [{role: "user"|"assistant", content: "..."}]
    let isLoggedIn = false;
    let isSending = false;

    const textarea = document.getElementById('autoGrowInput');
    const messagesArea = document.getElementById('messagesArea');
    const heroTitle = document.getElementById('heroTitle');
    const loginNotice = document.getElementById('loginNotice');
    const sendBtn = document.getElementById('sendBtn');
    const inputBar = document.getElementById('inputBar');
    const sessionStatus = document.getElementById('sessionStatus');

    function autoGrow() {
        textarea.style.height = '24px';
        const scrollH = textarea.scrollHeight;
        if (scrollH > 24) {
            textarea.style.height = scrollH + 'px';
            textarea.style.overflowY = 'auto';
        } else {
            textarea.style.height = '24px';
            textarea.style.overflowY = 'hidden';
        }
    }
    textarea.addEventListener('input', autoGrow);
    textarea.addEventListener('focus', () => inputBar.classList.add('focused'));
    textarea.addEventListener('blur', () => inputBar.classList.remove('focused'));

    textarea.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    });

    sendBtn.addEventListener('click', sendMessage);

    // ---- login check ----
    // this only controls what the UI lets you do. the worker checks again
    // on its own server-side, so hitting the api directly still gets blocked.
    async function checkLogin() {
        try {
            const res = await fetch(AUTH_ME_URL, { credentials: 'include' });
            isLoggedIn = res.ok;
        } catch {
            isLoggedIn = false;
        }

        if (isLoggedIn) {
            loginNotice.classList.remove('show');
            textarea.disabled = false;
            sendBtn.disabled = false;
            sessionStatus.textContent = "Logged in";
        } else {
            loginNotice.classList.add('show');
            textarea.disabled = true;
            sendBtn.disabled = true;
            sessionStatus.textContent = "Not logged in";
        }
    }

    // very small markdown subset -> html. escapes html first so the ai
    // can't accidentally (or on purpose) inject real tags into the page.
    function markdownToHtml(text) {
        let html = text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');

        // pull fenced code blocks out first and stash the real html for
        // them, replacing with a placeholder token. this is what stops
        // things like "# comment" inside mcfunction code from turning
        // into a heading later on.
        const codeBlocks = [];
        html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
            const label = lang || 'code';
            codeBlocks.push(
                `<div class="md-code-wrap">` +
                `<div class="md-code-header">` +
                `<span class="md-code-lang">${label}</span>` +
                `<button class="code-copy-btn" type="button">` +
                `<img src="https://mcbcode.com/img/icons/copy.png" alt=""><span>Copy</span>` +
                `</button>` +
                `</div>` +
                `<pre class="md-code-block"><code>${code.trim()}</code></pre>` +
                `</div>`
            );
            return `\u0000CB${codeBlocks.length - 1}\u0000`;
        });

        // same idea for inline code, so `# not a heading` stays literal
        const inlineCodes = [];
        html = html.replace(/`([^`]+)`/g, (m, code) => {
            inlineCodes.push(`<code class="md-inline-code">${code}</code>`);
            return `\u0001IC${inlineCodes.length - 1}\u0001`;
        });

        // headers
        html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
        html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>');
        html = html.replace(/^# (.*)$/gm, '<h1>$1</h1>');

        // bold + italic
        html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

        // links
        html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
            '<a href="$2" target="_blank" rel="noopener" class="md-link">$1</a>');

        // unordered list items, then wrap consecutive ones in a <ul>
        html = html.replace(/(^|\n)-\s+(.*)/g, '$1<li>$2</li>');
        html = html.replace(/(<li>.*<\/li>\n?)+/g, (m) => `<ul class="md-list">${m}</ul>`);

        html = html.replace(/\n{2,}/g, '<br><br>');
        html = html.replace(/\n/g, '<br>');

        // put the protected code back in
        html = html.replace(/\u0001IC(\d+)\u0001/g, (m, i) => inlineCodes[i]);
        html = html.replace(/\u0000CB(\d+)\u0000/g, (m, i) => codeBlocks[i]);

        return html;
    }

    // walks the rendered markdown, wraps each word of plain text in a
    // fade-in span, but leaves code blocks alone so indentation/spacing
    // inside them isn't chopped up by the animation wrapping.
    function animateWordsPreservingHtml(el) {
        let wordIndex = 0;
        function walk(node) {
            Array.from(node.childNodes).forEach((child) => {
                if (child.nodeType === Node.TEXT_NODE) {
                    if (child.textContent.trim() === '') return;
                    const frag = document.createDocumentFragment();
                    child.textContent.split(/(\s+)/).forEach((part) => {
                        if (part.trim() === '') {
                            frag.appendChild(document.createTextNode(part));
                            return;
                        }
                        const span = document.createElement('span');
                        span.className = 'word-fade';
                        span.textContent = part;
                        span.style.animationDelay = (wordIndex * 0.035) + 's';
                        wordIndex++;
                        frag.appendChild(span);
                    });
                    node.replaceChild(frag, child);
                } else if (child.nodeType === Node.ELEMENT_NODE) {
                    if (child.tagName === 'PRE' || child.tagName === 'CODE' || child.classList.contains('md-code-wrap')) return;
                    walk(child);
                }
            });
        }
        walk(el);
    }

    function renderReply(el, text) {
        el.innerHTML = markdownToHtml(text);
        animateWordsPreservingHtml(el);
    }

    // ---- rendering messages ----
    function renderMessage(role, text, opts = {}) {
        if (!heroTitle.classList.contains('gone')) heroTitle.classList.add('gone');
        messagesArea.classList.add('has-messages');

        const row = document.createElement('div');
        row.className = 'msg-row ' + (role === 'user' ? 'user' : 'ai');

        const bubble = document.createElement('div');
        bubble.className = role === 'user' ? 'msg-user' : 'msg-ai';
        if (opts.error) bubble.classList.add('error-msg');

        if (opts.pending) {
            bubble.classList.add('pending');
            bubble.innerHTML = '<span class="dot-pulse"><span></span><span></span><span></span></span>';
        } else {
            bubble.textContent = text;
        }

        row.appendChild(bubble);

        if (role !== 'user') {
            const actions = document.createElement('div');
            actions.className = 'msg-actions';
            actions.style.display = opts.pending ? 'none' : 'flex';
            const time = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
            actions.innerHTML =
                `<button class="msg-copy-btn" type="button" title="Copy"><img src="https://mcbcode.com/img/icons/copy.png" alt="Copy"></button>` +
                `<span class="msg-timestamp">${time}</span>`;
            row.appendChild(actions);
            bubble._actionsEl = actions;
        }

        messagesArea.appendChild(row);
        messagesArea.scrollTop = messagesArea.scrollHeight;
        return bubble;
    }

    async function sendMessage() {
        if (isSending) return;
        if (!isLoggedIn) {
            await checkLogin();
            return;
        }

        let text = textarea.value.trim();
        if (!text) return;

        conversation.push({ role: 'user', content: text });
        renderMessage('user', text);
        const userRow = messagesArea.lastElementChild;

        textarea.value = '';
        textarea.style.height = '24px';
        textarea.style.overflowY = 'hidden';
        attachedFiles = [];
        renderFiles();

        isSending = true;
        sendBtn.disabled = true;
        const pendingEl = renderMessage('assistant', '', { pending: true });

        // snap-scroll so the message you just sent sits at the top of the
        // visible area, leaving room below it for the reply to fill in.
        requestAnimationFrame(() => {
            const containerRect = messagesArea.getBoundingClientRect();
            const rowRect = userRow.getBoundingClientRect();
            messagesArea.scrollTop += (rowRect.top - containerRect.top) - 10;
        });

        try {
            const res = await fetch(DRIPSTONE_API, {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: conversation }),
            });

            const data = await res.json();

            if (!res.ok) {
                pendingEl.classList.remove('pending');
                pendingEl.classList.add('error-msg');
                pendingEl.textContent = data.error || 'something went wrong.';
                if (res.status === 401) await checkLogin();
                return;
            }

            pendingEl.classList.remove('pending');
            renderReply(pendingEl, data.reply);
            if (pendingEl._actionsEl) pendingEl._actionsEl.style.display = 'flex';
            conversation.push({ role: 'assistant', content: data.reply });
        } catch (err) {
            pendingEl.classList.remove('pending');
            pendingEl.classList.add('error-msg');
            pendingEl.textContent = 'could not reach DripstoneAI. check your connection.';
        } finally {
            isSending = false;
            sendBtn.disabled = !isLoggedIn;
        }
    }

    // ---- file attachments (ui only for now, not sent to the ai yet) ----
    function handleFileSelect(event) {
        const files = Array.from(event.target.files);
        attachedFiles = [...attachedFiles, ...files];
        renderFiles();
        event.target.value = '';
    }

    function removeFile(index) {
        attachedFiles.splice(index, 1);
        renderFiles();
    }

    function renderFiles() {
        const container = document.getElementById('selectedFilesContainer');
        container.innerHTML = '';
        attachedFiles.forEach((file, index) => {
            const chip = document.createElement('div');
            chip.className = 'file-chip';
            chip.innerHTML = `
                <span>📄</span>
                <span>${file.name}</span>
                <span onclick="removeFile(${index})" title="Remove file">✕</span>
            `;
            container.appendChild(chip);
        });
    }

    // handles both the per-code-block copy buttons and the per-message
    // copy button. delegated on the whole page since these buttons get
    // created dynamically as replies come in.
    document.addEventListener('click', (e) => {
        const codeBtn = e.target.closest('.code-copy-btn');
        if (codeBtn) {
            const wrap = codeBtn.closest('.md-code-wrap');
            const codeEl = wrap.querySelector('code');
            navigator.clipboard.writeText(codeEl.textContent).then(() => {
                const label = codeBtn.querySelector('span');
                const original = label.textContent;
                label.textContent = 'Copied!';
                setTimeout(() => { label.textContent = original; }, 1200);
            });
            return;
        }

        const msgBtn = e.target.closest('.msg-copy-btn');
        if (msgBtn) {
            const bubble = msgBtn.closest('.msg-row').querySelector('.msg-ai');
            navigator.clipboard.writeText(bubble.innerText).then(() => {
                msgBtn.title = 'Copied!';
                setTimeout(() => { msgBtn.title = 'Copy'; }, 1200);
            });
        }
    });

    // shows a "jump to latest" button whenever you've scrolled up away
    // from the bottom of the conversation.
    const scrollBottomBtn = document.getElementById('scrollBottomBtn');
    messagesArea.addEventListener('scroll', () => {
        const distanceFromBottom = messagesArea.scrollHeight - messagesArea.scrollTop - messagesArea.clientHeight;
        scrollBottomBtn.classList.toggle('show', distanceFromBottom > 120);
    });
    scrollBottomBtn.addEventListener('click', () => {
        messagesArea.scrollTop = messagesArea.scrollHeight;
    });

    window.addEventListener('DOMContentLoaded', () => {
        checkLogin();
    });
</script>

</body>
</html>
