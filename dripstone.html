<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>mcbCode | Dripstone</title>

  <link rel="icon" href="https://mcbcode.com/theme/favicon.png">
  <link rel="stylesheet" href="https://mcbcode.com/theme/site.css">

  <style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
        background: transparent;
    }

    .bg-image {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        filter: blur(6px);
        transform: scale(1.05);
        z-index: -999;
    }

    .bg-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.65);
        z-index: -998;
        pointer-events: none;
    }

    .sidebar {
        background-color: #232323;
        color: #ffffff;
        height: 100%;
        position: fixed;
        top: 0;
        right: 0;
        width: 250px;
        box-sizing: border-box;
        border-left: 2px solid #05ee93;
        padding: 18px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: transform 0.3s ease;
        z-index: 100;
        border-radius: 0;
    }
    .sidebar.hidden {
        transform: translateX(100%);
    }
    .toggle-btn {
        position: fixed;
        top: 15px;
        right: 15px;
        background-color: #232323;
        color: #05ee93;
        border: 1px solid #05ee93;
        border-radius: 0;
        padding: 8px 12px;
        cursor: pointer;
        z-index: 101;
        font-size: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'mcfontb', sans-serif;
    }
    .toggle-btn:hover {
        background-color: #05ee93;
        color: #181818;
    }
    .sidebar-close-btn {
        background: transparent;
        border: none;
        color: #ffffff;
        font-size: 1.2rem;
        cursor: pointer;
        align-self: flex-end;
    }

    .main-container {
        width: 100%;
        height: 100%;
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
        transition: margin-right 0.3s ease;
    }

    @media (min-width: 769px) {
        body:not(.sidebar-hidden) .main-container {
            margin-right: 250px;
        }
    }

    .hero-title {
        font-size: 2.2rem;
        margin-bottom: 20px;
        font-family: 'mcfontb', sans-serif;
        text-align: center;
        padding: 0 10px;
        color: #ffffff;
        transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .hero-title span {
        color: #05ee93;
    }

    .main-container.chat-active .hero-title {
        opacity: 0;
        transform: translateY(-20px);
        pointer-events: none;
        position: absolute;
    }

    .chat-box-wrapper {
        width: 100%;
        max-width: 700px;
        background-color: #232323;
        border: 1px solid #333333;
        border-radius: 0;
        padding: 15px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        position: relative;
        transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), bottom 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .main-container.chat-active .chat-box-wrapper {
        position: absolute;
        bottom: 20px;
    }

    /* the actual conversation log. hidden until there's at least one message */
    .chat-messages {
        display: none;
        flex-direction: column;
        gap: 14px;
        max-height: 55vh;
        overflow-y: auto;
        margin-bottom: 12px;
        padding-right: 4px;
    }
    .chat-messages.has-messages {
        display: flex;
    }

    /* user messages: a bubble, right aligned, matches the sidebar accent */
    .msg-user {
        align-self: flex-end;
        max-width: 85%;
        background-color: #181818;
        border: 1px solid #05ee93;
        color: #ffffff;
        padding: 8px 12px;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: 'mcfont', sans-serif;
    }

    /* ai messages: just text, no bubble, left aligned */
    .msg-ai {
        align-self: flex-start;
        max-width: 100%;
        color: #dddddd;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: 'mcfont', sans-serif;
        line-height: 1.5;
    }
    .msg-ai.pending {
        color: #888888;
        font-style: italic;
    }
    .msg-ai.error-msg {
        color: #ff6b6b;
    }

    .selected-files-container {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;
    }
    .file-chip {
        background-color: #181818;
        border: 1px solid #05ee93;
        color: #ffffff;
        padding: 4px 8px;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        gap: 6px;
        border-radius: 0;
        font-family: 'mcfont', sans-serif;
    }
    .file-chip span {
        cursor: pointer;
        color: #05ee93;
        font-family: 'mcfontb', sans-serif;
    }

    .chat-textarea {
        width: 100%;
        background: transparent;
        border: none;
        color: #ffffff;
        font-size: 1rem;
        resize: none;
        outline: none;
        height: 24px;
        min-height: 24px;
        max-height: 200px;
        font-family: 'mcfont', sans-serif;
        line-height: 24px;
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        overflow-y: hidden;
    }
    .chat-textarea:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .login-notice {
        display: none;
        color: #ff9900;
        font-family: 'mcfont', sans-serif;
        font-size: 0.85rem;
        margin-bottom: 10px;
    }
    .login-notice a {
        color: #05ee93;
    }
    .login-notice.show {
        display: block;
    }

    .chat-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        border-top: 1px solid #333333;
        padding-top: 10px;
    }
    .extra-tools {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .file-upload-icon {
        height: 20px;
        width: 20px;
        cursor: pointer;
        filter: invert(1);
        display: block;
    }
    .file-upload-icon:hover {
        opacity: 0.8;
    }
    .send-btn {
        background-color: #05ee93;
        color: #181818;
        border: none;
        padding: 8px 16px;
        font-family: 'mcfontb', sans-serif;
        border-radius: 0;
        cursor: pointer;
    }
    .send-btn:hover {
        opacity: 0.9;
    }
    .send-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }
    h3 {
        font-family: 'mcfontb', sans-serif;
    }

    @media (max-width: 768px) {
        .sidebar {
            width: 85%;
            max-width: 320px;
        }
    }
  </style>
</head>
<body>

<img id="bgImage" class="bg-image" alt="Background">
<div class="bg-overlay"></div>

<button class="toggle-btn" id="sidebarToggle" onclick="toggleSidebar()">☰</button>

<div class="main-container" id="mainContainer">
    <div class="hero-title" id="heroTitle">what are we building?</div>

    <div class="chat-box-wrapper" id="chatBoxWrapper">
        <div class="chat-messages" id="chatMessages"></div>

        <div class="login-notice" id="loginNotice">
            you need to be logged in to use DripstoneAI. <a href="https://mcbcode.com/account">log in here</a>
        </div>

        <div class="selected-files-container" id="selectedFilesContainer"></div>
        <textarea class="chat-textarea" placeholder="Ask DripstoneAI anything... (Shift+Enter for new line)" id="autoGrowInput"></textarea>
        <div class="chat-controls">
            <div class="extra-tools">
                <label for="fileInput" title="Attach file">
                    <img src="https://mcbcode.com/img/icons/file.png" class="file-upload-icon" alt="Attach file">
                </label>
                <input type="file" id="fileInput" style="display: none;" multiple onchange="handleFileSelect(event)">
            </div>
            <button class="send-btn" id="sendBtn">Send</button>
        </div>
    </div>
</div>

<div class="sidebar" id="sidebar">
    <div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <img src="https://mcbcode.com/img/icons/default-transparent.png" style="height: 18px;">
                <h3 style="margin: 0;">DripstoneAI</h3>
            </div>
            <button class="sidebar-close-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <p style="margin-top: 0; color: #888; font-size: 0.9rem;">mcb<span style="color: #05ee93;">Code</span></p>
    </div>

    <div style="font-size: 0.85rem; color: #666; border-top: 1px solid #333; padding-top: 12px;">
        Session: <span id="sessionStatus">Checking...</span>
    </div>
</div>

<script>
    // ---- background renderer ----
    (function() {
        const bgImages = [
            'https://mcbcode.com/img/mc/nether_forest.png',
            'https://mcbcode.com/img/mc/end_city_one.png',
            'https://mcbcode.com/img/mc/end_city_two.png'
        ];
        const randomBg = bgImages[Math.floor(Math.random() * bgImages.length)];
        const imgElement = document.getElementById('bgImage');
        if (imgElement) imgElement.src = randomBg;
    })();

    const DRIPSTONE_API = "https://dripstone-ai.mcbcode.com";
    const AUTH_ME_URL = "https://auth.mcbcode.com/me";

    let attachedFiles = [];
    let conversation = []; // [{role: "user"|"assistant", content: "..."}]
    let isLoggedIn = false;
    let isSending = false;

    const textarea = document.getElementById('autoGrowInput');
    const mainContainer = document.getElementById('mainContainer');
    const chatMessages = document.getElementById('chatMessages');
    const loginNotice = document.getElementById('loginNotice');
    const sendBtn = document.getElementById('sendBtn');
    const sessionStatus = document.getElementById('sessionStatus');

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('hidden');
        document.body.classList.toggle('sidebar-hidden', sidebar.classList.contains('hidden'));
    }

    function autoGrow() {
        textarea.style.height = '24px';
        const scrollH = textarea.scrollHeight;
        if (scrollH > 24) {
            textarea.style.height = scrollH + 'px';
            textarea.style.overflowY = 'auto';
        } else {
            textarea.style.height = '24px';
            textarea.style.overflowY = 'hidden';
        }
    }
    textarea.addEventListener('input', autoGrow);

    textarea.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    });

    sendBtn.addEventListener('click', sendMessage);

    // ---- login check ----
    // this ONLY controls what the ui lets you do. the worker checks again
    // on its own, so someone hitting the api directly still gets blocked.
    async function checkLogin() {
        try {
            const res = await fetch(AUTH_ME_URL, { credentials: 'include' });
            isLoggedIn = res.ok;
        } catch {
            isLoggedIn = false;
        }

        if (isLoggedIn) {
            loginNotice.classList.remove('show');
            textarea.disabled = false;
            sendBtn.disabled = false;
            sessionStatus.textContent = "Logged in";
        } else {
            loginNotice.classList.add('show');
            textarea.disabled = true;
            sendBtn.disabled = true;
            sessionStatus.textContent = "Not logged in";
        }
    }

    // ---- rendering messages ----
    function renderMessage(role, text, opts = {}) {
        const el = document.createElement('div');
        el.className = role === 'user' ? 'msg-user' : 'msg-ai';
        if (opts.pending) el.classList.add('pending');
        if (opts.error) el.classList.add('error-msg');
        el.textContent = text;
        chatMessages.appendChild(el);
        chatMessages.classList.add('has-messages');
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return el;
    }

    async function sendMessage() {
        if (isSending) return;
        if (!isLoggedIn) {
            await checkLogin();
            return;
        }

        let text = textarea.value.trim();
        if (!text) return;

        mainContainer.classList.add('chat-active');

        conversation.push({ role: 'user', content: text });
        renderMessage('user', text);

        textarea.value = '';
        textarea.style.height = '24px';
        textarea.style.overflowY = 'hidden';
        attachedFiles = [];
        renderFiles();

        isSending = true;
        sendBtn.disabled = true;
        const pendingEl = renderMessage('assistant', 'thinking...', { pending: true });

        try {
            const res = await fetch(DRIPSTONE_API, {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: conversation }),
            });

            const data = await res.json();

            if (!res.ok) {
                pendingEl.remove();
                renderMessage('assistant', data.error || 'something went wrong.', { error: true });
                if (res.status === 401) await checkLogin();
                return;
            }

            pendingEl.remove();
            conversation.push({ role: 'assistant', content: data.reply });
            renderMessage('assistant', data.reply);
        } catch (err) {
            pendingEl.remove();
            renderMessage('assistant', 'could not reach DripstoneAI. check your connection.', { error: true });
        } finally {
            isSending = false;
            sendBtn.disabled = !isLoggedIn;
        }
    }

    // ---- file attachments (ui only for now, not sent to the ai yet) ----
    function handleFileSelect(event) {
        const files = Array.from(event.target.files);
        attachedFiles = [...attachedFiles, ...files];
        renderFiles();
        event.target.value = '';
    }

    function removeFile(index) {
        attachedFiles.splice(index, 1);
        renderFiles();
    }

    function renderFiles() {
        const container = document.getElementById('selectedFilesContainer');
        container.innerHTML = '';
        attachedFiles.forEach((file, index) => {
            const chip = document.createElement('div');
            chip.className = 'file-chip';
            chip.innerHTML = `
                <span>📄</span>
                <span>${file.name}</span>
                <span onclick="removeFile(${index})" title="Remove file">✕</span>
            `;
            container.appendChild(chip);
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        if (window.innerWidth <= 768) {
            document.getElementById('sidebar').classList.add('hidden');
            document.body.classList.add('sidebar-hidden');
        }
        checkLogin();
    });
</script>

</body>
</html>
